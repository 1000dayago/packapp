rId) {\n        var req = idx.openCursor(IDBKeyRange.only(ownerId));\n        req.onsuccess = function (e) {\n          var cursor = e.target.result;\n          if (cursor) {\n            var rec = cursor.value;\n            rec.downloadedAt = now;\n            cursor.update(rec);\n            cursor.continue();\n          } else {\n            done();\n          }\n        };\n        req.onerror = done;\n      });\n    });\n  }).catch(function () {});\n}\n// 다운로드를 마친 지 maxAgeMs 이상 지난 사진 백업을 지운다. maxAgeMs가 0이면\n// \"다운로드를 마친 것\"은 모두 즉시 정리 대상이 된다(수동 정리용). 다운로드 전 항목은 절대 건드리지 않는다.\nfunction cleanupShipPhotoBackups(maxAgeMs) {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve) {\n      var tx = db.transaction('photos', 'readwrite');\n      var store = tx.objectStore('photos');\n      var now = Date.now();\n      var deleted = 0;\n      var req = store.openCursor();\n      req.onsuccess = function (e) {\n        var cursor = e.target.result;\n        if (cursor) {\n          var rec = cursor.value;\n          if (rec.downloadedAt && (now - rec.downloadedAt) >= maxAgeMs) {\n            cursor.delete();\n            deleted++;\n          }\n          cursor.continue();\n        } else {\n          resolve(deleted);\n        }\n      };\n      req.onerror = function () { resolve(deleted); };\n    });\n  }).catch(function () { return 0; });\n}\nfunction countAllShipPhotoRecords() {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve, reject) {\n      var tx = db.transaction('photos', 'readonly');\n      var req = tx.objectStore('photos').count();\n      req.onsuccess = function () { resolve(req.result); };\n      req.onerror = function () { reject(req.error); };\n    });\n  }).catch(function () { return 0; });\n}\n// 백업 저장소의 사진 전부(어떤 항목 소유인지 상관없이)를 가져온다 — 내보내기(export)용.\nfunction dbGetAllShipPhotos() {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve, reject) {\n      var tx = db.transaction('photos', 'readonly');\n      var req = tx.objectStore('photos').getAll();\n      req.onsuccess = function () { resolve(req.result || []); };\n      req.onerror = function () { reject(req.error); };\n    });\n  }).catch(function () { return []; });\n}\nfunction blobToBase64(blob) {\n  return blob.arrayBuffer().then(function (buf) {\n    var bytes = new Uint8Array(buf);\n    var chunk = 0x8000; // 콜 스택 한도를 피하기 위해 32KB씩 나눠서 문자열로 변환\n    var binStr = '';\n    for (var i = 0; i < bytes.length; i += chunk) {\n      binStr += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));\n    }\n    return btoa(binStr);\n  });\n}\nfunction base64ToBlob(base64, type) {\n  var binStr = atob(base64);\n  var bytes = new Uint8Array(binStr.length);\n  for (var i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);\n  return new Blob([bytes], { type: type || 'image/jpeg' });\n}\n\n// ---------- 전체 백업 내보내기/가져오기 ----------\n// 이 파일을 다른 폴더로 옮기거나 이름을 바꾸면 브라우저가 저장해 둔 데이터를 못 찾을 수 있어,\n// 회사 목록/이력/임시저장/사진을 한 파일로 내보내고 다시 불러올 수 있게 한다.\nasync function exportFullBackup() {\n  const statusEl = document.getElementById('backupStatus');\n  statusEl.textContent = '백업 파일 만드는 중...';\n  try {\n    const draftsMeta = await storeGet('drafts', []);\n    const photoRecords = await dbGetAllShipPhotos();\n    const photos = [];\n    for (const p of photoRecords) {\n      photos.push({\n        ownerId: p.ownerId, role: p.role, order: p.order, name: p.name,\n        downloadedAt: p.downloadedAt || null,\n        type: (p.blob && p.blob.type) || 'image/jpeg',\n        dataBase64: await blobToBase64(p.blob)\n      });\n    }\n    const payload = {\n      appVersion: 'shipping_backup_v1', exportedAt: new Date().toISOString(),\n      companies, logEntries, drafts: draftsMeta, photos\n    };\n    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });\n    const url = URL.createObjectURL(blob);\n    const a = document.createElement('a');\n    const now = new Date();\n    const stamp = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0')\n      + '_' + String(now.getHours()).padStart(2, '0') + String(now.getMinutes()).padStart(2, '0');\n    a.href = url; a.download = `출고관리_백업_${stamp}.json`;\n    a.click();\n    setTimeout(() => URL.revokeObjectURL(url), 1500);\n    statusEl.textContent = `백업 파일을 받았습니다 (사진 ${photos.length}장 포함). 새 파일을 열면 \"백업 가져오기\"로 불러오세요.`;\n  } catch (e) {\n    statusEl.textContent = '백업 파일을 만들지 못했습니다.';\n  }\n}\n\nfunction onBackupFileSelected(event) {\n  const file = event.target.files && event.target.files[0];\n  event.target.value = '';\n  if (!file) return;\n  const statusEl = document.getElementById('backupStatus');\n  const reader = new FileReader();\n  reader.onload = async (e) => {\n    let payload;\n    try { payload = JSON.parse(e.target.result); }\n    catch (err) { statusEl.textContent = '백업 파일을 읽지 못했습니다(형식이 올바르지 않음).'; return; }\n    if (!payload || payload.appVersion !== 'shipping_backup_v1') {\n      statusEl.textContent = '이 프로그램의 백업 파일이 아닙니다.';\n      return;\n    }\n    await importFullBackupPayload(payload, statusEl);\n  };\n  reader.onerror = () => { statusEl.textContent = '백업 파일을 읽지 못했습니다.'; };\n  reader.readAsText(file);\n}\n\nasync function importFullBackupPayload(payload, statusEl) {\n  statusEl.textContent = '백업 불러오는 중...';\n  try {\n    // 업체 목록: 겹치지 않는 것만 추가\n    (payload.companies || []).forEach(c => { if (!companies.includes(c)) companies.push(c); });\n    await storeSet('companies', companies);\n\n    // 이력: id가 겹치지 않는 것만 추가 (겹치면 이미 있는 것으로 보고 건너뜀)\n    const existingLogIds = new Set(logEntries.map(e => e.id));\n    let addedLogs = 0;\n    (payload.logEntries || []).forEach(e => {\n      if (!existingLogIds.has(e.id)) { logEntries.push(e); addedLogs++; }\n    });\n    logEntries.sort((a, b) => (b.time || '').localeCompare(a.time || ''));\n    await storeSet('log', logEntries);\n\n    // 임시저장 메타: draftId가 겹치지 않는 것만 추가\n    const existingDrafts = await storeGet('drafts', []);\n    const existingDraftIds = new Set(existingDrafts.map(d => d.draftId));\n    let addedDrafts = 0;\n    (payload.drafts || []).forEach(d => {\n      if (!existingDraftIds.has(d.draftId)) { existingDrafts.push(d); addedDrafts++; }\n    });\n    await storeSet('drafts', existingDrafts);\n\n    // 사진: 이미 그 소유(ownerId)의 사진이 있으면 중복 방지를 위해 그 소유자 전체를 건너뛰고,\n    // 없는 소유자는 사진 전부를 새로 기록한다 (owner 단위로 판단해야 일부만 저장되는 사고를 막을 수 있다).\n    const photosByOwner = {};\n    (payload.photos || []).forEach(p => {\n      (photosByOwner[p.ownerId] = photosByOwner[p.ownerId] || []).push(p);\n    });\n    let addedPhotos = 0;\n    for (const ownerId of Object.keys(photosByOwner)) {\n      const existing = await dbGetShipPhotosForOwner(ownerId);\n      if (existing.length > 0) continue; // 이미 이 소유자의 사진 백업이 있음 -> 건너뜀(중복 방지)\n      for (const p of photosByOwner[ownerId]) {\n        const blob = base64ToBlob(p.dataBase64, p.type);\n        const rec = { ownerId: p.ownerId, role: p.role, order: p.order, blob, name: p.name };\n        if (p.downloadedAt) rec.downloadedAt = p.downloadedAt;\n        await dbAddShipPhoto(rec);\n        addedPhotos++;\n      }\n    }\n\n    await restoreDraftsFromBackup();\n    await restoreFinalizedFromBackup();\n    renderCompanies(); renderLog(); updatePendingBadge(); renderDraftList();\n    await updatePhotoBackupInfo();\n\n    statusEl.textContent = `백업을 불러왔습니다 (이력 ${addedLogs}건, 임시저장 ${addedDrafts}건, 사진 ${addedPhotos}장 추가).`;\n  } catch (e) {\n    statusEl.textContent = '백업을 불러오는 중 문제가 생겼습니다.';\n  }\n}\nvar SHIP_PHOTO_RETENTION_MS = 7 * 24 * 60 * 60 * 1000; // 다운로드한 지 7일 지나면 자동 정리\nasync function updatePhotoBackupInfo() {\n  const el = document.getElementById('photoBackupInfo');\n  if (!el) return;\n  const count = await countAllShipPhotoRecords();\n  el.textContent = count > 0\n    ? `사진 백업 ${count}장 보관 중 (다운로드한 지 7일 지나면 자동 정리)`\n    : '사진 백업 없음';\n}\nasync function manualCleanupPhotoBackups() {\n  if (!confirm('다운로드를 이미 마친 사진 백업을 지금 정리할까요? 아직 다운로드하지 않은 사진은 지워지지 않습니다.')) return;\n  const deleted = await cleanupShipPhotoBackups(0);\n  await updatePhotoBackupInfo();\n  document.getElementById('zipStatus').textContent = deleted > 0 ? `사진 백업 ${deleted}장 정리했습니다.` : '정리할 백업이 없습니다(다운로드 전이거나 이미 정리됨).';\n}\n// 항목 하나(draftId 또는 entryId)의 사진들을 role별로 순서대로 DB에 써 둔다.\nfunction persistPhotosForOwner(ownerId, labelFile, qtyFiles, invoiceFiles) {\n  var writes = [];\n  if (labelFile) writes.push(dbAddShipPhoto({ ownerId: ownerId, role: 'label', order: 0, blob: labelFile, name: labelFile.name || '' }));\n  (qtyFiles || []).forEach(function (f, idx) { writes.push(dbAddShipPhoto({ ownerId: ownerId, role: 'qty', order: idx, blob: f, name: f.name || '' })); });\n  (invoiceFiles || []).forEach(function (f, idx) { writes.push(dbAddShipPhoto({ ownerId: ownerId, role: 'invoice', order: idx, blob: f, name: f.name || '' })); });\n  return Promise.all(writes).catch(function () { /* 백업 실패해도 현재 작업(메모리상 데이터)에는 지장 없음 */ });\n}\n// draftEntries 중 File 객체를 뺀 글자 정보만 저장소에 남긴다 (사진은 위 IndexedDB에 별도 보관).\nfunction persistDraftsMeta() {\n  var meta = draftEntries.map(function (d) {\n    return { draftId: d.draftId, company: d.company, product: d.product, lot: d.lot, perBox: d.perBox,\n      boxCount: d.boxCount, total: d.total, mode: d.mode, recogType: d.recogType, invoiceNumber: d.invoiceNumber,\n      packing: !!d.packing, photoOnly: !!d.photoOnly, planKey: d.planKey || '' };\n  });\n  storeSet('drafts', meta);\n}\n\nasync function storeGet(key, fallback) {\n  try { const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }\n  catch (e) { return fallback; }\n}\nasync function storeSet(key, value) {\n  try { await window.storage.set(key, JSON.stringify(value), false); } catch (e) { console.error(e); }\n}\n\n// 사진 백업(IndexedDB)에서 임시저장 항목들을 복구한다. 사진이 아예 없는 항목은\n// (백업 자체가 실패했거나 이 기능 적용 이전의 매우 오래된 데이터) 혼란을 줄 수 있어 건너뛴다.\nasync function restoreDraftsFromBackup() {\n  const meta = await storeGet('drafts', []);\n  draftEntries = [];\n  let dropped = false;\n  for (const m of meta) {\n    let photos = [];\n    try { photos = await dbGetShipPhotosForOwner(m.draftId); } catch (e) { photos = []; }\n    const label = photos.filter(p => p.role === 'label').sort((a, b) => a.order - b.order)[0];\n    const qty = photos.filter(p => p.role === 'qty').sort((a, b) => a.order - b.order).map(p => p.blob);\n    const invoice = photos.filter(p => p.role === 'invoice').sort((a, b) => a.order - b.order).map(p => p.blob);\n    if ((!label && !m.photoOnly) || !qty.length) { dropped = true; continue; }\n    draftEntries.push({\n      draftId: m.draftId, company: m.company, product: m.product, lot: m.lot, perBox: m.perBox,\n      boxCount: m.boxCount, total: m.total, mode: m.mode, recogType: m.recogType, invoiceNumber: m.invoiceNumber,\n      labelFile: label ? label.blob : null, qtyFiles: qty, invoiceFiles: invoice,\n      packing: !!m.packing, photoOnly: !!m.photoOnly, planKey: m.planKey || ''\n    });\n  }\n  if (dropped) persistDraftsMeta(); // 사진이 없어 복구하지 못한 항목은 목록에서도 정리\n}\n\n// 사진 백업(IndexedDB)에서 완료(다운로드 대상) 항목들을 복구한다. 백업이 없는 지난 기록은\n// 기존처럼 글자 정보 수정/삭제만 가능한 상태로 남는다(사진 자체는 되살릴 수 없음).\nasync function restoreFinalizedFromBackup() {\n  finalizedEntries = [];\n  sessionFiles = [];\n  for (const e of logEntries) {\n    let photos = [];\n    try { photos = await dbGetShipPhotosForOwner(e.id); } catch (err) { photos = []; }\n    if (!photos.length) continue;\n    photos.sort((a, b) => a.order - b.order);\n    const fileNames = [];\n    photos.forEach(p => { sessionFiles.push({ name: p.name, file: p.blob }); fileNames.push(p.name); });\n    const label = photos.find(p => p.role === 'label');\n    const qty = photos.filter(p => p.role === 'qty').map(p => p.blob);\n    const invoice = photos.filter(p => p.role === 'invoice').map(p => p.blob);\n    finalizedEntries.push({\n      id: e.id, company: e.company, product: e.product, lot: e.lot, perBox: e.perBox, boxCount: e.boxCount,\n      total: e.total, mode: e.modeLabel === '입고' ? 'in' : 'out', recogType: e.recogType || 'sleeve',\n      labelFile: label ? label.blob : null, qtyFiles: qty, invoiceFiles: invoice,\n      invoiceNumber: e.invoiceNumber || '', fileNames,\n      packing: !!e.packing, photoOnly: !!e.photoOnly, planKey: e.planKey || ''\n    });\n  }\n  downloadedFileCount = 0; // 새로고침 직후라 이번 실행에서는 아직 다운로드하지 않은 것으로 취급\n}\n\nasync function init() {\n  companies = await storeGet('companies', null);\n  if (!companies || !companies.length) {\n    companies = DEFAULT_COMPANIES.slice();\n    await storeSet('companies', companies);\n  }\n  logEntries = await storeGet('log', []);\n  await cleanupShipPhotoBackups(SHIP_PHOTO_RETENTION_MS); // 다운로드한 지 7일 지난 사진 백업 자동 정리 (다운로드 전 항목은 대상 아님)\n  await restoreDraftsFromBackup();\n  await restoreFinalizedFromBackup();\n  renderCompanies(); renderLog(); updatePendingBadge(); renderDraftList();\n  updatePhotoBackupInfo();\n  showAlsBuilder('', '', '');\n  // 인식 엔진을 미리 준비해 첫 촬영 시 대기시간을 줄임 (실패해도 무시)\n  getWorker().catch(() => {});\n  getSealWorker().catch(() => {});\n  getInvoiceWorker().catch(() => {});\n  showLotSleeveBuilder('', '', '', '', '');\n  packInit();\n}\ninit();\n\n// 저장 안 된 사진(임시저장/다운로드 대기/방금 촬영 중인 사진)이 있는데 실수로 새로고침·페이지 이탈하는 것을 막기 위한 경고\nwindow.addEventListener('beforeunload', function (e) {\n  const hasPending = draftEntries.length > 0 || sessionFiles.length > 0\n    || !!state.labelFile || state.qtyFiles.length > 0 || state.invoiceFiles.length > 0 || packDirty();\n  if (hasPending) {\n    e.preventDefault();\n    e.returnValue = ''; // 문구는 브라우저가 자체적으로 표시(사이트가 직접 문구를 정할 수 없음)\n  }\n});\n\nfunction renderCompanies() {\n  const sel = document.getElementById('companySelect');\n  sel.innerHTML = '<option value=\"\">-- 업체 선택 --<\/option>'\n    + companies.map(c => `<option value=\"${c}\">${c}<\/option>`).join('')\n    + '<option value=\"__new__\">새로운 업체 추가<\/option>';\n  sel.value = state.company || '';\n}\n\n// ---------- 업체 관리(수정/삭제) ----------\nlet companyManagerEditingIdx = null; // 지금 이름을 수정 중인 업체의 배열 인덱스 (없으면 null)\n\nfunction openCompanyManager() {\n  companyManagerEditingIdx = null;\n  renderCompanyManagerList();\n  document.getElementById('companyManagerModal').style.display = 'flex';\n}\nfunction closeCompanyManager() {\n  document.getElementById('companyManagerModal').style.display = 'none';\n  companyManagerEditingIdx = null;\n}\n\nfunction renderCompanyManagerList() {\n  const wrap = document.getElementById('companyManagerList');\n  if (!companies.length) {\n    wrap.innerHTML = '<div style=\"font-size:13px; color:#888;\">등록된 업체가 없습니다.<\/div>';\n    return;\n  }\n  wrap.innerHTML = companies.map((c, idx) => {\n    if (idx === companyManagerEditingIdx) {\n      return `<div class=\"row\" style=\"align-items:center; gap:4px; margin-bottom:6px;\">\n        <input type=\"text\" id=\"companyRenameInput\" value=\"${c.replace(/\"/g, '&quot;')}\" style=\"flex:1; margin-bottom:0;\" onkeypress=\"if(event.key==='Enter') saveRenameCompany(${idx})\">\n        <button class=\"secondary\" style=\"flex:0 0 44px; width:auto; padding:8px 4px; font-size:12px; margin-bottom:0;\" onclick=\"saveRenameCompany(${idx})\">저장<\/button>\n        <button class=\"gray\" style=\"flex:0 0 44px; width:auto; padding:8px 4px; font-size:12px; margin-bottom:0;\" onclick=\"cancelRenameCompany()\">취소<\/button>\n      <\/div>`;\n    }\n    return `<div class=\"row\" style=\"align-items:center; gap:4px; margin-bottom:6px;\">\n      <div style=\"flex:1; font-size:14px; padding:8px 2px; word-break:break-all;\">${c}<\/div>\n      <button class=\"secondary\" style=\"flex:0 0 44px; width:auto; padding:8px 4px; font-size:12px; margin-bottom:0;\" onclick=\"startRenameCompany(${idx})\">수정<\/button>\n      <button class=\"danger-btn\" style=\"flex:0 0 44px; width:auto; padding:8px 4px; font-size:12px; margin-bottom:0; background:#c0392b; color:#fff; border:none; border-radius:8px; cursor:pointer;\" onclick=\"deleteCompanyAt(${idx})\">삭제<\/button>\n    <\/div>`;\n  }).join('');\n  if (companyManagerEditingIdx !== null) {\n    const inp = document.getElementById('companyRenameInput');\n    if (inp) { inp.focus(); inp.select(); }\n  }\n}\n\nfunction startRenameCompany(idx) {\n  companyManagerEditingIdx = idx;\n  renderCompanyManagerList();\n}\nfunction cancelRenameCompany() {\n  companyManagerEditingIdx = null;\n  renderCompanyManagerList();\n}\n\nasync function saveRenameCompany(idx) {\n  const input = document.getElementById('companyRenameInput');\n  const newName = input.value.trim();\n  if (!newName) { alert('업체명을 입력해 주세요.'); return; }\n  const oldName = companies[idx];\n  if (newName !== oldName && companies.some((c, i) => i !== idx && c === newName)) {\n    alert('이미 있는 업체명입니다.');\n    return;\n  }\n  companies[idx] = newName;\n  await storeSet('companies', companies);\n  if (state.company === oldName) state.company = newName;\n  companyManagerEditingIdx = null;\n  renderCompanyManagerList();\n  renderCompanies();\n  // 지난 출고 이력에 남은 업체명은 과거 기록 그대로 두고, 새 촬영부터 새 이름이 적용된다.\n}\n\nasync function deleteCompanyAt(idx) {\n  const name = companies[idx];\n  if (!confirm('\"' + name + '\" 업체를 목록에서 삭제할까요? 이미 저장된 출고 이력의 업체명은 그대로 남습니다.')) return;\n  companies.splice(idx, 1);\n  await storeSet('companies', companies);\n  if (state.company === name) {\n    state.company = '';\n    const sel = document.getElementById('companySelect');\n    if (sel) sel.value = '';\n  }\n  renderCompanyManagerList();\n  renderCompanies();\n}\n\nfunction onCompanySelectChange() {\n  const sel = document.getElementById('companySelect');\n  if (sel.value === '__new__') {\n    sel.style.display = 'none';\n    const row = document.getElementById('newCompanyRow');\n    row.style.display = 'flex';\n    const input = document.getElementById('newCompanyInput');\n    input.value = '';\n    input.focus();\n  } else {\n    state.company = sel.value;\n  }\n}\n\nasync function addCompany() {\n  const input = document.getElementById('newCompanyInput');\n  const name = input.value.trim();\n  if (!name) return;\n  if (!companies.includes(name)) companies.push(name);\n  await storeSet('companies', companies);\n  input.value = '';\n  renderCompanies();\n  document.getElementById('companySelect').value = name;\n  document.getElementById('companySelect').style.display = 'block';\n  document.getElementById('newCompanyRow').style.display = 'none';\n  state.company = name;\n}\n\nfunction binarizeCanvas(canvas) {\n  const w = canvas.width, h = canvas.height;\n  const ctx = canvas.getContext('2d');\n  const imgData = ctx.getImageData(0, 0, w, h);\n  const d = imgData.data;\n  let gray = new Float64Array(w * h);\n  for (let i = 0; i < d.length; i += 4) {\n    gray[i / 4] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];\n  }\n\n  // 잔노이즈 제거를 위한 약한 블러 (가로->세로 분리 적용으로 속도 향상)\n  const temp = new Float64Array(w * h);\n  const blurred = new Float64Array(w * h);\n  for (let y = 0; y < h; y++) {\n    const rowBase = y * w;\n    for (let x = 0; x < w; x++) {\n      const x0 = Math.max(0, x - 1), x1 = Math.min(w - 1, x + 1);\n      temp[rowBase + x] = (gray[rowBase + x0] + gray[rowBase + x] + gray[rowBase + x1]) / 3;\n    }\n  }\n  for (let y = 0; y < h; y++) {\n    const y0 = Math.max(0, y - 1) * w, y1 = y * w, y2 = Math.min(h - 1, y + 1) * w;\n    for (let x = 0; x < w; x++) {\n      blurred[y1 + x] = (temp[y0 + x] + temp[y1 + x] + temp[y2 + x]) / 3;\n    }\n  }\n  gray = blurred;\n\n  // 적응형(local adaptive) 이진화: 조명이 한쪽으로 치우친 사진에서도 글자만 또렷하게 분리\n  const integral = new Float64Array((w + 1) * (h + 1));\n  for (let y = 0; y < h; y++) {\n    let rowSum = 0;\n    const rowOff = (y + 1) * (w + 1);\n    const prevRowOff = y * (w + 1);\n    for (let x = 0; x < w; x++) {\n      rowSum += gray[y * w + x];\n      integral[rowOff + x + 1] = integral[prevRowOff + x + 1] + rowSum;\n    }\n  }\n  const win = Math.max(15, Math.floor(w / 10));\n  const half = Math.floor(win / 2);\n  const t = 0.15; // 지역 평균보다 15% 어두우면 글자(검정)로 판단\n  for (let y = 0; y < h; y++) {\n    for (let x = 0; x < w; x++) {\n      const x1 = Math.max(0, x - half), x2 = Math.min(w - 1, x + half);\n      const y1 = Math.max(0, y - half), y2 = Math.min(h - 1, y + half);\n      const count = (x2 - x1 + 1) * (y2 - y1 + 1);\n      const sum = integral[(y2 + 1) * (w + 1) + (x2 + 1)]\n                - integral[y1 * (w + 1) + (x2 + 1)]\n                - integral[(y2 + 1) * (w + 1) + x1]\n                + integral[y1 * (w + 1) + x1];\n      const mean = sum / count;\n      const idx = y * w + x;\n      const v = gray[idx] < mean * (1 - t) ? 0 : 255;\n      const di = idx * 4;\n      d[di] = d[di + 1] = d[di + 2] = v;\n    }\n  }\n  ctx.putImageData(imgData, 0, 0);\n}\n\nfunction loadImageEl(file) {\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n    img.onerror = reject;\n    img.src = URL.createObjectURL(file);\n  });\n}\n\n// ---------- 브라우저 내장 고속 OCR (Chrome/삼성인터넷의 TextDetector) ----------\n// 기기가 지원하면 이걸 먼저 쓰고, 지원하지 않거나 실패하면 기존 Tesseract 방식으로 자동 전환\nconst hasNativeOCR = (typeof window !== 'undefined') && ('TextDetector' in window);\nlet nativeDetector = null;\n\nasync function nativeDetectText(file, targetW) {\n  if (!hasNativeOCR) return null;\n  try {\n    if (!nativeDetector) nativeDetector = new window.TextDetector();\n    const img = await loadImageEl(file);\n    const w = targetW || 1600;\n    const scale = Math.min(1, w / img.width);\n    const canvas = document.createElement('canvas');\n    canvas.width = Math.round(img.width * scale);\n    canvas.height = Math.round(img.height * scale);\n    const ctx = canvas.getContext('2d');\n    ctx.imageSmoothingEnabled = true;\n    ctx.imageSmoothingQuality = 'high';\n    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);\n    const blocks = await nativeDetector.detect(canvas);\n    if (!blocks || !blocks.length) return null;\n    return blocks.map(b => b.rawValue).join('\\n');\n  } catch (e) {\n    console.warn('native OCR unavailable:', e);\n    return null;\n  }\n}\n\nfunction preprocessImage(file, customWidth) {\n  return loadImageEl(file).then(img => {\n    const targetW = customWidth || 1300; // 속도 우선: 작은 스티커는 직접 선택(크롭) 도구가 더 빠르고 정확함\n    const scale = targetW / img.width;\n    const w = Math.round(img.width * scale);\n    const h = Math.round(img.height * scale);\n    const canvas = document.createElement('canvas');\n    canvas.width = w; canvas.height = h;\n    const ctx = canvas.getContext('2d');\n    ctx.imageSmoothingEnabled = true;\n    ctx.imageSmoothingQuality = 'high';\n    ctx.drawImage(img, 0, 0, w, h);\n    binarizeCanvas(canvas);\n    return canvas.toDataURL('image/png');\n  });\n}\n\n// OCR이 자주 헷갈리는 글자를 정규화 (O->0, I/l->1, Z->2, S->5, G->6, T->7, B는 문맥상 유지)\nfunction normalizeDigits(s) {\n  return s.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1').replace(/[Zz]/g, '2')\n          .replace(/[Ss]/g, '5').replace(/[Gg]/g, '6').replace(/[Tt]/g, '7');\n}\n\nfunction parseV2B(text) {\n  // V가 U/Y로, 2가 Z로, B가 8로 읽히는 경우까지 허용\n  let m = text.match(/[VUY]\\s*[2Zz]\\s*[B8][\\s\\-_.]*([0-9OoIlZzSsGgTt]{2,6})[\\s\\-_.]*([EKFR])\\b/i);\n  if (m) return { product: '0201-003797', lot: `V2B-${normalizeDigits(m[1])}-${m[2].toUpperCase() === 'F' ? 'E' : (m[2].toUpperCase() === 'R' ? 'K' : m[2].toUpperCase())}` };\n  m = text.match(/[VUY]\\s*[2Zz]\\s*[B8][\\s\\-_.]*([0-9OoIlZzSsGgTt]{2,6})/i);\n  if (m) return { product: '0201-003797', lot: `V2B-${normalizeDigits(m[1])}` };\n  return null;\n}\n\nfunction parse77(text) {\n  // 7이 T/Z로 읽히는 경우까지 허용\n  let m = text.match(/(?:^|[^0-9A-Z])[7T][7T][\\s\\-_.]*([0-9OoIlZzSsGgTt]{2,6})[\\s\\-_.]*([EKFR])\\b/i);\n  if (m) return { product: '0201-003450', lot: `77-${normalizeDigits(m[1])}-${m[2].toUpperCase() === 'F' ? 'E' : (m[2].toUpperCase() === 'R' ? 'K' : m[2].toUpperCase())}` };\n  m = text.match(/(?:^|[^0-9A-Z])[7T][7T][\\s\\-_.]*([0-9OoIlZzSsGgTt]{2,6})/i);\n  if (m) return { product: '0201-003450', lot: `77-${normalizeDigits(m[1])}` };\n  return null;\n}\n\n\nlet ocrWorker = null;\nasync function getWorker() {\n  if (ocrWorker) return ocrWorker;\n  ocrWorker = await Tesseract.createWorker('eng', 1, PACK_TESS);\n  await ocrWorker.setParameters({\n    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-.(), :',\n    tessedit_pageseg_mode: '6' // 식별표(락슬리브)처럼 글자가 빽빽한 문서에 적합\n  });\n  return ocrWorker;\n}\n\n// 락실 스티커 전용 워커: 인식 가능한 문자를 숫자와 V/B/E/K/하이픈으로만 제한해 오인식을 크게 줄임\nlet sealWorker = null;\nasync function getSealWorker() {\n  if (sealWorker) return sealWorker;\n  sealWorker = await Tesseract.createWorker('eng', 1, PACK_TESS);\n  await sealWorker.setParameters({\n    tessedit_char_whitelist: '0123456789VBEK-',\n    tessedit_pageseg_mode: '11' // 넓은 배경에 흩어진 짧은 글자 탐색\n  });\n  return sealWorker;\n}\n\n// 인보이스 전용 워커: AEBXP/VEBXP + 숫자만 인식하도록 제한\nlet invoiceWorker = null;\nasync function getInvoiceWorker() {\n  if (invoiceWorker) return invoiceWorker;\n  invoiceWorker = await Tesseract.createWorker('eng', 1, PACK_TESS);\n  await invoiceWorker.setParameters({\n    tessedit_char_whitelist: 'ABEPVX0123456789-',\n    tessedit_pageseg_mode: '6' // 인보이스 라벨은 표 형태로 빽빽한 문서라 식별표와 같은 문서 모드가 더 적합\n  });\n  return invoiceWorker;\n}\n\n// 문서 모드로 실패할 때를 대비한 보조(흩어진 글자 찾기) 모드\nlet invoiceWorkerSparse = null;\nasync function getInvoiceWorkerSparse() {\n  if (invoiceWorkerSparse) return invoiceWorkerSparse;\n  invoiceWorkerSparse = await Tesseract.createWorker('eng', 1, PACK_TESS);\n  await invoiceWorkerSparse.setParameters({\n    tessedit_char_whitelist: 'ABEPVX0123456789-',\n    tessedit_pageseg_mode: '11'\n  });\n  return invoiceWorkerSparse;\n}\n\nfunction todayYYMMDD() {\n  const d = new Date();\n  const yy = String(d.getFullYear()).slice(-2);\n  const mm = String(d.getMonth() + 1).padStart(2, '0');\n  const dd = String(d.getDate()).padStart(2, '0');\n  return yy + mm + dd;\n}\n\nfunction parseInvoice(text) {\n  const m = text.match(/([AV]EBXP)[\\s\\-]*([0-9]{6})[\\s\\-]*([0-9]{3})/i);\n  if (!m) return null;\n  return { prefix: m[1].toUpperCase(), date6: m[2], seq3: m[3], value: `${m[1].toUpperCase()}${m[2]}${m[3]}` };\n}\n\nasync function onLabelPhoto(e) {\n  const file = e.target.files[0];\n  if (!file) return;\n  state.labelFile = file;\n  showLabelThumb(file);\n  await runLabelOcr(file);\n}\n\nfunction showLabelThumb(file) {\n  const previewUrl = URL.createObjectURL(file);\n  const thumb = document.getElementById('labelThumb');\n  thumb.src = previewUrl;\n  document.getElementById('labelThumbWrap').style.display = 'block';\n}\n\nfunction rotateFile(file, degrees) {\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => {\n      const rad = degrees * Math.PI / 180;\n      const sin = Math.abs(Math.sin(rad)), cos = Math.abs(Math.cos(rad));\n      const newW = Math.round(img.width * cos + img.height * sin);\n      const newH = Math.round(img.width * sin + img.height * cos);\n      const canvas = document.createElement('canvas');\n      canvas.width = newW; canvas.height = newH;\n      const ctx = canvas.getContext('2d');\n      ctx.fillStyle = '#808080'; // 회전 후 생기는 여백을 중간 회색으로 채워 이진화 왜곡 최소화\n      ctx.fillRect(0, 0, newW, newH);\n      ctx.translate(newW / 2, newH / 2);\n      ctx.rotate(rad);\n      ctx.drawImage(img, -img.width / 2, -img.height / 2);\n      canvas.toBlob(blob => {\n        resolve(new File([blob], file.name || 'rotated.jpg', { type: 'image/jpeg' }));\n      }, 'image/jpeg', 0.92);\n    };\n    img.onerror = reject;\n    img.src = URL.createObjectURL(file);\n  });\n}\n\nasync function rotateLabelPhoto() {\n  if (!state.labelFile) return;\n  state.labelFile = await rotateFile(state.labelFile, 90);\n  showLabelThumb(state.labelFile);\n  await runLabelOcr(state.labelFile);\n}\n\nfunction interpretText(text) {\n  const v2b = parseV2B(text);\n  if (v2b) return { product: v2b.product, lot: v2b.lot, perBox: 100, candidates: [v2b.product], foundKeyLine: true };\n\n  const c77 = parse77(text);\n  if (c77) return { product: c77.product, lot: c77.lot, perBox: 100, candidates: [c77.product], foundKeyLine: true };\n\n  const lotMatch = text.match(/L[O0]T\\s*N[o0]\\.?\\s*[:.]?\\s*([A-Z0-9]+(?:-[A-Z0-9]+)*)/i);\n  const lot = lotMatch ? lotMatch[1].trim().toUpperCase() : '';\n  const amountMatch = text.match(/Amount\\s*[:.]?\\s*([\\d,]{2,})/i);\n  const perBox = amountMatch ? parseInt(amountMatch[1].replace(/,/g, ''), 10) : '';\n  const lines = text.split('\\n').filter(l => !/L[O0]T\\s*N[o0]/i.test(l) && !/Amount/i.test(l));\n  const flatText = lines.join(' '); // 줄바꿈 때문에 \"ALS-\"와 코드가 서로 다른 줄로 갈라져도 잡히도록 이어붙임\n\n  const alsRegex = /[A4][L1I][S5][\\s\\-]*([A-Z0-9]{4,})/gi;\n  let alsCandidates = [];\n  let alsMatch;\n  while ((alsMatch = alsRegex.exec(flatText)) !== null) {\n    alsCandidates.push(alsMatch[1].toUpperCase());\n  }\n\n  const parenCodeRegex = /([A-Z0-9]{2,6}-[A-Z0-9]{3,})\\s*\\(/g;\n  const plainCodeRegex = /\\b[A-Z0-9]{2,6}-[A-Z0-9]{3,}\\b/g;\n  let priorityCandidates = [];\n  let otherCandidates = [];\n  lines.forEach(l => {\n    let m;\n    while ((m = parenCodeRegex.exec(l)) !== null) priorityCandidates.push(m[1].toUpperCase());\n    const plain = l.match(plainCodeRegex);\n    if (plain) otherCandidates = otherCandidates.concat(plain.map(x => x.toUpperCase()));\n  });\n  const candidates = [...new Set([...alsCandidates, ...priorityCandidates, ...otherCandidates])];\n  const foundKeyLine = alsCandidates.length > 0 && !!lotMatch;\n  const lotFormatOk = lot ? /^(AP|P)[0-9]{2}[0-9A-C][0-9]{2}-\\d+(-\\d+)*$/i.test(lot) : false;\n  const productFormatOk = candidates[0] ? !!splitAlsProduct(candidates[0]) : false;\n  return { product: candidates[0] || '', lot, perBox, candidates, foundKeyLine, alsFound: alsCandidates.length > 0, lotFormatOk, productFormatOk };\n}\n\nfunction applyOcrResult(result) {\n  state.product = result.product;\n  state.lot = result.lot;\n  state.perBox = result.perBox;\n  document.getElementById('lotManual').value = state.lot;\n  document.getElementById('perBoxManual').value = state.perBox || '';\n\n  const chipWrap = document.getElementById('productChips');\n  chipWrap.innerHTML = '';\n  result.candidates.forEach(c => {\n    const chip = document.createElement('div');\n    chip.className = 'chip' + (c === state.product ? ' selected' : '');\n    chip.textContent = c;\n    chip.onclick = () => {\n      state.product = c;\n      document.getElementById('productManual').value = c;\n      document.querySelectorAll('#productChips .chip').forEach(x => x.classList.remove('selected'));\n      chip.classList.add('selected');\n    };\n    chipWrap.appendChild(chip);\n  });\n  document.getElementById('productManual').value = state.product;\n  document.getElementById('candidateBlock').style.display = 'block';\n  return result.foundKeyLine;\n}\n\nasync function runLabelOcr(file) {\n  const statusEl = document.getElementById('ocrStatus');\n  statusEl.textContent = '이미지 보정 및 인식 중입니다...';\n  document.getElementById('candidateBlock').style.display = 'none';\n  hideSealUI();\n  hideAlsBuilder();\n  hideLotSleeveBuilder();\n\n  try {\n    const img = await loadImageEl(file);\n    state.labelImg = img;\n    const isOk = (r) => state.recogType === 'seal' ? r.foundKeyLine : (r.productFormatOk && r.lotFormatOk);\n\n    let text = '';\n    let result = null;\n\n    // 0단계: 기기에 내장된 고속 OCR이 있으면 가장 먼저 시도 (가장 빠르고 정확)\n    const nativeText = await nativeDetectText(file, 1600);\n    if (nativeText) {\n      text = '[고속 인식]\\n' + nativeText;\n      result = interpretText(nativeText);\n    }\n\n    if (!result || !isOk(result)) {\n      const worker = state.recogType === 'seal' ? await getSealWorker() : await getWorker();\n\n      // 1단계: 낮은 해상도로 빠르게 시도 (대부분의 선명한 사진은 여기서 바로 인식됨)\n      let processedDataUrl = await preprocessImage(file, 1000);\n      let ocrRes = await worker.recognize(processedDataUrl);\n      let t = ocrRes.data.text;\n      let r = interpretText(t);\n\n      // 2단계: 형식에 안 맞으면 해상도를 높여 한 번 더 정밀하게 재시도\n      if (!isOk(r)) {\n        statusEl.textContent = '정밀 인식 중...';\n        processedDataUrl = await preprocessImage(file, 1700);\n        ocrRes = await worker.recognize(processedDataUrl);\n        t = ocrRes.data.text;\n        const r2 = interpretText(t);\n        if (isOk(r2) || !result) { r = r2; }\n      }\n\n      if (isOk(r) || !result) { result = r; text = t; }\n    }\n\n    document.getElementById('rawOcrText').textContent = text;\n    document.getElementById('candidateBlock').style.display = 'block';\n\n    if (state.recogType === 'seal') {\n      if (result.foundKeyLine) {\n        const type = result.product === '0201-003797' ? 'V2B' : '77';\n        const { digits, suffix } = splitLot(result.lot, type);\n        showQuickLotBuilder(type, digits, suffix);\n        statusEl.textContent = '인식 완료. 숫자와 E/K를 확인해주세요.';\n      } else {\n        showQuickLotBuilder('', '', '');\n        document.getElementById('candidateBlock').style.display = 'block';\n        statusEl.textContent = '자동 인식 실패 - 아래에서 접두사/숫자/접미사를 선택해 채워주세요. 사진이 옆으로 찍혔다면 회전 아이콘도 눌러보세요.';\n      }\n    } else {\n      const foundKeyLine = applyOcrResult(result);\n      const alsParts = splitAlsProduct(result.product) || { d3: '', letter: '', d4: '' };\n      showAlsBuilder(alsParts.d3, alsParts.letter, alsParts.d4);\n\n      const lotParts = splitLotSleeve(result.lot) || { prefix: '', d2: '', char: '', remainder: '' };\n      showLotSleeveBuilder(lotParts.prefix, lotParts.d2, lotParts.char, lotParts.d3, lotParts.remainder);\n\n      const orientationHint = !foundKeyLine\n        ? ' 자동 인식 실패 - 사진이 옆으로 찍혔다면 회전 아이콘을 눌러보세요.'\n        : '';\n      statusEl.textContent = (foundKeyLine ? '인식 완료. 아래 내용을 확인해주세요.' : '자동 인식 실패 - 아래에서 직접 채워주세요.') + orientationHint;\n    }\n    updateTotalDisplay();\n  } catch (err) {\n    console.error(err);\n    document.getElementById('candidateBlock').style.display = 'block';\n    statusEl.innerHTML = '<span class=\"error\">인식 오류. 직접 입력해주세요.<\/span>';\n  }\n}\n\n\n// ---------- 수량 사진 (최대 10장) ----------\nfunction renderQtyThumbs() {\n  const wrap = document.getElementById('qtyThumbs');\n  wrap.innerHTML = '';\n  state.qtyFiles.forEach((f, idx) => {\n    const url = URL.createObjectURL(f);\n    const div = document.createElement('div');\n    div.className = 'qty-thumb-wrap';\n    div.innerHTML = `<img src=\"${url}\">\n      <button type=\"button\" class=\"del\" onclick=\"removeQtyPhoto(${idx})\">x<\/button>\n      <button type=\"button\" class=\"rot\" onclick=\"rotateQtyPhoto(${idx})\" title=\"회전\" aria-label=\"회전\">&#8635;<\/button>`;\n    wrap.appendChild(div);\n  });\n  const btn = document.getElementById('qtyCaptureBtn');\n  const galleryBtn = document.getElementById('qtyGalleryBtn');\n  btn.textContent = `사진 촬영 (${state.qtyFiles.length}/10)`;\n  btn.disabled = state.qtyFiles.length >= 10;\n  galleryBtn.disabled = state.qtyFiles.length >= 10;\n}\n\nasync function rotateQtyPhoto(idx) {\n  state.qtyFiles[idx] = await rotateFile(state.qtyFiles[idx], 90);\n  renderQtyThumbs();\n}\n\nfunction onQtyPhoto(e) {\n  const file = e.target.files[0];\n  if (!file) return;\n  if (state.qtyFiles.length >= 10) return;\n  state.qtyFiles.push(file);\n  renderQtyThumbs();\n  e.target.value = '';\n}\n\nfunction removeQtyPhoto(idx) {\n  state.qtyFiles.splice(idx, 1);\n  renderQtyThumbs();\n}\n\nfunction updateTotalDisplay() {\n  const perBox = parseInt(document.getElementById('perBoxManual').value, 10);\n  const boxCount = parseInt(document.getElementById('boxCountManual').value, 10);\n  const totalEl = document.getElementById('totalDisplay');\n  if (perBox > 0 && boxCount > 0) {\n    totalEl.textContent = `전체 수량: ${(perBox * boxCount).toLocaleString()} (박스당 ${perBox.toLocaleString()} x ${boxCount}박스)`;\n  } else {\n    totalEl.textContent = '전체 수량: -';\n  }\n}\n\n// ---------- 빠른입력 순차 자동이동 ----------\nfunction focusEl(id) {\n  const el = document.getElementById(id);\n  if (el && el.offsetParent !== null) el.focus();\n}\n\nfunction enforceMaxLenAndAdvance(el, len, nextId) {\n  if (el.value.length > len) el.value = el.value.slice(0, len);\n  if (el.value.length === len && nextId) focusEl(nextId);\n}\n\nfunction handleEnterAdvance(event, nextId) {\n  if (event.key === 'Enter') {\n    event.preventDefault();\n    focusEl(nextId);\n  }\n}\n\nfunction sanitize(s) {\n  return (s || '').trim().replace(/[\\\\/:*?\"<>|]/g, '').replace(/\\s+/g, '');\n}\n\n// ---------- 품목 임시 저장 (아직 파일로는 저장 안 함) ----------\nasync function saveDraftItem() {\n  const company = document.getElementById('companySelect').value;\n  const product = sanitize(document.getElementById('productManual').value);\n  const lot = sanitize(document.getElementById('lotManual').value);\n  const perBox = parseInt(document.getElementById('perBoxManual').value, 10);\n  const boxCount = parseInt(document.getElementById('boxCountManual').value, 10);\n  const resultEl = document.getElementById('saveResult');\n  resultEl.innerHTML = '';\n\n  if (!company) { resultEl.innerHTML = '<div class=\"error\">업체를 선택해주세요.<\/div>'; return; }\n  if (!state.labelFile) { resultEl.innerHTML = '<div class=\"error\">식별표 사진을 촬영해주세요.<\/div>'; return; }\n  if (!product || !lot) { resultEl.innerHTML = '<div class=\"error\">품명 / LOT 번호를 확인해주세요.<\/div>'; return; }\n  if (state.qtyFiles.length < 1) { resultEl.innerHTML = '<div class=\"error\">수량 사진을 최소 1장 촬영해주세요.<\/div>'; return; }\n  if (!(perBox > 0)) { resultEl.innerHTML = '<div class=\"error\">박스당 수량을 확인해주세요.<\/div>'; return; }\n  if (!(boxCount > 0)) { resultEl.innerHTML = '<div class=\"error\">박스 수를 입력해주세요.<\/div>'; return; }\n\n  const total = perBox * boxCount;\n  const invoiceNumber = sanitize(document.getElementById('invoiceManual').value);\n  const draftId = 'd' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);\n  const draft = {\n    draftId,\n    company, product, lot, perBox, boxCount, total, mode: state.mode, recogType: state.recogType,\n    labelFile: state.labelFile,\n    qtyFiles: state.qtyFiles.slice(),\n    invoiceFiles: state.invoiceFiles.slice(),\n    invoiceNumber: invoiceNumber\n  };\n  draftEntries.push(draft);\n\n  renderDraftList();\n  resultEl.innerHTML = `<div class=\"hint\">임시 저장됨 (${draftEntries.length}번째 품목). 아직 파일로 저장되지 않았습니다.<\/div>`;\n\n  // 사진을 기기(IndexedDB)에 백업해 둔다 — 중간에 다른 앱을 오래 쓰다 돌아와도 이 항목이 사라지지 않도록.\n  persistPhotosForOwner(draft.draftId, draft.labelFile, draft.qtyFiles, draft.invoiceFiles);\n  if (state.editingDraftId) { dbDeleteShipPhotosForOwner(state.editingDraftId); state.editingDraftId = null; }\n  persistDraftsMeta();\n\n  ['step1','step2','stepInvoice','step3','step4'].forEach(id => document.getElementById(id).setAttribute('disabled-look', '1'));\n  document.getElementById('continuePrompt').style.display = 'flex';\n}\n\nlet draftListOpen = false; // 임시저장 목록은 기본적으로 접혀 있고, 화살표를 눌러야 펼쳐진다\n\nfunction toggleDraftListOpen() {\n  draftListOpen = !draftListOpen;\n  renderDraftList();\n}\n\nlet backupPanelOpen = false; // 백업(내보내기/가져오기) 설명도 기본적으로 접혀 있다\nfunction toggleBackupPanelOpen() {\n  backupPanelOpen = !backupPanelOpen;\n  document.getElementById('backupPanel').style.display = backupPanelOpen ? 'block' : 'none';\n  document.getElementById('backupToggleArrow').textContent = backupPanelOpen ? '▴ 접기' : '▾ 펼치기';\n}\n\nfunction renderDraftList() {\n  const toggleBtn = document.getElementById('draftToggleBtn');\n  const listEl = document.getElementById('draftList');\n  const arrowEl = document.getElementById('draftToggleArrow');\n  document.getElementById('draftCount').textContent = `${draftEntries.length}건`;\n  if (!draftEntries.length) {\n    toggleBtn.style.display = 'none';\n    listEl.style.display = 'none';\n    return;\n  }\n  toggleBtn.style.display = 'flex';\n  listEl.style.display = draftListOpen ? 'block' : 'none';\n  arrowEl.textContent = draftListOpen ? '▴ 접기' : '▾ 펼치기';\n  listEl.innerHTML = draftEntries.map((d, i) => `\n    <div class=\"draft-item\" style=\"display:flex; align-items:center; gap:6px; justify-content:space-between;\">\n      <div style=\"flex:1;\">${i + 1}. [${d.mode === 'in' ? '입고' : '출고'}] ${d.company} / ${d.product} / ${d.lot || '사진만'} / 전체수량 ${d.total.toLocaleString()} (수량사진 ${d.qtyFiles.length}장${d.invoiceFiles && d.invoiceFiles.length ? `, 인보이스 ${d.invoiceFiles.length}장` : ''})<\/div>\n      <select class=\"draft-action-select\" onchange=\"handleDraftAction(this, ${i})\" style=\"flex:0 0 auto; width:auto; margin-bottom:0; padding:4px; font-size:11px;\">\n        <option value=\"\">⋮<\/option>\n        <option value=\"edit\">수정<\/option>\n        <option value=\"delete\">삭제<\/option>\n        <option value=\"redo\">삭제 후 다시 하기<\/option>\n        <option value=\"toDownload\">다운로드로 넘기기<\/option>\n      <\/select>\n    <\/div>\n  `).join('');\n}\n\nfunction handleDraftAction(selectEl, index) {\n  const action = selectEl.value;\n  selectEl.value = '';\n  if (action === 'edit') editDraftItem(index);\n  else if (action === 'delete') deleteDraftItem(index);\n  else if (action === 'redo') redoDraftItem(index);\n  else if (action === 'toDownload') moveDraftToDownload(index);\n}\n\nasync function loadEntryIntoForm(d) {\n  // 1) 업체/모드/종류 복원\n  state.company = d.company;\n  document.getElementById('companySelect').value = d.company;\n  setMode(d.mode);\n  state.recogType = d.recogType || 'sleeve';\n\n  // 2) 식별표 사진 + 품명/LOT 복원\n  state.labelFile = d.labelFile;\n  showLabelThumb(d.labelFile);\n  state.labelImg = await loadImageEl(d.labelFile);\n  hideSealUI();\n  if (d.recogType === 'seal') {\n    const type = d.product === '0201-003797' ? 'V2B' : '77';\n    const parts = splitLot(d.lot, type) || { digits: '', suffix: '' };\n    showQuickLotBuilder(type, parts.digits, parts.suffix);\n  } else {\n    const alsParts = splitAlsProduct(d.product) || { d3: '', letter: '', d4: '' };\n    showAlsBuilder(alsParts.d3, alsParts.letter, alsParts.d4);\n    const lotParts = splitLotSleeve(d.lot) || { prefix: '', d2: '', char: '', d3: '', remainder: '' };\n    showLotSleeveBuilder(lotParts.prefix, lotParts.d2, lotParts.char, lotParts.d3, lotParts.remainder);\n  }\n  document.getElementById('candidateBlock').style.display = 'block';\n\n  // 3) 인보이스 복원\n  state.invoiceFiles = d.invoiceFiles ? d.invoiceFiles.slice() : [];\n  state.invoiceNumber = d.invoiceNumber || '';\n  renderInvoiceThumbs();\n  document.getElementById('invoiceManual').value = state.invoiceNumber;\n  hideInvoiceBuilder();\n\n  // 4) 수량 사진 + 박스 수 복원\n  state.qtyFiles = d.qtyFiles.slice();\n  renderQtyThumbs();\n  document.getElementById('boxCountManual').value = d.boxCount;\n  document.getElementById('perBoxManual').value = d.perBox;\n  updateTotalDisplay();\n\n  document.getElementById('saveResult').innerHTML = '<div class=\"hint\" style=\"background:#FAEEDA;\">수정 모드로 불러왔습니다. 내용을 고친 뒤 \"이 품목 저장\"을 다시 눌러주세요.<\/div>';\n  document.getElementById('step1').scrollIntoView({ behavior: 'smooth' });\n}\n\nasync function editDraftItem(index) {\n  const d = draftEntries[index];\n  if (!d) return;\n  if (d.packing) { alert('패킹 연동으로 촬영한 항목은 여기서 수정할 수 없습니다.\\n[삭제]하거나 [삭제 후 다시 하기]로 패킹 연동 화면에서 다시 촬영해주세요.'); return; }\n  draftEntries.splice(index, 1);\n  persistDraftsMeta();\n  state.editingDraftId = d.draftId || null; // 재저장 시 옛 사진 백업을 정리하기 위해 기억해 둔다\n  renderDraftList();\n  await loadEntryIntoForm(d);\n}\n\nfunction deleteDraftItem(index) {\n  if (!confirm('이 임시 저장 품목을 삭제할까요? 되돌릴 수 없습니다.')) return;\n  const d = draftEntries[index];\n  draftEntries.splice(index, 1);\n  if (d && d.draftId) dbDeleteShipPhotosForOwner(d.draftId);\n  persistDraftsMeta();\n  renderDraftList();\n}\n\nfunction redoDraftItem(index) {\n  const d = draftEntries[index];\n  if (!d) return;\n  if (d.packing) {\n    if (!confirm('이 품목의 패킹 연동 촬영(같은 품목의 모든 LOT)을 삭제하고 다시 촬영할까요?')) return;\n    packRedoByKey(d.planKey);\n    return;\n  }\n  if (!confirm('이 항목을 삭제하고 처음부터 다시 촬영할까요?')) return;\n  draftEntries.splice(index, 1);\n  if (d.draftId) dbDeleteShipPhotosForOwner(d.draftId);\n  persistDraftsMeta();\n  renderDraftList();\n  state.company = d.company;\n  document.getElementById('companySelect').value = d.company;\n  setMode(d.mode);\n  resetStepFields(false); // 업체/모드는 유지하고 나머지는 새로 시작\n  document.getElementById('step1').scrollIntoView({ behavior: 'smooth' });\n}\n\nfunction resetStepFields(resetCompany) {\n  document.getElementById('continuePrompt').style.display = 'none';\n  ['step1','step2','stepInvoice','step3','step4'].forEach(id => document.getElementById(id).removeAttribute('disabled-look'));\n\n  state.labelFile = null; state.labelImg = null; state.qtyFiles = []; state.product = ''; state.lot = ''; state.perBox = '';\n  state.invoiceFiles = []; state.invoiceNumber = '';\n  renderInvoiceThumbs();\n  document.getElementById('invoiceManual').value = '';\n  document.getElementById('invoiceStatus').textContent = '';\n  hideInvoiceBuilder();\n  document.getElementById('invoiceToggleBtn').style.display = 'none';\n  document.getElementById('invoiceInputCamera').value = '';\n  document.getElementById('invoiceInputGallery').value = '';\n  document.getElementById('labelThumbWrap').style.display = 'none';\n  document.getElementById('candidateBlock').style.display = 'none';\n  hideSealUI();\n  showAlsBuilder('', '', '');\n  showLotSleeveBuilder('', '', '', '', '');\n  document.getElementById('lotDigits').value = '';\n  document.getElementById('sealPrefixSelect').value = 'V2B';\n  document.getElementById('sealPrefixSelect').style.display = 'block';\n  document.getElementById('sealPrefixCustom').style.display = 'none';\n  document.getElementById('sealPrefixCustom').value = '';\n  document.getElementById('lotSuffix').value = 'E';\n  document.getElementById('lotSuffix').style.display = 'block';\n  document.getElementById('lotSuffixCustom').style.display = 'none';\n  document.getElementById('lotSuffixCustom').value = '';\n  document.getElementById('lotManual').value = '';\n  document.getElementById('productManual').value = '';\n  document.getElementById('productChips').innerHTML = '';\n  document.getElementById('boxCountManual').value = '';\n  document.getElementById('perBoxManual').value = '';\n  document.getElementById('totalDisplay').textContent = '전체 수량: -';\n  document.getElementById('ocrStatus').textContent = '';\n  document.getElementById('saveResult').innerHTML = '';\n  document.getElementById('labelInputCamera').value = '';\n  document.getElementById('labelInputGallery').value = '';\n  document.getElementById('qtyInputCamera').value = '';\n  document.getElementById('qtyInputGallery').value = '';\n  renderQtyThumbs();\n\n  if (resetCompany) {\n    state.company = '';\n    document.getElementById('companySelect').value = '';\n  }\n}\n\nfunction continueSameCompany() { resetStepFields(false); }\nfunction continueNewCompany() { resetStepFields(true); }\n\n// ---------- 전체 촬영 완료 : 이 시점에 실제 파일명/순번을 확정하고 저장 ----------\nasync function finalizeEntry(d) {\n  const now = new Date();\n  const todayMMDD = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');\n\n  const seqKey = `seq:${d.company}_${d.product}_${d.lot}`;\n  let seq = await storeGet(seqKey, 0);\n  seq += 1;\n  await storeSet(seqKey, seq);\n  const seqStr = String(seq).padStart(3, '0');\n  const modeLabel = d.mode === 'in' ? '입고' : '출고';\n  const fileBase = d.photoOnly\n    ? `${d.company}_${d.product}_${d.total}` + (seq > 1 ? `_${seqStr}` : '')\n    : `${d.company}_${d.product}_${d.total}_${d.lot}_${seqStr}`;\n  const folderPath = `${todayMMDD}/${modeLabel}/`;\n  const fileNames = [];\n  const entryId = 'e' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);\n  const dbWrites = [];\n  let roleOrder = 0;\n\n  const pushFile = (name, file, role) => {\n    sessionFiles.push({ name, file });\n    fileNames.push(name);\n    // 사진을 entryId 기준으로도 기기(IndexedDB)에 백업해 둔다 — 완료 후 새로고침돼도 사진이 남도록.\n    dbWrites.push(dbAddShipPhoto({ ownerId: entryId, role: role, order: roleOrder++, blob: file, name: name }));\n  };\n  if (d.labelFile) pushFile(`${folderPath}${fileBase}_표.jpg`, d.labelFile, 'label');\n  d.qtyFiles.forEach((f, idx) => {\n    const suffix = d.photoOnly ? `_사진${idx + 1}` : (d.qtyFiles.length > 1 ? `_수량${idx + 1}` : '_수량');\n    pushFile(`${folderPath}${fileBase}${suffix}.jpg`, f, 'qty');\n  });\n  if (d.invoiceFiles && d.invoiceFiles.length) {\n    d.invoiceFiles.forEach((f, idx) => {\n      const suffix = d.invoiceFiles.length > 1 ? `_인보이스${idx + 1}` : '_인보이스';\n      pushFile(`${folderPath}${fileBase}${suffix}.jpg`, f, 'invoice');\n    });\n  }\n  await Promise.all(dbWrites).catch(() => {}); // 백업 실패해도 이번 작업 자체는 계속 진행\n  if (d.draftId) dbDeleteShipPhotosForOwner(d.draftId); // 임시저장 단계의 옛 백업은 정리(중복 보관 방지)\n\n  logEntries.unshift({\n    id: entryId, time: new Date().toLocaleString('ko-KR'),\n    modeLabel, company: d.company, product: d.product, lot: d.lot,\n    perBox: d.perBox, boxCount: d.boxCount, total: d.total, seq: seqStr,\n    invoiceNumber: d.invoiceNumber || '', recogType: d.recogType,\n    packing: !!d.packing, photoOnly: !!d.photoOnly, planKey: d.planKey || ''\n  });\n  finalizedEntries.unshift({\n    id: entryId, company: d.company, product: d.product, lot: d.lot, perBox: d.perBox,\n    boxCount: d.boxCount, total: d.total, mode: d.mode, recogType: d.recogType,\n    labelFile: d.labelFile, qtyFiles: d.qtyFiles.slice(),\n    invoiceFiles: d.invoiceFiles ? d.invoiceFiles.slice() : [],\n    invoiceNumber: d.invoiceNumber || '', fileNames,\n    packing: !!d.packing, photoOnly: !!d.photoOnly, planKey: d.planKey || ''\n  });\n\n  await storeSet('log', logEntries);\n}\n\nasync function finishAllCapture() {\n  resetStepFields(true);\n  if (!draftEntries.length) { document.getElementById('zipStatus').textContent = '저장할 품목이 없습니다.'; return; }\n\n  const zipStatus = document.getElementById('zipStatus');\n  zipStatus.textContent = '파일명 확정 및 저장 중...';\n\n  for (const d of draftEntries) {\n    await finalizeEntry(d);\n  }\n\n  draftEntries = [];\n  persistDraftsMeta();\n  renderDraftList();\n  renderLog();\n  updatePendingBadge();\n  zipStatus.textContent = '저장 완료. 아래 다운로드 버튼을 눌러주세요.';\n}\n\nasync function moveDraftToDownload(index) {\n  const d = draftEntries[index];\n  if (!d) return;\n  draftEntries.splice(index, 1);\n  persistDraftsMeta();\n  renderDraftList();\n  await finalizeEntry(d);\n  renderLog();\n  updatePendingBadge();\n  document.getElementById('zipStatus').textContent = '해당 품목을 다운로드 대상으로 넘겼습니다.';\n}\n\nlet downloadedFileCount = 0; // 마지막으로 zip 다운로드를 눌렀을 때의 sessionFiles 개수\n\nfunction updatePendingBadge() {\n  const badge = document.getElementById('pendingCount');\n  if (downloadedFileCount > sessionFiles.length) downloadedFileCount = sessionFiles.length;\n  if (sessionFiles.length > 0 && sessionFiles.length === downloadedFileCount) {\n    badge.textContent = `${sessionFiles.length}장 · 다운로드함`;\n    badge.style.background = '#2e7d4f';\n  } else {\n    badge.textContent = `${sessionFiles.length}장`;\n    badge.style.background = '';\n  }\n}\n\nasync function buildZipBlob() {\n  const zip = new JSZip();\n  sessionFiles.forEach(f => { zip.file(f.name, f.file); });\n  return await zip.generateAsync({ type: 'blob' });\n}\n\nasync function downloadAllZip() {\n  const zipStatus = document.getElementById('zipStatus');\n  if (!sessionFiles.length) { zipStatus.textContent = '다운로드할 사진이 없습니다.'; return; }\n  zipStatus.textContent = '압축 파일 생성 중...';\n  const blob = await buildZipBlob();\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  const now = new Date();\n  const todayMMDD = String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');\n  a.href = url; a.download = `출고관리사진_${todayMMDD}.zip`;\n  a.click();\n  downloadedFileCount = sessionFiles.length;\n  updatePendingBadge();\n  await markShipPhotosDownloaded(finalizedEntries.map(f => f.id));\n  await updatePhotoBackupInfo();\n  zipStatus.textContent = `${sessionFiles.length}장 다운로드 완료.`;\n}\n\nlet logSearchQuery = '';\nfunction onLogSearchInput(v) {\n  logSearchQuery = v;\n  renderLog();\n}\n\nfunction matchesLogSearch(e, q) {\n  if (!q) return true;\n  const hay = [e.time, e.modeLabel, e.company, e.product, e.lot, e.invoiceNumber].join(' ').toLowerCase();\n  return hay.indexOf(q.toLowerCase()) !== -1;\n}\n\nlet historyOpen = false; // 출고 이력도 기본적으로 접혀 있고, 화살표를 눌러야 펼쳐진다\nfunction toggleHistoryOpen() {\n  historyOpen = !historyOpen;\n  document.getElementById('historyPanel').style.display = historyOpen ? 'block' : 'none';\n  document.getElementById('historyToggleArrow').textContent = historyOpen ? '▴ 접기' : '▾ 펼치기';\n}\n\nfunction renderLog() {\n  const historyStep = document.getElementById('historyStep');\n  document.getElementById('historyCount').textContent = `${logEntries.length}건`;\n  if (!logEntries.length) {\n    historyStep.style.display = 'none';\n  } else {\n    historyStep.style.display = 'block';\n  }\n  // 출고 이력이 안 보이면 그만큼 번호가 하나 당겨져서 백업이 6번, 이력이 나타나면 다시 7번이 된다.\n  document.getElementById('backupBadgeNum').textContent = logEntries.length ? '7' : '6';\n\n  const body = document.getElementById('logBody');\n  const q = logSearchQuery.trim();\n  const filtered = logEntries.filter(e => matchesLogSearch(e, q));\n  if (q && filtered.length === 0) {\n    body.innerHTML = '<tr><td colspan=\"11\" style=\"text-align:center; color:#888;\">검색 결과가 없습니다.<\/td><\/tr>';\n    return;\n  }\n  body.innerHTML = filtered.map(e => `\n    <tr><td>${e.time}<\/td><td>${e.modeLabel || ''}<\/td><td>${e.company}<\/td><td>${e.product}<\/td><td>${e.lot || (e.photoOnly ? '사진만' : '')}<\/td>\n    <td>${(e.perBox||0).toLocaleString()}<\/td><td>${e.boxCount}<\/td><td>${(e.total||0).toLocaleString()}<\/td><td>${e.seq}<\/td><td>${e.invoiceNumber || ''}<\/td>\n    <td><select class=\"draft-action-select log-action-select\" onchange=\"handleLogAction(this,'${e.id || ''}')\" style=\"margin-bottom:0;\">\n      <option value=\"\">⋮<\/option>\n      <option value=\"edit\">수정<\/option>\n      <option value=\"delete\">삭제<\/option>\n      <option value=\"redo\">삭제 후 다시 하기<\/option>\n    <\/select><\/td><\/tr>`).join('');\n}\n\nfunction findFinalizedIndex(id) {\n  return finalizedEntries.findIndex(f => f.id === id);\n}\n\nasync function handleLogAction(selectEl, id) {\n  const action = selectEl.value;\n  selectEl.value = '';\n  if (!id) return;\n  const idx = findFinalizedIndex(id);\n  if (idx === -1) {\n    // 이전 방문(새로고침/재실행)에서 촬영을 마친 항목: 사진 파일은 메모리에서 이미 사라졌지만,\n    // 이력 기록 자체는 남아 있으므로 삭제만은 이력에서 직접 지울 수 있게 한다.\n    if (action === 'delete') deleteLogOnlyEntry(id);\n    else if (action === 'edit') openLogEditModal(id);\n    else if (action === 'redo') {\n      alert('이 항목은 사진 촬영을 새로고침 이전에 마쳐서, 사진 데이터가 남아있지 않아 삭제 후 다시 하기는 할 수 없습니다. (이력에서 삭제 또는 글자 정보 수정은 가능합니다)');\n    }\n    return;\n  }\n  if (action === 'edit') await editFinalizedEntry(idx);\n  else if (action === 'delete') deleteFinalizedEntry(idx);\n  else if (action === 'redo') redoFinalizedEntry(idx);\n}\n\n// 사진 데이터 없이 이력 기록만 남아 있는 항목을 삭제한다 (새로고침/재실행 이후의 지난 기록용).\nfunction deleteLogOnlyEntry(id) {\n  const logIdx = logEntries.findIndex(e => e.id === id);\n  if (logIdx === -1) return;\n  if (!confirm('이 이력 기록을 삭제할까요? 사진 파일은 이미 남아있지 않은 상태이며, 이력만 삭제되고 되돌릴 수 없습니다.')) return;\n  logEntries.splice(logIdx, 1);\n  storeSet('log', logEntries);\n  renderLog();\n}\n\n// 사진 데이터 없이 이력 기록만 남아 있는 항목의 글자 정보(업체/품명/LOT/수량/인보이스)를 수정한다.\nlet logEditingId = null;\nfunction openLogEditModal(id) {\n  const e = logEntries.find(x => x.id === id);\n  if (!e) return;\n  logEditingId = id;\n  document.getElementById('logEditCompany').value = e.company || '';\n  document.getElementById('logEditProduct').value = e.product || '';\n  document.getElementById('logEditLot').value = e.lot || '';\n  document.getElementById('logEditPerBox').value = e.perBox || '';\n  document.getElementById('logEditBoxCount').value = e.boxCount || '';\n  document.getElementById('logEditInvoice').value = e.invoiceNumber || '';\n  document.getElementById('logEditModal').style.display = 'flex';\n}\nfunction closeLogEditModal() {\n  document.getElementById('logEditModal').style.display = 'none';\n  logEditingId = null;\n}\nfunction saveLogEditModal() {\n  const e = logEntries.find(x => x.id === logEditingId);\n  if (!e) { closeLogEditModal(); return; }\n  const company = document.getElementById('logEditCompany').value.trim();\n  const product = document.getElementById('logEditProduct').value.trim();\n  const lot = document.getElementById('logEditLot').value.trim();\n  const perBox = Number(document.getElementById('logEditPerBox').value) || 0;\n  const boxCount = Number(document.getElementById('logEditBoxCount').value) || 0;\n  const invoiceNumber = document.getElementById('logEditInvoice').value.trim();\n  if (!company || !product) { alert('업체와 품명은 비워둘 수 없습니다.'); return; }\n  e.company = company;\n  e.product = product;\n  e.lot = lot;\n  e.perBox = perBox;\n  e.boxCount = boxCount;\n  e.total = perBox * boxCount;\n  e.invoiceNumber = invoiceNumber;\n  storeSet('log', logEntries);\n  renderLog();\n  closeLogEditModal();\n}\n\nfunction removeFinalizedFromStorage(idx) {\n  const f = finalizedEntries[idx];\n  if (!f) return null;\n  sessionFiles = sessionFiles.filter(sf => !f.fileNames.includes(sf.name));\n  finalizedEntries.splice(idx, 1);\n  const logIdx = logEntries.findIndex(e => e.id === f.id);\n  if (logIdx !== -1) logEntries.splice(logIdx, 1);\n  dbDeleteShipPhotosForOwner(f.id);\n  updatePendingBadge();\n  return f;\n}\n\nasync function editFinalizedEntry(idx) {\n  if (finalizedEntries[idx] && finalizedEntries[idx].packing) { alert('패킹 연동으로 촬영한 항목은 여기서 수정할 수 없습니다.\\n[삭제]하거나 [삭제 후 다시 하기]를 사용해주세요.'); return; }\n  const f = removeFinalizedFromStorage(idx);\n  if (!f) return;\n  await storeSet('log', logEntries);\n  renderLog();\n  await loadEntryIntoForm(f);\n}\n\nfunction deleteFinalizedEntry(idx) {\n  if (!confirm('이미 저장된 이 품목을 삭제할까요? 사진과 이력 기록이 함께 삭제되며 되돌릴 수 없습니다.')) return;\n  removeFinalizedFromStorage(idx);\n  storeSet('log', logEntries);\n  renderLog();\n}\n\nfunction redoFinalizedEntry(idx) {\n  const f = finalizedEntries[idx];\n  if (!f) return;\n  if (f.packing) {\n    if (!confirm('이 품목의 패킹 연동 기록(같은 품목의 모든 LOT)을 삭제하고 다시 촬영할까요?')) return;\n    packRedoByKey(f.planKey);\n    return;\n  }\n  if (!confirm('이미 저장된 이 품목을 삭제하고 처음부터 다시 촬영할까요? 사진과 이력 기록이 함께 삭제됩니다.')) return;\n  removeFinalizedFromStorage(idx);\n  storeSet('log', logEntries);\n  renderLog();\n  state.company = f.company;\n  document.getElementById('companySelect').value = f.company;\n  setMode(f.mode);\n  resetStepFields(false);\n  document.getElementById('step1').scrollIntoView({ behavior: 'smooth' });\n}\n\nfunction exportCSV() {\n  if (!logEntries.length) return;\n  const header = '시각,구분,업체,품명,LOT,박스당수량,박스수,전체수량,파일번호,인보이스\\n';\n  const rows = logEntries.map(e => `${e.time},${e.modeLabel || ''},${e.company},${e.product},${e.lot},${e.perBox},${e.boxCount},${e.total},${e.seq},${e.invoiceNumber || ''}`).join('\\n');\n  const blob = new Blob(['\\uFEFF' + header + rows], { type: 'text/csv' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = '출고이력.csv';\n  a.click();\n}\n\n\n// =====================================================================\n//  패킹 연동 입출고  (판매업체·품목·박스 수는 자료에서 자동으로 채우고, LOT만 촬영)\n//  - 출고 / 입고 두 모드, 저장은 기존 '임시저장 → 촬영 완료 전체 저장 → ZIP' 흐름을 그대로 사용\n// =====================================================================\nlet packMode = null;            // null = 입/출고 선택 화면, 'out' | 'in'\nlet packPlan = null;            // 현재 모드의 자료 { date, groups:[{ seller, note, invoice, shipTo, items:[{ name, boxes, perBox, qty, photoOnly, key }] }] }\nconst packPlans = { out: null, in: null };\nlet packWork = null;            // 촬영 중인 품목 (메모리 + 자동 보관)\nlet packView = 'list';          // 'list' | 'item'\nlet packDates = { out: '', in: '' };   // 받을 날짜 (YYYY-MM-DD)\nlet packSavedUrl = '';          // 웹앱 주소 (키 제외)\nlet packSavedKey = '';          // 웹앱 비밀번호(키)\nlet packInSeller = '하나테크';   // 입고 업체 (기본 하나테크)\nlet packUi = { big: false, dark: false };\nlet packFilter = 'all';         // 'all' | 'todo'\nlet packCollapsed = {};\nlet packTarget = 0;             // 사진 입력창이 어느 LOT 칸용인지 (-1 = 사진만 품목)\nlet packRecover = null;         // 앱이 닫히기 전 촬영 중이던 품목 { meta, photos }\nlet packModalFns = [];\nlet packWorker = '';            // 작업자 이름 (공유용)\nlet packShared = { out: {}, in: {} };   // 다른 기기가 올린 진행 상태 { key: [rows] }\nlet packSyncQ = [];             // 아직 못 올린 변경 (키별 마지막 것만)\nlet packSyncBusy = false, packSyncTimer = null, packSyncAt = '', packSyncErr = '';\nlet packStorage = null;         // { persisted, usage, quota }\nlet packLastBackup = '';\nlet packShowSettings = false;   // 선택 화면에서 웹앱 설정 열기\nlet packNoSetup = false;        // 설정 없이 JSON으로 쓰기 선택\nlet packFetchMsg = {};          // 마지막 자료 받기 결과 { out:{ok,msg}, in:{...} }\nlet packPending = null;         // 저장 확인창에 올라간 임시저장 묶음\nconst PACK_MAX_SETS = 5;\nconst PACK_PHOTO_RE = /^ASS-|KIT|유압|서비스/i;\nconst packUrls = new WeakMap();\n\nfunction pkEsc(s) {\n  return String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n}\nfunction pkFile(s) { return String(s || '').trim().replace(/[\\\\/:*?\"<>|]/g, ''); }\nfunction packUrl(f) {\n  let u = packUrls.get(f);\n  if (!u) { u = URL.createObjectURL(f); packUrls.set(f, u); }\n  return u;\n}\nfunction packFocus(id) {\n  setTimeout(() => { const e = document.getElementById(id); if (e) { e.focus(); try { e.select && e.select(); } catch (_) {} } }, 40);\n}\nfunction packTodayStr() {\n  const n = new Date();\n  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' + String(n.getDate()).padStart(2, '0');\n}\nfunction packYmd(dateStr) { const m = String(dateStr || '').match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); return m ? m[1].slice(2) + m[2] + m[3] : ''; }\nfunction packModeLabel(m) { return m === 'in' ? '패킹 연동 입고' : '패킹 연동 출고'; }\nfunction packSeller(g) { return packMode === 'in' ? (packInSeller || '하나테크') : g.seller; }\nfunction packStatus(msg, isErr) {\n  const el = document.getElementById('packStatus');\n  if (el) el.innerHTML = msg ? (isErr ? '<span class=\"error\">' + pkEsc(msg) + '<\/span>' : pkEsc(msg)) : '';\n}\nfunction packScrollTop() { const sc = document.getElementById('packPanel'); if (sc) sc.scrollTop = 0; }\n\n// ---------- 열기 / 닫기 / 보기 설정 ----------\nfunction openPackPanel() {\n  const p = document.getElementById('packPanel');\n  p.classList.add('open');\n  document.body.style.overflow = 'hidden';\n  if (!packWork) { packMode = null; packPlan = null; packView = 'list'; }   // 처음 들어오면 입고/출고 선택부터\n  packApplyUi(); packRender();\n  packStartSync();\n}\nfunction closePackPanel() {\n  document.getElementById('packPanel').classList.remove('open');\n  document.body.style.overflow = '';\n  packStopSync();\n}\nfunction packDirty() {\n  if (!packWork) return false;\n  return !!(packWork.photos.length || packWork.sets.some(s => s.label || s.qty.length));\n}\nfunction packApplyUi() {\n  const p = document.getElementById('packPanel');\n  if (!p) return;\n  p.classList.toggle('big', !!packUi.big);\n  p.classList.toggle('dark', !!packUi.dark);\n  p.classList.toggle('mode-in', packMode === 'in');\n}\nasync function packToggleUi(k) {\n  packUi[k] = !packUi[k];\n  await storeSet('packUi', packUi);\n  packApplyUi(); packRenderTop();\n}\n\n// ---------- 시작 ----------\nasync function packInit() {\n  packPlans.out = await storeGet('packPlan', null);\n  packPlans.in = await storeGet('packPlanIn', null);\n  packSavedUrl = await storeGet('packUrl', '');\n  packSavedKey = await storeGet('packKey', '');\n  if (packSavedUrl && /[?&]key=/.test(packSavedUrl)) {      // 예전 방식(주소 끝에 ?key=) 정리\n    const sp = packSplitUrl(packSavedUrl);\n    packSavedUrl = sp.url; if (sp.key) packSavedKey = sp.key;\n    await storeSet('packUrl', packSavedUrl); await storeSet('packKey', packSavedKey);\n  }\n  packInSeller = (await storeGet('packInSeller', '하나테크')) || '하나테크';\n  c
