<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0ef">
<title>재고 실사 · 입출고</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232c6b58'/%3E%3Crect x='14' y='18' width='36' height='10' rx='3' fill='%23fff'/%3E%3Crect x='14' y='36' width='36' height='10' rx='3' fill='%23EF9F27'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0ef;
    --surface: #ffffff;
    --border: #d5dad7;
    --text: #1b2220;
    --muted: #66706c;
    --inv: #2c6b58;
    --inv-soft: #e3f0ea;
    --ship: #EF9F27;
    --ship-soft: #fdf0d8;
    --ship-ink: #8a5a10;
    --live: #2e7d4f;
    --shadow: 0 1px 2px rgba(20,30,26,.06), 0 6px 18px rgba(20,30,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816;
      --surface: #1d2320;
      --border: #333c38;
      --text: #ecf0ee;
      --muted: #97a29d;
      --inv: #4f9e83;
      --inv-soft: #1f3129;
      --ship-soft: #3a2e17;
      --ship-ink: #e6b35e;
      --live: #6fc794;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body { height: 100vh; height: 100dvh; }

  /* ── 프로그램 선택 화면 ── */
  #menu {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
  }
  #menu[hidden] { display: none; }
  .menu-inner { width: 100%; max-width: 460px; }
  .menu-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 6px; }
  .menu-head .menu-title { margin:0; }
  .reset-btn { font:inherit; font-size:12px; padding:5px 10px; border-radius:14px; border:1px solid var(--border); background:var(--surface); color:var(--muted); cursor:pointer; }
  .reset-btn:active { background:#eee; }
  .menu-title { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .menu-sub { font-size: 15px; color: var(--muted); margin: 0 0 28px; }

  .pick {
    display: flex; align-items: center; gap: 16px; width: 100%;
    min-height: 116px; margin: 0 0 14px; padding: 18px 18px 18px 20px;
    text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); position: relative; overflow: hidden;
    transition: transform .08s ease;
  }
  .pick::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
  .pick:active { transform: scale(.985); }
  .pick:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }
  .pick[data-app="inventory"] { --c: var(--inv); --c-soft: var(--inv-soft); --c-ink: var(--inv); }
  .pick[data-app="packing"]  { --c: #0f6e7d; --c-soft: #e1f1f3; --c-ink: #0b5560; }
  .pick[data-app="shipping"]  { --c: var(--ship); --c-soft: var(--ship-soft); --c-ink: var(--ship-ink); }

  .pick-icon {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
    display: grid; place-items: center; background: var(--c-soft); color: var(--c-ink);
  }
  .pick-icon svg { width: 30px; height: 30px; }
  .pick-body { flex: 1 1 auto; min-width: 0; }
  .pick-name { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pick-desc { font-size: 14px; line-height: 1.5; color: var(--muted); margin: 0; word-break: keep-all; }
  .live {
    display: none; font-size: 12px; font-weight: 700; color: var(--live);
    background: color-mix(in srgb, var(--live) 14%, transparent);
    padding: 2px 8px; border-radius: 999px;
  }
  .pick.is-live .live { display: inline-block; }
  .menu-note { font-size: 13px; color: var(--muted); margin: 18px 2px 0; line-height: 1.55; word-break: keep-all; }

  /* ── 프로그램 실행 화면 ── */
  #host { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #host[hidden] { display: none; }
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 4px;
    padding: env(safe-area-inset-top, 0px) 8px 0 4px; min-height: calc(42px + env(safe-area-inset-top, 0px));
    background: var(--bar, #1f4f40); color: #fff; position: relative; z-index: 2;
  }
  #back {
    display: inline-flex; align-items: center; gap: 2px; min-height: 42px; padding: 0 12px 0 8px;
    font: inherit; font-size: 15px; font-weight: 700; color: inherit;
    background: transparent; border: 0; border-radius: 8px; cursor: pointer;
    touch-action: manipulation; position: relative; z-index: 2;
  }
  #back:active { background: rgba(255,255,255,.18); }
  #back:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
  #back svg { width: 20px; height: 20px; }
  #barTitle { font-size: 15px; font-weight: 500; opacity: .92; margin-left: 2px; }
  #frames { position: relative; flex: 1 1 auto; min-height: 0; }
  #frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  #frames iframe[hidden] { display: none; }
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6e7d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

<main id="menu">
  <div class="menu-inner">
    <div class="menu-head"><h1 class="menu-title">프로그램 선택</h1><button type="button" id="resetBtn" class="reset-btn">초기화</button></div>
    <p class="menu-sub">사용할 프로그램을 눌러 주세요.</p>

    <button type="button" class="pick" data-app="packing">
      <span class="pick-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 8.5h8M8 12h8M8 15.5h4"/><path d="M15.5 17.5l1.6 1.6 3-3.4" /></svg>
      </span>
      <span class="pick-body">
        <span class="pick-name">패킹 연동 입출고 <span class="live">작업 중</span></span>
        <p class="pick-desc">패킹 자료(출고) 또는 입고 요청 자료(입고)에서 업체·품목·박스 수를 불러와 LOT 식별표와 수량 사진만 촬영합니다.</p>
      </span>
    </button>

    <button type="button" class="pick" data-app="shipping">
      <span class="pick-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5l9-4.5 9 4.5v9l-9 4.5-9-4.5z"/><path d="M3 7.5l9 4.5 9-4.5"/><path d="M12 12v9"/></svg>
      </span>
      <span class="pick-body">
        <span class="pick-name">입출고 <span class="live">작업 중</span></span>
        <p class="pick-desc">식별표를 촬영해 품명·LOT·수량을 자동으로 읽고, 입·출고 사진과 이력을 관리합니다.</p>
      </span>
    </button>

    <button type="button" class="pick" data-app="inventory">
      <span class="pick-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      </span>
      <span class="pick-body">
        <span class="pick-name">재고 실사 <span class="live">작업 중</span></span>
        <p class="pick-desc">재고 파일을 불러와 창고별로 재고를 조사하고, 이전 실사 결과와 비교합니다.</p>
      </span>
    </button>

    <p class="menu-note">프로그램 안에서 왼쪽 위 ‘메뉴’를 누르면 이 화면으로 돌아옵니다. 돌아와도 하던 작업은 그대로 유지됩니다.</p>
  </div>
</main>

<div id="host" hidden>
  <div id="bar">
    <button type="button" id="back" aria-label="프로그램 선택 화면으로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>메뉴
    </button>
    <span id="barTitle"></span>
  </div>
  <div id="frames"></div>
</div>

<script>
(function () {
  'use strict';

  /* 두 프로그램의 원본 HTML (수정 없이 그대로 담겨 있음) */
  var APPS = {
    inventory: { title: '재고 실사', bar: '#1f4f40', html: "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1\">\n<title>재고 실사<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<script src=\"lib/xlsx.full.min.js\"><\/script>\n<script src=\"lib/jszip.min.js\"><\/script>\n<style>\n  :root {\n    --bg: #f2f4f1;\n    --surface: #ffffff;\n    --surface-2: #eaece7;\n    --border: #d7dbd2;\n    --text: #1c231f;\n    --text-muted: #6b746b;\n    --accent: #2c6b58;\n    --accent-dark: #1f4f40;\n    --accent-contrast: #ffffff;\n    --danger: #b8453a;\n    --danger-bg: #fbe9e7;\n    --success: #2e7d4f;\n    --success-bg: #e6f3ea;\n    --new-badge: #a3702c;\n    --new-badge-bg: #fbf0dd;\n    --shadow: 0 1px 2px rgba(28,35,31,0.06), 0 4px 12px rgba(28,35,31,0.05);\n    --radius: 10px;\n  }\n\n  @media (prefers-color-scheme: dark) {\n    :root:not([data-theme=\"light\"]) {\n      --bg: #141815;\n      --surface: #1c211d;\n      --surface-2: #242a25;\n      --border: #343c36;\n      --text: #eaeee9;\n      --text-muted: #96a096;\n      --accent: #4f9e83;\n      --accent-dark: #6bb69b;\n      --accent-contrast: #0d120e;\n      --danger: #e5776b;\n      --danger-bg: #3a2321;\n      --success: #6fc794;\n      --success-bg: #1e3527;\n      --new-badge: #d9a75c;\n      --new-badge-bg: #3a2f1c;\n      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);\n    }\n  }\n  :root[data-theme=\"dark\"] {\n    --bg: #141815;\n    --surface: #1c211d;\n    --surface-2: #242a25;\n    --border: #343c36;\n    --text: #eaeee9;\n    --text-muted: #96a096;\n    --accent: #4f9e83;\n    --accent-dark: #6bb69b;\n    --accent-contrast: #0d120e;\n    --danger: #e5776b;\n    --danger-bg: #3a2321;\n    --success: #6fc794;\n    --success-bg: #1e3527;\n    --new-badge: #d9a75c;\n    --new-badge-bg: #3a2f1c;\n    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);\n  }\n\n  * { box-sizing: border-box; }\n\n  html, body {\n    margin: 0;\n    padding: 0;\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;\n    -webkit-tap-highlight-color: transparent;\n    overflow: hidden;\n    width: 100%;\n    height: 100%;\n  }\n\n  body {\n    height: 100vh;\n    height: 100dvh;\n    display: flex;\n    justify-content: center;\n    padding: 0;\n  }\n\n  .app {\n    width: 100%;\n    max-width: 640px;\n    min-width: 0;\n    height: 100%;\n    display: flex;\n    flex-direction: column;\n  }\n\n  .app-scroll {\n    flex: 1 1 auto;\n    min-height: 0;\n    overflow-y: auto;\n    -webkit-overflow-scrolling: touch;\n    overscroll-behavior: contain;\n    padding: 20px 14px 20px;\n  }\n\n  /* 조사 화면(count-mode): 바깥은 고정, 품목 목록만 남은 공간을 꽉 채워 스크롤 */\n  .app-scroll.count-mode {\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n  }\n  .app-scroll.count-mode > .masthead,\n  .app-scroll.count-mode > .toolbar {\n    flex: none;\n  }\n  .list-wrap {\n    flex: 1 1 auto;\n    min-height: 0;\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n  }\n  .list-wrap > .summary,\n  .list-wrap > .list-head {\n    flex: none;\n  }\n\n  .app-footer {\n    flex: none;\n    padding: 0 14px calc(10px + env(safe-area-inset-bottom, 0px));\n  }\n\n  .masthead {\n    display: flex;\n    align-items: baseline;\n    justify-content: space-between;\n    gap: 8px;\n    margin-bottom: 18px;\n  }\n\n  .masthead h1 {\n    font-size: 19px;\n    font-weight: 800;\n    letter-spacing: -0.01em;\n    margin: 0;\n    flex: none;\n  }\n\n  .masthead .company-tag {\n    font-size: 12px;\n    color: var(--text-muted);\n    white-space: nowrap;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    min-width: 0;\n  }\n\n  /* ---------- Upload stage ---------- */\n  .dropzone {\n    position: relative;\n    background: var(--surface);\n    border: 1.5px dashed var(--border);\n    border-radius: var(--radius);\n    padding: 40px 20px;\n    text-align: center;\n    transition: border-color 0.15s ease, background 0.15s ease;\n  }\n  .dropzone:hover, .dropzone.dragover, .dropzone:focus-within {\n    border-color: var(--accent);\n    background: var(--surface-2);\n  }\n  .dropzone .icon {\n    font-size: 30px;\n    margin-bottom: 10px;\n    line-height: 1;\n    pointer-events: none;\n  }\n  .dropzone .title {\n    font-size: 15px;\n    font-weight: 600;\n    margin-bottom: 4px;\n    pointer-events: none;\n  }\n  .dropzone .hint {\n    font-size: 12.5px;\n    color: var(--text-muted);\n    pointer-events: none;\n  }\n  .dropzone input[type=\"file\"] {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    margin: 0;\n    padding: 0;\n    opacity: 0;\n    cursor: pointer;\n    z-index: 2;\n  }\n\n  .error-box {\n    margin-top: 12px;\n    padding: 12px 14px;\n    background: var(--danger-bg);\n    color: var(--danger);\n    border-radius: var(--radius);\n    font-size: 13px;\n    line-height: 1.5;\n  }\n\n  /* ---------- Warehouse select stage ---------- */\n  .card {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 18px;\n    box-shadow: var(--shadow);\n  }\n  .card + .card { margin-top: 14px; }\n\n  .field-label {\n    font-size: 12.5px;\n    font-weight: 600;\n    color: var(--text-muted);\n    margin-bottom: 8px;\n  }\n\n  select.warehouse-select {\n    width: 100%;\n    padding: 12px 14px;\n    font-size: 15px;\n    font-family: inherit;\n    font-weight: 600;\n    color: var(--text);\n    background: var(--surface);\n    border: 1.5px solid var(--border);\n    border-radius: 8px;\n    appearance: none;\n    -webkit-appearance: ion: absolute;\n    width: 1px; height: 1px;\n    padding: 0; margin: -1px;\n    overflow: hidden;\n    clip: rect(0,0,0,0);\n    white-space: nowrap; border: 0;\n  }\n\n  @media (prefers-reduced-motion: reduce) {\n    * { transition: none !important; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"app\" id=\"app\"><\/div>\n\n<script>\n(function () {\n  'use strict';\n\n  var RESERVED_HEADERS = new Set(['품목코드', '품목명', '규격', '재고수량']);\n  var STORAGE_KEY = 'stockcheck_session_v1';\n\n  var state = {\n    stage: 'select',          // 'select' | 'count'\n    companyLine: '',\n    items: [],                 // [{code, name, qtyByWh: {whName: number}}]\n    warehouses: [],            // [{name}]\n    currentWarehouse: null,\n    actualQty: {},             // { whName: { itemKey: number } }\n    manualItems: {},           // { whName: [{id, name}] }\n    search: '',\n    sortDir: null,             // null | 'asc' | 'desc'\n    modalOpen: false,\n    modalError: '',\n    parseError: '',\n    locked: {},                 // { whName: { itemKey: true } } — 임시저장된 품목\n    draftPanelOpen: false,      // 임시저장 목록 패널 펼침 여부 (임시 UI 상태, 저장 안 함)\n    openMenuKey: null,          // 임시저장 목록에서 열려있는 수정/삭제 메뉴의 \"wh|key\"\n    openDraftGroups: {},        // 임시저장 목록에서 접힌 창고 그룹 { whName: false } (없으면 기본 펼침)\n    exportSeq: {},               // { \"wh_YYMMDD\": n } — 파일명 중복방지 증가 번호\n    amountModal: null,          // { mode:'add'|'subtract', key, name, eQty, current }\n    photoModal: null,           // { key, name } — 사진 관리 모달 대상 품목\n    photoModalPhotos: null,     // 모달에 표시할 사진 목록 (비동기 로드)\n    photoCounts: {},            // { \"wh|itemKey\": count } — 사진 개수 캐시 (IndexedDB 비동기 로드 결과)\n    boxQty: {},                 // { itemKey: 한 박스당 수량 }\n    boxMode: false,             // true면 화면 표시/입력을 박스 단위로\n    boxEditModal: null,         // { key, name, current } — 박스당 수량 설정 모달\n    zeroAllModal: false,        // true면 \"전체 0\" 확인 모달 표시\n    filterUnentered: false,     // true면 아직 실사 수량을 입력하지 않은 품목만 표시 (임시 UI 상태, 저장 안 함)\n    lastSavedAt: {}             // { whName: timestamp } — 창고별 마지막 \"창고 임시저장\" 시각\n  };\n\n  function itemKey(name, code) { return code ? ('c:' + code) : ('n:' + name); }\n\n  // ---------- persistence ----------\n  function saveSession() {\n    try {\n      var payload = {\n        companyLine: state.companyLine,\n        items: state.items,\n        warehouses: state.warehouses,\n        currentWarehouse: state.currentWarehouse,\n        actualQty: state.actualQty,\n        manualItems: state.manualItems,\n        locked: state.locked,\n        exportSeq: state.exportSeq,\n        boxQty: state.boxQty,\n        boxMode: state.boxMode,\n        stage: state.stage,\n        lastSavedAt: state.lastSavedAt\n      };\n      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));\n    } catch (e) { /* storage unavailable — continue without persistence */ }\n  }\n\n  function loadSession() {\n    try {\n      var raw = window.localStorage.getItem(STORAGE_KEY);\n      if (!raw) return;\n      var data = JSON.parse(raw);\n      if (data && data.items && data.items.length) {\n        state.companyLine = data.companyLine || '';\n        state.items = data.items;\n        state.warehouses = data.warehouses || [];\n        state.currentWarehouse = data.currentWarehouse || null;\n        state.actualQty = data.actualQty || {};\n        state.manualItems = data.manualItems || {};\n        state.locked = data.locked || {};\n        state.exportSeq = data.exportSeq || {};\n        state.boxQty = data.boxQty || {};\n        state.boxMode = !!data.boxMode;\n        state.lastSavedAt = data.lastSavedAt || {};\n        state.stage = state.currentWarehouse ? 'count' : 'select';\n      }\n    } catch (e) { /* corrupt or unavailable — start fresh */ }\n  }\n\n  function clearSession() {\n    try { window.localStorage.removeItem(STORAGE_KEY); } catch (e) {}\n  }\n\n  // ---------- parsing ----------\n  function decodeCsvBuffer(buf) {\n    var bytes = new Uint8Array(buf);\n    try {\n      var utf8Decoder = new TextDecoder('utf-8', { fatal: true });\n      return utf8Decoder.decode(bytes);\n    } catch (e) {\n      try {\n        var eucDecoder = new TextDecoder('euc-kr');\n        return eucDecoder.decode(bytes);\n      } catch (e2) {\n        return new TextDecoder('utf-8').decode(bytes);\n      }\n    }\n  }\n\n  function parseWorkbookRows(file, callback, onError) {\n    var reader = new FileReader();\n    reader.onload = function (e) {\n      try {\n        var isCsv = /\\.csv$/i.test(file.name);\n        var workbook;\n        if (isCsv) {\n          var text = decodeCsvBuffer(e.target.result);\n          workbook = XLSX.read(text, { type: 'string' });\n        } else {\n          workbook = XLSX.read(e.target.result, { type: 'array' });\n        }\n        var sheet = workbook.Sheets[workbook.SheetNames[0]];\n        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', blankrows: false });\n        callback(rows);\n      } catch (err) {\n        onError('파일을 읽는 중 문제가 발생했습니다. ERP에서 내려받은 원본 형식 그대로 업로드해 주세요.');\n      }\n    };\n    reader.onerror = function () {\n      onError('파일을 불러오지 못했습니다. 다시 시도해 주세요.');\n    };\n    reader.readAsArrayBuffer(file);\n  }\n\n  function buildDataset(rows) {\n    var headerRowIdx = -1, nameColIdx = -1, codeColIdx = -1, specColIdx = -1;\n    var scanLimit = Math.min(rows.length, 10);\n    for (var r = 0; r < scanLimit; r++) {\n      var row = rows[r] || [];\n      var idx = -1;\n      for (var c = 0; c < row.length; c++) {\n        if (String(row[c]).trim() === '품목명') { idx = c; break; }\n      }\n      if (idx !== -1) { headerRowIdx = r; nameColIdx = idx; break; }\n    }\n    if (headerRowIdx === -1) {\n      throw new Error('NO_HEADER');\n    }\n    var headerRow = rows[headerRowIdx];\n    for (var c2 = 0; c2 < headerRow.length; c2++) {\n      if (String(headerRow[c2]).trim() === '품목코드') { codeColIdx = c2; break; }\n    }\n    for (var c3 = 0; c3 < headerRow.length; c3++) {\n      if (String(headerRow[c3]).trim() === '규격') { specColIdx = c3; break; }\n    }\n    if (specColIdx === -1 && headerRow[nameColIdx + 1] !== undefined) {\n      specColIdx = nameColIdx + 1; // 정확히 못 찾으면 관례상 품목명 바로 다음 열(규격)을 사용\n    }\n    var warehouses = [];\n    headerRow.forEach(function (h, idx) {\n      var name = String(h).trim();\n      if (name && !RESERVED_HEADERS.has(name)) {\n        warehouses.push({ idx: idx, name: name });\n      }\n    });\n    if (warehouses.length === 0) {\n      throw new Error('NO_WAREHOUSE');\n    }\n    var items = [];\n    for (var r2 = headerRowIdx + 1; r2 < rows.length; r2++) {\n      var row2 = rows[r2] || [];\n      var nameVal = row2[nameColIdx];\n      if (nameVal === undefined || nameVal === null || String(nameVal).trim() === '') continue;\n      var qtyByWh = {};\n      warehouses.forEach(function (w) {\n        var v = row2[w.idx];\n        var n = Number(v);\n        qtyByWh[w.name] = isNaN(n) ? 0 : n;\n      });\n      // 표시 품명은 규격(C열) 값을 우선 사용하고, 비어 있으면 품목명으로 대체한다.\n      var specVal = specColIdx !== -1 ? row2[specColIdx] : null;\n      var specStr = (specVal !== undefined && specVal !== null) ? String(specVal).trim() : '';\n      var displayName = specStr || String(nameVal).trim();\n      items.push({\n        code: codeColIdx !== -1 ? String(row2[codeColIdx] || '').trim() : '',\n        name: displayName,\n        qtyByWh: qtyByWh\n      });\n    }\n    if (items.length === 0) {\n      throw new Error('NO_ITEMS');\n    }\n    var companyLine = '';\n    if (rows[0] && rows[0][0]) companyLine = String(rows[0][0]).trim();\n    return { items: items, warehouses: warehouses.map(function (w) { return { name: w.name }; }), companyLine: companyLine };\n  }\n\n  function handleFile(file) {\n    state.parseError = '';\n    if (!/\\.(csv|xlsx|xls)$/i.test(file.name)) {\n      state.parseError = 'csv 또는 xlsx 파일만 업로드할 수 있습니다.';\n      render();\n      return;\n    }\n    parseWorkbookRows(file, function (rows) {\n      try {\n        var dataset = buildDataset(rows);\n        state.items = dataset.items;\n        state.warehouses = dataset.warehouses;\n        state.companyLine = dataset.companyLine;\n        state.currentWarehouse = null;\n        state.actualQty = {};\n        state.manualItems = {};\n        state.locked = {};\n        state.stage = 'select';\n        saveSession();\n        render();\n      } catch (err) {\n        var msg = 'ERP 파일 형식을 인식하지 못했습니다. \"품목명\" 헤더와 창고별 수량 열이 포함된 원본 파일인지 확인해 주세요.';\n        if (err.message === 'NO_WAREHOUSE') msg = '창고 열을 찾지 못했습니다. \"품목명\" 옆으로 창고별 수량 열이 있는지 확인해 주세요.';\n        if (err.message === 'NO_ITEMS') msg = '품목 데이터를 찾지 못했습니다. 헤더 아래에 품목 행이 있는지 확인해 주세요.';\n        state.parseError = msg;\n        render();\n      }\n    }, function (errMsg) {\n      state.parseError = errMsg;\n      render();\n    });\n  }\n\n  // ---------- derived data ----------\n  function getCurrentItems(whArg) {\n    var wh = whArg || state.currentWarehouse;\n    if (!wh) return [];\n    var actualMap = state.actualQty[wh] || {};\n    var lockedMap = state.locked[wh] || {};\n    var manual = state.manualItems[wh] || [];\n\n    var fromErp = state.items.map(function (it) {\n      var key = itemKey(it.name, it.code);\n      return {\n        key: key,\n        name: it.name,\n        code: it.code || '',\n        eQty: it.qtyByWh[wh] || 0,\n        actual: Object.prototype.hasOwnProperty.call(actualMap, key) ? actualMap[key] : null,\n        locked: !!lockedMap[key],\n        manual: false\n      };\n    });\n    var fromManual = manual.map(function (m) {\n      var key = 'm:' + m.id;\n      return {\n        key: key,\n        name: m.name,\n        eQty: 0,\n        actual: Object.prototype.hasOwnProperty.call(actualMap, key) ? actualMap[key] : null,\n        locked: !!lockedMap[key],\n        manual: true,\n        manualId: m.id\n      };\n    });\n    return fromErp.concat(fromManual);\n  }\n\n  // E수량이 0인 ERP 품목은 화면에서 숨긴다. 단, 이미 실사값을 입력했거나\n  // 임시저장된 품목은 계속 보여야 하므로(다운로드/수정 대상) 예외로 둔다.\n  // 수동 추가 품목(신규)은 E수량이 항상 0이라도 항상 표시한다.\n  function getVisibleItems(whArg) {\n    return getCurrentItems(whArg).filter(function (it) {\n      if (it.manual) return true;\n      if (it.eQty !== 0) return true;\n      if (it.locked) return true;\n      if (it.actual !== null && it.actual !== undefined) return true;\n      return false;\n    });\n  }\n\n  function getFilteredSorted() {\n    var list = getVisibleItems();\n    var q = state.search.trim();\n    if (q) {\n      list = list.filter(function (it) {\n        return it.name.indexOf(q) !== -1 || (it.code && it.code.toLowerCase().indexOf(q.toLowerCase()) !== -1);\n      });\n    }\n    if (state.filterUnentered) {\n      list = list.filter(function (it) { return it.actual === null || it.actual === undefined; });\n    }\n    if (state.sortDir) {\n      list = list.slice().sort(function (a, b) {\n        var cmp = a.name.localeCompare(b.name, 'ko');\n        return state.sortDir === 'asc' ? cmp : -cmp;\n      });\n    }\n    return list;\n  }\n\n  function getSummary(list) {\n    var checked = 0, match = 0, mismatch = 0, saved = 0;\n    list.forEach(function (it) {\n      if (it.actual !== null && it.actual !== undefined) {\n        checked++;\n        if (Number(it.actual) === Number(it.eQty)) match++; else mismatch++;\n      }\n      if (it.locked) saved++;\n    });\n    return { total: list.length, checked: checked, match: match, mismatch: mismatch, saved: saved, unentered: list.length - checked };\n  }\n\n  function countSavedForWarehouse(wh) {\n    var lockedMap = state.locked[wh] || {};\n    return Object.keys(lockedMap).filter(function (k) { return lockedMap[k]; }).length;\n  }\n\n  function getSavedWarehouseSummaries() {\n    return state.warehouses\n      .map(function (w) { return { name: w.name, count: countSavedForWarehouse(w.name) }; })\n      .filter(function (w) { return w.count > 0; });\n  }\n\n  // 전체 창고를 통틀어 \"임시저장(잠금)\"된 모든 품목을 하나의 목록으로 모은다.\n  // CSV 다운로드와 하단 \"임시저장 목록\" 패널이 모두 이 함수 하나만 사용하므로\n  // 창고를 오가도 이전 기록이 누락되지 않는다.\n  function getAllDraftEntries() {\n    var out = [];\n    state.warehouses.forEach(function (w) {\n      var wh = w.name;\n      var lockedMap = state.locked[wh] || {};\n      var actualMap = state.actualQty[wh] || {};\n      state.items.forEach(function (it) {\n        var key = itemKey(it.name, it.code);\n        if (!lockedMap[key]) return;\n        out.push({\n          wh: wh,\n          key: key,\n          name: it.name,\n          eQty: it.qtyByWh[wh] || 0,\n          actual: actualMap[key],\n          manual: false\n        });\n      });\n      (state.manualItems[wh] || []).forEach(function (m) {\n        var key = 'm:' + m.id;\n        if (!lockedMap[key]) return;\n        out.push({\n          wh: wh,\n          key: key,\n          name: m.name,\n          eQty: 0,\n          actual: actualMap[key],\n          manual: true,\n          manualId: m.id\n        });\n      });\n    });\n    return out;\n  }\n\n  // ---------- actions ----------\n  function setActual(item, value) {\n    var wh = state.currentWarehouse;\n    if (!state.actualQty[wh]) state.actualQty[wh] = {};\n    if (value === '' || value === null) {\n      delete state.actualQty[wh][item.key];\n    } else {\n      var n = Number(value);\n      if (!isNaN(n)) state.actualQty[wh][item.key] = n;\n    }\n    saveSession();\n  }\n\n  function removeManualItem(manualId) {\n    var wh = state.currentWarehouse;\n    if (state.manualItems[wh]) {\n      state.manualItems[wh] = state.manualItems[wh].filter(function (m) { return m.id !== manualId; });\n    }\n    if (state.actualQty[wh]) delete state.actualQty[wh]['m:' + manualId];\n    if (state.locked[wh]) delete state.locked[wh]['m:' + manualId];\n    saveSession();\n    render();\n  }\n\n  function addManualItem(name, qty) {\n    var wh = state.currentWarehouse;\n    if (!state.manualItems[wh]) state.manualItems[wh] = [];\n    var id = 'mi_' + Date.now() + '_' + Math.floor(Math.random() * 1000);\n    state.manualItems[wh].push({ id: id, name: name });\n    if (qty !== '' && qty !== null && qty !== undefined) {\n      if (!state.actualQty[wh]) state.actualQty[wh] = {};\n      state.actualQty[wh]['m:' + id] = Number(qty);\n    }\n    saveSession();\n  }\n\n  function unlockItem(key) {\n    var wh = state.currentWarehouse;\n    if (state.locked[wh]) delete state.locked[wh][key];\n    saveSession();\n    render();\n  }\n\n  function saveDraftForWarehouse() {\n    var wh = state.currentWarehouse;\n    if (!wh) return;\n    var actualMap = state.actualQty[wh] || {};\n    var keysWithValue = Object.keys(actualMap).filter(function (k) {\n      return actualMap[k] !== undefined && actualMap[k] !== null;\n    });\n    if (keysWithValue.length === 0) {\n      showToast('임시저장할 실사 수량이 없습니다.');\n      return;\n    }\n    if (!state.locked[wh]) state.locked[wh] = {};\n    keysWithValue.forEach(function (k) { state.locked[wh][k] = true; });\n    state.lastSavedAt[wh] = Date.now();\n    saveSession();\n    render();\n    showToast(wh + ' 조사 임시저장');\n  }\n\n  // 시각을 \"오후 3:42\" 형식으로 표시. 오늘이 아니면 날짜도 함께 붙인다.\n  function formatSavedAt(ts) {\n    if (!ts) return '';\n    var d = new Date(ts);\n    var now = new Date();\n    var sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();\n    var timeStr = d.toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });\n    if (sameDay) return timeStr + ' 저장';\n    var dateStr = (d.getMonth() + 1) + '/' + d.getDate();\n    return dateStr + ' ' + timeStr + ' 저장';\n  }\n\n  // 임시저장 목록 패널에서 항목 삭제: 잠금 해제 + 입력값 자체를 지운다 (수동 추가 품목이면 품목 정의도 제거)\n  function deleteDraftEntry(entry) {\n    var wh = entry.wh, key = entry.key;\n    if (state.locked[wh]) delete state.locked[wh][key];\n    if (state.actualQty[wh]) delete state.actualQty[wh][key];\n    if (entry.manual && state.manualItems[wh]) {\n      state.manualItems[wh] = state.manualItems[wh].filter(function (m) { return m.id !== entry.manualId; });\n    }\n    saveSession();\n    render();\n    showToast('삭제되었습니다.');\n  }\n\n  // 임시저장 목록 패널에서 항목 수정: 잠금만 풀고 해당 창고로 이동시켜 바로 고칠 수 있게 한다\n  function editDraftEntry(entry) {\n    if (state.locked[entry.wh]) delete state.locked[entry.wh][entry.key];\n    state.currentWarehouse = entry.wh;\n    state.stage = 'count';\n    state.search = entry.name;\n    state.sortDir = null;\n    state.draftPanelOpen = false;\n    state.openMenuKey = null;\n    saveSession();\n    render();\n    refreshPhotoCountsForWarehouse(entry.wh);\n    showToast('\"' + entry.wh + '\" 창고에서 \"' + entry.name + '\" 항목을 수정하세요.');\n  }\n\n  // ---------- 실사 수량 더하기 / 빼기 ----------\n  function openAmountModal(mode, it) {\n    if (state.boxMode && getBoxQty(it.key) === null) {\n      showToast('먼저 박스당 수량을 설정해 주세요.');\n      openBoxEditModal(it);\n      return;\n    }\n    state.amountModal = {\n      mode: mode,\n      key: it.key,\n      name: it.name,\n      eQty: it.eQty,\n      hasActual: (it.actual !== null && it.actual !== undefined),\n      current: (it.actual === null || it.actual === undefined) ? 0 : Number(it.actual)\n    };\n    render();\n  }\n\n  function closeAmountModal() {\n    state.amountModal = null;\n    render();\n  }\n\n  function getBoxQty(key) {\n    var v = state.boxQty[key];\n    return (v && v > 0) ? v : null;\n  }\n\n  function formatBoxDisplay(raw, box) {\n    if (raw === null || raw === undefined || raw === '') return '-';\n    var n = Number(raw) / box;\n    if (isNaN(n)) return '-';\n    var rounded = Math.round(n * 100) / 100;\n    return String(rounded);\n  }\n\n  function setBoxQty(key, value) {\n    var n = Number(value);\n    if (!n || n <= 0) { delete state.boxQty[key]; } else { state.boxQty[key] = n; }\n    saveSession();\n  }\n\n  function openBoxEditModal(it) {\n    state.boxEditModal = { key: it.key, name: it.name, current: getBoxQty(it.key) };\n    render();\n  }\n\n  function closeBoxEditModal() {\n    state.boxEditModal = null;\n    render();\n  }\n\n  function applyBoxEditModal(rawValue) {\n    var m = state.boxEditModal;\n    if (!m) return { ok: false, msg: '' };\n    var n = Number(rawValue);\n    if (rawValue === '' || rawValue === null || isNaN(n) || n <= 0) {\n      return { ok: false, msg: '0보다 큰 숫자를 입력해 주세요.' };\n    }\n    setBoxQty(m.key, n);\n    state.boxEditModal = null;\n    render();\n    showToast(m.name + ' 박스당 수량을 ' + n + '개로 설정했습니다.');\n    return { ok: true };\n  }\n\n  function applyAmountModal(rawValue) {\n    var m = state.amountModal;\n    if (!m) return { ok: false, msg: '' };\n    var n = Number(rawValue);\n    var minOk = m.mode === 'set' ? (n >= 0) : (n > 0);\n    if (rawValue === '' || rawValue === null || isNaN(n) || !minOk) {\n      return { ok: false, msg: m.mode === 'set' ? '0 이상의 숫자를 입력해 주세요.' : '0보다 큰 숫자를 입력해 주세요.' };\n    }\n    var box = state.boxMode ? getBoxQty(m.key) : 1;\n    var unitLabel = state.boxMode ? '박스' : '개';\n    var result;\n    if (m.mode === 'set') {\n      result = n * box;\n      setActual({ key: m.key }, result);\n      showToast(m.name + ' → ' + n + unitLabel + ' (' + result + '개)');\n    } else {\n      var delta = n * box;\n      result = m.mode === 'add' ? (m.current + delta) : (m.current - delta);\n      setActual({ key: m.key }, result);\n      showToast(m.name + ' ' + (m.mode === 'add' ? '+' : '-') + n + unitLabel + ' → ' + result + '개');\n    }\n    state.amountModal = null;\n    render();\n    return { ok: true };\n  }\n\n  // ---------- 실사 수량 0 (품목별 / 전체) ----------\n  // 품목 하나의 실사 수량을 0으로 만든다. 이미 입력된 값이 있으면 실수 방지를 위해 한 번 확인한다.\n  function zeroItem(it) {\n    var cur = it.actual;\n    if (cur !== null && cur !== undefined && Number(cur) !== 0) {\n      if (!confirm('\"' + it.name + '\" 실사 수량 ' + Number(cur) + '개를 0으로 바꿀까요?')) return;\n    }\n    setActual({ key: it.key }, 0);\n    showToast(it.name + ' → 0개');\n    render();\n  }\n\n  function openZeroAllModal() {\n    if (getVisibleItems().length === 0) {\n      showToast('0으로 바꿀 품목이 없습니다.');\n      return;\n    }\n    state.zeroAllModal = true;\n    render();\n  }\n\n  function closeZeroAllModal() {\n    state.zeroAllModal = false;\n    render();\n  }\n\n  // scope: 'current' = 지금 조사 중인 창고만, 'all' = 모든 창고\n  // 화면에 표시되는 품목(E수량 0으로 숨겨진 품목 제외) 전부의 실사 수량을 0으로 만든다.\n  // 임시저장(잠금) 상태는 그대로 두고 값만 0으로 바뀐다.\n  function applyZeroAll(scope) {\n    var whList = scope === 'all'\n      ? state.warehouses.map(function (w) { return w.name; })\n      : [state.currentWarehouse];\n    var changed = 0;\n    whList.forEach(function (wh) {\n      var items = getVisibleItems(wh);\n      if (items.length === 0) return;\n      if (!state.actualQty[wh]) state.actualQty[wh] = {};\n      items.forEach(function (it) {\n        state.actualQty[wh][it.key] = 0;\n        changed++;\n      });\n    });\n    state.zeroAllModal = false;\n    saveSession();\n    render();\n    showToast((scope === 'all' ? '모든 창고' : '\\'' + state.currentWarehouse + '\\'') + ' ' + changed + '개 품목 → 0');\n  }\n\n  function renderZeroAllModal() {\n    var wh = state.currentWarehouse;\n    var here = getVisibleItems();\n    var hereSaved = here.filter(function (it) { return it.locked; }).length;\n    var allCount = 0, allSaved = 0;\n    state.warehouses.forEach(function (w) {\n      var list = getVisibleItems(w.name);\n      allCount += list.length;\n      allSaved += list.filter(function (it) { return it.locked; }).length;\n    });\n\n    var noteChildren = [\n      '\\'', el('b', {}, [wh]), '\\'에 표시된 품목 ', el('b', {}, [String(here.length) + '개']),\n      '의 실사 수량을 모두 0으로 바꿉니다. 아직 입력하지 않은 품목도 0이 됩니다.'\n    ];\n    var modalChildren = [\n      el('h2', {}, ['실사 수량 전체 0']),\n      el('div', { class: 'modal-note' }, noteChildren)\n    ];\n    if (allSaved > 0) {\n      modalChildren.push(el('div', { class: 'modal-note' }, [\n        '임시저장된 품목(이 창고 ' + hereSaved + '개 / 전체 ' + allSaved + '개)도 값이 0으로 바뀝니다. 필요한 결과는 먼저 다운로드해 두세요.'\n      ]));\n    }\n    modalChildren.push(el('div', { class: 'modal-note' }, ['바꾼 뒤에는 되돌릴 수 없습니다.']));\n\n    var actions = [\n      el('button', { class: 'primary', onclick: function () { applyZeroAll('current'); } }, ['이 창고만 0으로 (' + here.length + '개)'])\n    ];\n    if (state.warehouses.length > 1) {\n      actions.push(el('button', { onclick: function () { applyZeroAll('all'); } }, ['모든 창고 0으로 (' + allCount + '개)']));\n    }\n    actions.push(el('button', { onclick: closeZeroAllModal }, ['취소']));\n    modalChildren.push(el('div', { class: 'modal-actions stack' }, actions));\n\n    var modal = el('div', { class: 'modal' }, modalChildren);\n    var backdrop = el('div', { class: 'modal-backdrop', onclick: function (e) { if (e.target === backdrop) closeZeroAllModal(); } }, [modal]);\n    return backdrop;\n  }\n\n  // ---------- 새로 조사 (지난 회차 아카이브 + 현재 집계 초기화) ----------\n  function todayISODate() {\n    var d = new Date();\n    function pad(n) { return (n < 10 ? '0' : '') + n; }\n    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());\n  }\n\n  // \"다운로드\"로 받았던 재고조사 xlsx 파일을 다시 불러와 그 창고의 실사 수량/임시저장 상태를 복원한다.\n  function importPreviousSurvey(file) {\n    var isZip = /\\.zip$/i.test(file.name);\n    var reader = new FileReader();\n    reader.onload = async function (e) {\n      try {\n        var xlsxBuffer = e.target.result;\n        if (isZip) {\n          if (typeof JSZip === 'undefined') throw new Error('NO_JSZIP');\n          var zip = await JSZip.loadAsync(xlsxBuffer);\n          var xlsxEntry = null;\n          zip.forEach(function (relPath, entry) {\n            if (!entry.dir && /\\.xlsx$/i.test(relPath)) xlsxEntry = entry;\n          });\n          if (!xlsxEntry) throw new Error('NO_XLSX_IN_ZIP');\n          xlsxBuffer = await xlsxEntry.async('arraybuffer');\n        }\n\n        var workbook = XLSX.read(xlsxBuffer, { type: 'array' });\n        var sheet = workbook.Sheets[workbook.SheetNames[0]];\n        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });\n        if (!rows[0] || !rows[1]) throw new Error('EMPTY');\n\n        var metaRow = rows[0];\n        var whJoined = String(metaRow[4] || '').trim();\n        if (!whJoined) throw new Error('NO_WAREHOUSE');\n        var whNames = whJoined.split(',').map(function (s) { return s.trim(); }).filter(Boolean);\n        var validWh = whNames.filter(function (name) {\n          return state.warehouses.some(function (w) { return w.name === name; });\n        });\n        if (validWh.length === 0) throw new Error('WAREHOUSE_MISMATCH');\n\n        var restoredTotal = 0;\n        var restoredByWh = {};\n        for (var r = 2; r < rows.length; r++) {\n          var row = rows[r] || [];\n          var code = String(row[0] || '').trim();\n          var name = String(row[1] || '').trim();\n          if (!name) continue;\n          var key = code ? ('c:' + code) : ('n:' + name);\n          for (var wi = 0; wi < whNames.length; wi++) {\n            var wh = whNames[wi];\n            if (validWh.indexOf(wh) === -1) continue;\n            var base = 2 + wi * 3;\n            var actualRaw = row[base + 1];\n            if (actualRaw === undefined || actualRaw === null || String(actualRaw).trim() === '') continue;\n            var actual = Number(actualRaw);\n            if (isNaN(actual)) continue;\n            if (!state.actualQty[wh]) state.actualQty[wh] = {};\n            if (!state.locked[wh]) state.locked[wh] = {};\n            state.actualQty[wh][key] = actual;\n            state.locked[wh][key] = true;\n            restoredTotal++;\n            restoredByWh[wh] = (restoredByWh[wh] || 0) + 1;\n          }\n        }\n        if (restoredTotal === 0) {\n          showToast('이 파일에서 불러올 실사 데이터를 찾지 못했습니다.');\n          return;\n        }\n        saveSession();\n        render();\n        validWh.forEach(function (wh) { refreshPhotoCountsForWarehouse(wh); });\n        var summary = validWh.map(function (wh) { return wh + ' ' + (restoredByWh[wh] || 0) + '건'; }).join(', ');\n        showToast('이전 조사 결과를 불러왔습니다. (' + summary + ')');\n      } catch (err) {\n        var msg = '파일을 읽지 못했습니다. \"다운로드\"로 받은 재고조사 파일인지 확인해 주세요.';\n        if (err.message === 'WAREHOUSE_MISMATCH') msg = '현재 불러온 ERP 파일에 없는 창고입니다. 같은 ERP 파일을 먼저 업로드해 주세요.';\n        if (err.message === 'NO_XLSX_IN_ZIP') msg = '압축 파일 안에서 재고조사 엑셀을 찾지 못했습니다.';\n        showToast(msg);\n      }\n    };\n    reader.onerror = function () { showToast('파일을 불러오지 못했습니다.'); };\n    reader.readAsArrayBuffer(file);\n  }\n\n  // 박스당 수량표 업로드: 품목코드(ERP코드, D열)로 우선 매칭하고, 코드가 없으면 A열 이름으로 대체 매칭한다.\n  function importBoxQtyTable(file) {\n    var reader = new FileReader();\n    reader.onload = function (e) {\n      try {\n        var workbook = XLSX.read(e.target.result, { type: 'array' });\n        var sheet = workbook.Sheets[workbook.SheetNames[0]];\n        var rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });\n        if (rows.length < 2) throw new Error('EMPTY');\n\n        var codeToKey = {};\n        var nameToKey = {};\n        state.items.forEach(function (it) {\n          var k = itemKey(it.name, it.code);\n          if (it.code) codeToKey[it.code] = k;\n          nameToKey[it.name] = k;\n        });\n\n        var applied = 0;\n        for (var r = 1; r < rows.length; r++) {\n          var row = rows[r] || [];\n          var nameA = String(row[0] || '').trim();\n          var erpCode = String(row[3] || '').trim();\n          var qty = Number(row[4]);\n          if (!qty || qty <= 0 || isNaN(qty)) continue;\n          var key = null;\n          if (nameA && nameToKey[nameA]) key = nameToKey[nameA];\n          else if (erpCode && codeToKey[erpCode]) key = codeToKey[erpCode];\n          if (!key) continue;\n          state.boxQty[key] = qty;\n          applied++;\n        }\n        if (applied === 0) {\n          showToast('일치하는 품목을 찾지 못했습니다. 파일 형식을 확인해 주세요.');\n          return;\n        }\n        saveSession();\n        render();\n        showToast('박스당 수량 ' + applied + '건을 반영했습니다.');\n      } catch (err) {\n        showToast('박스수량표 파일을 읽지 못했습니다.');\n      }\n    };\n    reader.onerror = function () { showToast('파일을 불러오지 못했습니다.'); };\n    reader.readAsArrayBuffer(file);\n  }\n\n  // ---------- XLSX export (지정 양식) ----------\n  function yymmdd() {\n    var d = new Date();\n    function pad(n) { return (n < 10 ? '0' : '') + n; }\n    return String(d.getFullYear()).slice(2) + pad(d.getMonth() + 1) + pad(d.getDate());\n  }\n\n  function pad3(n) {\n    n = String(n);\n    while (n.length < 3) n = '0' + n;\n    return n;\n  }\n\n  function nextExportSeq(dateStr) {\n    var k = 'combined_' + dateStr;\n    var n = (state.exportSeq[k] || 0) + 1;\n    state.exportSeq[k] = n;\n    saveSession();\n    return n;\n  }\n\n  // 조사한(임시저장이 1건이라도 있는) 모든 창고를 한 시트에 나란히 담는다.\n  // 열 구성: 품목코드, 품목명, [E-창고명, 실사-창고명, 점검] × 창고 수\n  // 임시저장(체크) 안 된 품목은 실사/점검 칸을 비워 둔다.\n  function buildCombinedSheetRows(warehouseNames) {\n    var totalCols = 2 + warehouseNames.length * 3;\n    var metaRow = [];\n    for (var i = 0; i < totalCols; i++) metaRow.push('');\n    metaRow[0] = '재고조사일 :';\n    metaRow[1] = todayISODate();\n    metaRow[3] = '조사 창고 :';\n    metaRow[4] = warehouseNames.join(', ');\n\n    var headerRow = ['품목코드', '품목명'];\n    warehouseNames.forEach(function (wh) {\n      headerRow.push('E- ' + wh, '실사-' + wh, '점검');\n    });\n\n    var rows = [metaRow, headerRow];\n\n    state.items.forEach(function (it) {\n      var key = itemKey(it.name, it.code);\n      var row = [it.code, it.name];\n      warehouseNames.forEach(function (wh) {\n        var eQty = it.qtyByWh[wh] || 0;\n        var checked = !!(state.locked[wh] && state.locked[wh][key]);\n        var actual = checked ? Number(state.actualQty[wh][key]) : '';\n        var result = checked ? (Number(actual) === Number(eQty) ? '일치' : '불일치') : '';\n        row.push(eQty, actual, result);\n      });\n      rows.push(row);\n    });\n\n    // 창고별로 임시저장된 신규(수동 추가) 품목도 각각 한 행씩 추가한다.\n    warehouseNames.forEach(function (wh) {\n      (state.manualItems[wh] || []).forEach(function (m) {\n        var key = 'm:' + m.id;\n        if (!(state.locked[wh] && state.locked[wh][key])) return;\n        var row = ['', m.name + ' (신규)'];\n        warehouseNames.forEach(function (wh2) {\n          if (wh2 === wh) {\n            var actual = Number(state.actualQty[wh][key]);\n            row.push(0, actual, Number(actual) === 0 ? '일치' : '불일치');\n          } else {\n            row.push('', '', '');\n          }\n        });\n        rows.push(row);\n      });\n    });\n\n    return rows;\n  }\n\n  function buildXlsxBufferFromRows(rows) {\n    var ws = XLSX.utils.aoa_to_sheet(rows);\n    var wb = XLSX.utils.book_new();\n    XLSX.utils.book_append_sheet(wb, ws, '재고현황');\n    return XLSX.write(wb, { bookType: 'xlsx', type: 'array' });\n  }\n\n  async function saveBinaryFile(filename, data, mimeType) {\n    if (typeof window.claude !== 'undefined' && window.claude && typeof window.claude.use === 'function') {\n      try {\n        var dl = await window.claude.use('downloads');\n        if (dl) {\n          try {\n            await dl.save({ filename: filename, data: data });\n            return true;\n          } catch (err) {\n            if (err && err.code === 'declined') return false;\n            /* fall through to browser fallback below */\n          }\n        }\n      } catch (e) { /* fall through to browser fallback below */ }\n    }\n    try {\n      var blob = new Blob([data], { type: mimeType });\n      var url = URL.createObjectURL(blob);\n      var a = document.createElement('a');\n      a.href = url;\n      a.download = filename;\n      document.body.appendChild(a);\n      a.click();\n      document.body.removeChild(a);\n      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);\n      return true;\n    } catch (e) {\n      return false;\n    }\n  }\n\n  // 임시저장이 하나라도 있는 모든 창고를 한 파일에 묶어 저장한다.\n  // 파일명: 창고 1개면 \"재고 조사_창고명_YYMMDD_###\", 2개 이상이면 \"재고 조사_창고N개_YYMMDD_###\".\n  // 사진이 있으면 \"재고 script src=\"lib/tesseract/tesseract.min.js\"><\/script>\n<script>var PACK_TESS={workerPath:new URL('lib/tesseract/worker.min.js',document.baseURI).href,corePath:new URL('lib/tesseract',document.baseURI).href,langPath:new URL('lib/tesseract',document.baseURI).href};<\/script>\n<script src=\"lib/jszip.min.js\"><\/script>\n<style>\n  * { box-sizing: border-box; }\n\n  :root {\n    --accent: #EF9F27;\n    --accent-dark: #9c5f0a;\n    --bg: #faf3e8;\n    --card-bg: #fffdf9;\n    --card-border: #e8d3ab;\n    --btn-secondary-bg: #fdeecd;\n    --btn-secondary-text: #8a5a10;\n    --header-bg: #f3e2c0;\n    --thumb-bg: #f3e6cf;\n  }\n  body.mode-in {\n    --accent: #185FA5;\n    --accent-dark: #0c3d6b;\n    --bg: #eaf2fb;\n    --card-bg: #ffffff;\n    --card-border: #b9d3ec;\n    --btn-secondary-bg: #e0eefb;\n    --btn-secondary-text: #0c447c;\n    --header-bg: #d7e8f8;\n    --thumb-bg: #e4eefa;\n  }\n\n  body {\n    margin: 0; padding: 12px; background: var(--bg);\n    font-family: -apple-system, \"Noto Sans KR\", \"Malgun Gothic\", sans-serif;\n    color: #2c2c2a; padding-bottom: 60px;\n    transition: background 0.2s ease;\n  }\n  h1 { font-size: 19px; font-weight: 700; margin: 4px 0 14px; text-align: center; color: var(--accent-dark); }\n  .step {\n    background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px;\n    padding: 14px; margin-bottom: 12px;\n  }\n  .step[disabled-look=\"1\"] { opacity: 0.45; pointer-events: none; }\n  .step-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; display:flex; align-items:center; gap:6px; }\n  .badge {\n    display:inline-flex; align-items:center; justify-content:center;\n    width:22px; height:22px; border-radius:50%; background:var(--accent); color:#fff;\n    font-size:12px; font-weight:700; flex-shrink:0;\n  }\n  select, input[type=text], input[type=number] {\n    width: 100%; padding: 10px; font-size: 15px; border: 1px solid var(--card-border);\n    border-radius: 8px; margin-bottom: 8px; background:#fff;\n  }\n  button {\n    width: 100%; padding: 12px; font-size: 15px; font-weight: 600;\n    border: none; border-radius: 8px; background: var(--accent); color: #fff;\n    margin-bottom: 8px; cursor: pointer;\n  }\n  button.secondary { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }\n  button.recog-active { background: var(--accent); color: #fff; }\n  button.gray { background: #eee; color: #444; }\n  button.green { background: #3B6D11; }\n  button.outline { background:#fff; border:1px solid var(--accent); color:var(--accent-dark); }\n  button:disabled { opacity: 0.4; }\n  .row { display: flex; gap: 8px; }\n  .tree-col {\n    flex: 1; display: flex; flex-direction: column;\n    border: 2px solid var(--card-border); border-radius: 12px;\n    background: var(--header-bg); padding: 8px;\n  }\n  .type-card-title { text-align: center; font-weight: 700; font-size: 15px; color: var(--accent-dark); margin-bottom: 6px; }\n  .tree-children { display: flex; flex-direction: row; gap: 6px; }\n  .tree-children button { flex: 1; margin-bottom: 0; padding: 8px 4px; font-size: 12px; }\n  .capture-btn { background: var(--btn-secondary-bg); color: var(--btn-secondary-text); }\n  .quick-label {\n    flex: 0 0 auto; font-size: 11px; font-weight: 700; color: #777;\n    background: #eee; border-radius: 6px; padding: 4px 6px; white-space: nowrap;\n  }\n  .quick-section { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--card-border); }\n  .quick-toggle-btn { font-size: 10px; padding: 4px 6px; width: auto; display: inline-block; margin-bottom: 8px; }\n  .capture-btn.active-capture { background: var(--accent); color: #fff; font-weight: 700; }\n  .tree-col.sleeve-col { background: #FBE7C6; border-color: #EF9F27; }\n  .sleeve-col .type-card-title { color: #9c5f0a; }\n  .capture-btn.sleeve-group { background: #F6C878; color: #6b3d00; border: 1px solid #EF9F27; }\n  .capture-btn.sleeve-group.active-capture { background: #C97B12; color: #fff; b "step-title\" style=\"margin-bottom:0;\"><span class=\"badge\">6<\/span> 출고 이력<span class=\"pending-badge\" id=\"historyCount\">0건<\/span><\/span>\n    <span id=\"historyToggleArrow\" style=\"font-size:12px; color:#888;\">▾ 펼치기<\/span>\n  <\/button>\n  <div id=\"historyPanel\" style=\"display:none; margin-top:10px;\">\n    <input type=\"text\" id=\"logSearchInput\" placeholder=\"업체, 품명, LOT, 날짜/시각으로 검색\" oninput=\"onLogSearchInput(this.value)\" style=\"margin-bottom:8px;\">\n    <button class=\"gray\" onclick=\"exportCSV()\">CSV로 내보내기<\/button>\n    <div style=\"overflow-x:auto\">\n      <table id=\"logTable\">\n        <thead><tr><th>시각<\/th><th>구분<\/th><th>업체<\/th><th>품명<\/th><th>LOT<\/th><th>박스당수량<\/th><th>박스수<\/th><th>전체수량<\/th><th>파일번호<\/th><th>인보이스<\/th><th>관리<\/th><\/tr><\/thead>\n        <tbody id=\"logBody\"><\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"step\" style=\"background:var(--card-bg, #fff); border:1px dashed var(--accent, #999);\">\n  <button type=\"button\" id=\"backupToggleBtn\" onclick=\"toggleBackupPanelOpen()\" style=\"display:flex; align-items:center; justify-content:space-between; width:100%; font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;\">\n    <span class=\"step-title\" style=\"margin-bottom:0; font-size:14px;\"><span class=\"badge\" id=\"backupBadgeNum\">7<\/span> 백업<\/span>\n    <span id=\"backupToggleArrow\" style=\"font-size:12px; color:#888;\">▾ 펼치기<\/span>\n  <\/button>\n  <div id=\"backupPanel\" style=\"display:none; margin-top:10px;\">\n    <div style=\"font-size:12px; color:#888; margin-bottom:10px;\">\n      이 파일을 다른 폴더로 옮기거나, 복사본을 만들거나, 이름을 바꿔서 열면 브라우저가 저장해 둔 사진·이력이 새 파일에서는 안 보일 수 있습니다.\n      옮기기 전에 <b>내보내기<\/b>로 백업 파일을 받아두고, 새 파일을 처음 열 때 <b>가져오기<\/b>로 불러오면 사진과 이력이 그대로 이어집니다.\n    <\/div>\n    <div class=\"row\" style=\"gap:8px;\">\n      <button type=\"button\" class=\"gray\" onclick=\"exportFullBackup()\">백업 내보내기<\/button>\n      <button type=\"button\" class=\"gray\" onclick=\"document.getElementById('backupImportInput').click()\">백업 가져오기<\/button>\n    <\/div>\n    <input type=\"file\" id=\"backupImportInput\" accept=\"application/json\" style=\"display:none\" onchange=\"onBackupFileSelected(event)\">\n    <div id=\"backupStatus\" class=\"status\"><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"packPanel\">\n  <input type=\"file\" accept=\"image/*\" capture=\"environment\" id=\"packLabelCam\" style=\"display:none\" onchange=\"packOnLabel(event)\">\n  <input type=\"file\" accept=\"image/*\" id=\"packLabelGal\" style=\"display:none\" onchange=\"packOnLabel(event)\">\n  <input type=\"file\" accept=\"image/*\" capture=\"environment\" id=\"packQtyCam\" style=\"display:none\" onchange=\"packOnQty(event)\">\n  <input type=\"file\" accept=\"image/*\" multiple id=\"packQtyGal\" style=\"display:none\" onchange=\"packOnQty(event)\">\n  <input type=\"file\" accept=\".json,application/json,text/plain\" id=\"packFileIn\" style=\"display:none\" onchange=\"packOnFile(event)\">\n  <div class=\"pk-top\">\n    <button class=\"gray pk-nav\" id=\"pkPrev\" onclick=\"packPrev()\" aria-label=\"이전\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button>\n    <h2 id=\"pkTitle\">패킹 연동 입출고<\/h2>\n    <button class=\"gray pk-nav\" id=\"pkNext\" onclick=\"packNext()\" aria-label=\"다음 미완료 품목\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button>\n    <button class=\"gray pk-sm pk-tg\" id=\"pkBig\" onclick=\"packToggleUi('big')\" title=\"큰 글씨\">A+<\/button>\n    <button class=\"gray pk-sm pk-tg\" id=\"pkDark\" onclick=\"packToggleUi('dark')\" title=\"어둡게\">다크<\/button>\n  <\/div>\n  <div id=\"packBody\"><\/div>\n  <div id=\"pkModal\" class=\"pk-modal\"><div class=\"pk-modal-card\" id=\"pkModalCard\"><\/div><\/div>\n<\/div>\n\n<script>\nconst DEFAULT_COMPANIES = [\"삼성전자\",\"삼성 폴란드\",\"삼성 태국\",\"삼성 베트남\",\"삼성 멕시코\",\"삼성전자 서비스센터\",\"JC\",\"하나테크\",\"파츠플러스\",\"그린테크\",\"DCE\",\"부성엠에스\",\"유남전기\",\"오비오 주식회사\",\"태성전기\",\"(주)디엘통상\",\"에이 아이 엠 텍\",\"HITACHI THAILAND\",\"VESTEL\",\"NIKSUN\",\"TENSAI\",\"RFL BANGLADESH\",\"WALTON(방글라데시)\",\"용진 ENG [툴 제작업체]\"];\n\nlet state = { company: '', labelFile: null, qtyFiles: [], product: '', lot: '', perBox: '', mode: 'out', recogType: 'sleeve', invoiceFiles: [], invoiceNumber: '', editingDraftId: null };\n\n// ---------- 버튼 클릭 효과음 (짧은 비프음, 외부 파일 없이 생성) ----------\nlet audioCtx = null;\nfunction playClickSound() {\n  try {\n    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n    if (audioCtx.state === 'suspended') audioCtx.resume();\n    const osc = audioCtx.createOscillator();\n    const gain = audioCtx.createGain();\n    osc.type = 'sine';\n    osc.frequency.value = 720;\n    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);\n    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.07);\n    osc.connect(gain);\n    gain.connect(audioCtx.destination);\n    osc.start();\n    osc.stop(audioCtx.currentTime + 0.07);\n  } catch (e) { /* 오디오 미지원 브라우저는 무시 */ }\n}\ndocument.addEventListener('click', function (e) {\n  if (e.target.closest('button')) playClickSound();\n}, true);\n\nfunction captureWithType(type, source) {\n  state.recogType = type;\n  document.querySelectorAll('.capture-btn').forEach(b => b.classList.remove('active-capture'));\n  const btnId = type === 'sleeve'\n    ? (source === 'camera' ? 'btnSleeveCamera' : 'btnSleeveGallery')\n    : (source === 'camera' ? 'btnSealCamera' : 'btnSealGallery');\n  document.getElementById(btnId).classList.add('active-capture');\n  const inputId = source === 'camera' ? 'labelInputCamera' : 'labelInputGallery';\n  document.getElementById(inputId).click();\n}\n\n// ---------- 락실 LOT 빠른 입력 (클릭/숫자 4자리 + 드롭다운으로 완성) ----------\nfunction splitLot(lot, prefix) {\n  const re = new RegExp('^' + prefix + '-([0-9]+)(?:-([A-Za-z]))?$');\n  const m = (lot || '').match(re);\n  if (!m) return { digits: '', suffix: '' };\n  return { digits: m[1], suffix: (m[2] || '').toUpperCase() };\n}\n\nfunction onSealPrefixChange() {\n  const isCustom = document.getElementById('sealPrefixSelect').value === 'custom';\n  const select = document.getElementById('sealPrefixSelect');\n  const customInput = document.getElementById('sealPrefixCustom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('lotDigits');\n  }\n  updateQuickLot();\n}\n\nfunction onSealSuffixChange() {\n  const isCustom = document.getElementById('lotSuffix').value === 'custom';\n  const select = document.getElementById('lotSuffix');\n  const customInput = document.getElementById('lotSuffixCustom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('perBoxManual');\n  }\n  updateQuickLot();\n}\n\nfunction showQuickLotBuilder(type, digits, suffix) {\n  const pSelect = document.getElementById('sealPrefixSelect');\n  const pCustom = document.getElementById('sealPrefixCustom');\n  if (type === 'V2B' || type === '77') {\n    pSelect.value = type; pSelect.style.display = 'block'; pCustom.style.display = 'none'; pCustom.value = '';\n  } else if (type) {\n    pSelect.value = 'custom'; pSelect.style.display = 'none'; pCustom.style.display = 'block'; pCustom.value = type;\n  } else {\n    pSelect.value = 'V2B'; pSelect.style.display = 'block'; pCustom.style.display = 'none'; pCustom.value = '';\n  }\n\n  document.getElementById('lotDigits').value = digits || '';\n\n  const sSelect = document.getElementById('lotSuffix');\n  const sCustom = document.getElementById('lotSuffixCustom');\n  if (suffix === 'E' || suffix === 'K') {\n    sSelect.value = suffix; sSelect.style.display = 'block'; sCustom.style.display = 'none'; sCustom.value = '';\n  } else if (suffix) {\n    sSelect.value = 'custom'; sSelect.style.display = 'none'; sCustom.style.display = 'block'; sCustom.value = suffix;\n  } else {\n    sSelect.value = 'E'; sSelect.style.display = 'block'; sCustom.style.display = 'none'; sCustom.value = '';\n  }\n\n  document.getElementById('normalProductBlock').style.display = 'none';\n  document.getElementById('quickLotBuilder').style.display = 'block';\n  document.getElementById('lotManualHint').style.display = 'none';\n  document.getElementById('lotManual').style.display = 'none';\n\n  if (!document.getElementById('perBoxManual').value) {\n    document.getElementById('perBoxManual').value = 100;\n    state.perBox = 100;\n  }\n  updateQuickLot();\n  document.getElementById('candidateBlock').style.display = 'block';\n}\n\nfunction updateQuickLot() {\n  const pSel = document.getElementById('sealPrefixSelect').value;\n  const prefix = pSel === 'custom' ? document.getElementById('sealPrefixCustom').value.trim().toUpperCase() : pSel;\n  const digits = document.getElementById('lotDigits').value.trim();\n  const sSel = document.getElementById('lotSuffix').value;\n  const suffix = sSel === 'custom' ? document.getElementById('lotSuffixCustom').value.trim().toUpperCase() : sSel;\n\n  const preview = document.getElementById('sealProductPreview');\n  if (pSel === 'V2B') {\n    state.product = '0201-003797';\n    preview.value = state.product;\n    preview.readOnly = true;\n  } else if (pSel === '77') {\n    state.product = '0201-003450';\n    preview.value = state.product;\n    preview.readOnly = true;\n  } else {\n    preview.readOnly = false;\n    state.product = preview.value.trim();\n  }\n  document.getElementById('productManual').value = state.product;\n\n  if (prefix && digits && suffix) {\n    const lot = `${prefix}-${digits}-${suffix}`;\n    document.getElementById('lotManual').value = lot;\n    state.lot = lot;\n  }\n}\n\nfunction hideSealUI() {\n  document.getElementById('quickLotBuilder').style.display = 'none';\n  document.getElementById('normalProductBlock').style.display = 'block';\n  document.getElementById('lotManualHint').style.display = 'block';\n  document.getElementById('lotManual').style.display = 'block';\n  hideLotSleeveBuilder();\n}\n\n// ---------- 락슬리브 품명 빠른 입력 (ALS-[3자리][S/A/AF][4자리] 형식) ----------\nconst ALS_PART1_PRESETS = ['082', '102', '112', '122', '132'];\nconst ALS_PART2_PRESETS = ['S', 'A', 'AF'];\n\nfunction onAlsPart1Change() {\n  const isCustom = document.getElementById('alsPart1Select').value === 'custom';\n  const select = document.getElementById('alsPart1Select');\n  const customInput = document.getElementById('alsPart1Custom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('alsPart2Select');\n  }\n  updateQuickAls();\n}\n\nfunction onAlsPart2Change() {\n  const isCustom = document.getElementById('alsPart2Select').value === 'custom';\n  const select = document.getElementById('alsPart2Select');\n  const customInput = document.getElementById('alsPart2Custom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('alsDigits4');\n  }\n  updateQuickAls();\n}\n\nfunction updateQuickAls() {\n  const sel1 = document.getElementById('alsPart1Select').value;\n  const p1 = sel1 === 'custom' ? document.getElementById('alsPart1Custom').value.trim() : sel1;\n  const sel2 = document.getElementById('alsPart2Select').value;\n  const p2 = sel2 === 'custom' ? document.getElementById('alsPart2Custom').value.trim().toUpperCase() : sel2;\n  const d4 = document.getElementById('alsDigits4').value.trim();\n  if (p1 && p2 && d4) {\n    const val = `${p1}${p2}${d4}`;\n    document.getElementById('productManual').value = val;\n    state.product = val;\n    document.querySelectorAll('#productChips .chip').forEach(x => x.classList.remove('selected'));\n  }\n}\n\nfunction showAlsBuilder(d3, letter, d4) {\n  const p1Select = document.getElementById('alsPart1Select');\n  const p1Custom = document.getElementById('alsPart1Custom');\n  if (d3 && ALS_PART1_PRESETS.includes(d3)) {\n    p1Select.value = d3; p1Select.style.display = 'block'; p1Custom.style.display = 'none'; p1Custom.value = '';\n  } else if (d3) {\n    p1Select.value = 'custom'; p1Select.style.display = 'none'; p1Custom.style.display = 'block'; p1Custom.value = d3;\n  } else {\n    p1Select.value = '102'; p1Select.style.display = 'block'; p1Custom.style.display = 'none'; p1Custom.value = '';\n  }\n\n  const p2Select = document.getElementById('alsPart2Select');\n  const p2Custom = document.getElementById('alsPart2Custom');\n  if (letter && ALS_PART2_PRESETS.includes(letter)) {\n    p2Select.value = letter; p2Select.style.display = 'block'; p2Custom.style.display = 'none'; p2Custom.value = '';\n  } else if (letter) {\n    p2Select.value = 'custom'; p2Select.style.display = 'none'; p2Custom.style.display = 'block'; p2Custom.value = letter;\n  } else {\n    p2Select.value = 'S'; p2Select.style.display = 'block'; p2Custom.style.display = 'none'; p2Custom.value = '';\n  }\n\n  document.getElementById('alsDigits4').value = d4 || '';\n  document.getElementById('quickAlsBuilder').style.display = 'block';\n  document.getElementById('normalProductBlock').style.display = 'none';\n  updateQuickAls();\n}\n\nfunction hideAlsBuilder() {\n  document.getElementById('quickAlsBuilder').style.display = 'none';\n  document.getElementById('normalProductBlock').style.display = 'block';\n}\n\n// 인식된 품명이 \"000A0000\" 형식이면 빠른 입력 칸에도 나눠서 채워줌\nfunction splitAlsProduct(product) {\n  const m = (product || '').match(/^([0-9]{2,4})([A-Z]{1,3})([0-9]{1,5})$/i);\n  if (!m) return null;\n  return { d3: m[1], letter: m[2].toUpperCase(), d4: m[3] };\n}\n\n// ---------- 락슬리브 LOT 번호 빠른 입력 (AP/P + 숫자2자리 + 0-9/A-C + 나머지) ----------\nconst LOT_PREFIX_PRESETS = ['AP', 'P'];\nconst LOT_CHAR_PRESETS = ['1','2','3','4','5','6','7','8','9','0','A','B','C'];\n\nfunction onLotPrefixChange() {\n  const isCustom = document.getElementById('lotPrefixSelect').value === 'custom';\n  const select = document.getElementById('lotPrefixSelect');\n  const customInput = document.getElementById('lotPrefixCustom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('lotD2');\n  }\n  updateQuickLotSleeve();\n}\n\nfunction onLotCharChange() {\n  const isCustom = document.getElementById('lotCharSelect').value === 'custom';\n  const select = document.getElementById('lotCharSelect');\n  const customInput = document.getElementById('lotCharCustom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('lotD3');\n  }\n  updateQuickLotSleeve();\n}\n\nfunction enforceMaxLen(el, len) {\n  if (el.value.length > len) el.value = el.value.slice(0, len);\n}\n\nfunction updateQuickLotSleeve() {\n  const sel = document.getElementById('lotPrefixSelect').value;\n  const prefix = sel === 'custom' ? document.getElementById('lotPrefixCustom').value.trim().toUpperCase() : sel;\n  const d2 = document.getElementById('lotD2').value.trim();\n  const charSel = document.getElementById('lotCharSelect').value;\n  const char = charSel === 'custom' ? document.getElementById('lotCharCustom').value.trim().toUpperCase() : charSel;\n  const d3 = document.getElementById('lotD3').value.trim();\n  const remainder = document.getElementById('lotRemainder').value.trim();\n  if (prefix && d2 && char && d3 && remainder) {\n    const val = `${prefix}${d2}${char}${d3}-${remainder}`;\n    document.getElementById('lotManual').value = val;\n    state.lot = val;\n  }\n}\n\nfunction showLotSleeveBuilder(prefix, d2, char, d3, remainder) {\n  const pSelect = document.getElementById('lotPrefixSelect');\n  const pCustom = document.getElementById('lotPrefixCustom');\n  if (prefix && LOT_PREFIX_PRESETS.includes(prefix)) {\n    pSelect.value = prefix; pSelect.style.display = 'block'; pCustom.style.display = 'none'; pCustom.value = '';\n  } else if (prefix) {\n    pSelect.value = 'custom'; pSelect.style.display = 'none'; pCustom.style.display = 'block'; pCustom.value = prefix;\n  } else {\n    pSelect.value = 'AP'; pSelect.style.display = 'block'; pCustom.style.display = 'none'; pCustom.value = '';\n  }\n  document.getElementById('lotD2').value = d2 || '';\n  const cSelect = document.getElementById('lotCharSelect');\n  const cCustom = document.getElementById('lotCharCustom');\n  if (char && LOT_CHAR_PRESETS.includes(char)) {\n    cSelect.value = char; cSelect.style.display = 'block'; cCustom.style.display = 'none'; cCustom.value = '';\n  } else if (char) {\n    cSelect.value = 'custom'; cSelect.style.display = 'none'; cCustom.style.display = 'block'; cCustom.value = char;\n  } else {\n    cSelect.value = '1'; cSelect.style.display = 'block'; cCustom.style.display = 'none'; cCustom.value = '';\n  }\n  document.getElementById('lotD3').value = d3 || '';\n  document.getElementById('lotRemainder').value = remainder || '';\n  document.getElementById('quickLotSleeveBuilder').style.display = 'block';\n  document.getElementById('lotManualHint').style.display = 'none';\n  document.getElementById('lotManual').style.display = 'none';\n  updateQuickLotSleeve();\n}\n\nfunction hideLotSleeveBuilder() {\n  document.getElementById('quickLotSleeveBuilder').style.display = 'none';\n  document.getElementById('lotManualHint').style.display = 'block';\n  document.getElementById('lotManual').style.display = 'block';\n}\n\nfunction splitLotSleeve(lot) {\n  const m = (lot || '').match(/^(AP|P)([0-9]{2})([0-9A-C])([0-9]{2})-(.+)$/i);\n  if (!m) return null;\n  return { prefix: m[1].toUpperCase(), d2: m[2], char: m[3].toUpperCase(), d3: m[4], remainder: m[5] };\n}\n\n// ---------- 인보이스 사진 (선택사항) ----------\nasync function onInvoicePhoto(e) {\n  const files = Array.from(e.target.files || []);\n  for (const file of files) {\n    if (state.invoiceFiles.length >= 10) break;\n    state.invoiceFiles.push(file);\n    renderInvoiceThumbs();\n    if (!state.invoiceNumber) {\n      await runInvoiceOcr(file);\n    }\n  }\n  e.target.value = '';\n}\n\nfunction renderInvoiceThumbs() {\n  const wrap = document.getElementById('invoiceThumbs');\n  wrap.innerHTML = '';\n  state.invoiceFiles.forEach((f, idx) => {\n    const url = URL.createObjectURL(f);\n    const div = document.createElement('div');\n    div.className = 'qty-thumb-wrap';\n    div.innerHTML = `<img src=\"${url}\">\n      <button type=\"button\" class=\"del\" onclick=\"removeInvoicePhoto(${idx})\">x<\/button>\n      <button type=\"button\" class=\"rot\" onclick=\"rotateInvoicePhoto(${idx})\" title=\"회전\" aria-label=\"회전\">&#8635;<\/button>`;\n    wrap.appendChild(div);\n  });\n  const btn = document.getElementById('invoiceCaptureBtn');\n  const galleryBtn = document.getElementById('invoiceGalleryBtn');\n  btn.textContent = `촬영 (${state.invoiceFiles.length}/10)`;\n  btn.disabled = state.invoiceFiles.length >= 10;\n  galleryBtn.disabled = state.invoiceFiles.length >= 10;\n}\n\nfunction removeInvoicePhoto(idx) {\n  state.invoiceFiles.splice(idx, 1);\n  renderInvoiceThumbs();\n}\n\nasync function rotateInvoicePhoto(idx) {\n  state.invoiceFiles[idx] = await rotateFile(state.invoiceFiles[idx], 90);\n  renderInvoiceThumbs();\n  if (!state.invoiceNumber) {\n    await runInvoiceOcr(state.invoiceFiles[idx]);\n  }\n}\n\nasync function runInvoiceOcr(file) {\n  const statusEl = document.getElementById('invoiceStatus');\n  statusEl.textContent = '인식 중...';\n  try {\n    let result = null;\n\n    // 0단계: 기기에 내장된 고속 OCR이 있으면 가장 먼저 시도\n    const nativeText = await nativeDetectText(file, 1600);\n    if (nativeText) result = parseInvoice(nativeText);\n\n    if (!result) {\n      const worker = await getInvoiceWorker();\n\n      // 0도(그대로)를 먼저 빠르게 시도하고, 실패할 때만 90/270도(옆으로 찍힌 경우)를 추가로 시도\n      const angles = [0, 90, 270];\n      for (const angle of angles) {\n        const fileVariant = angle === 0 ? file : await rotateFile(file, angle);\n        const processedDataUrl = await preprocessImage(fileVariant, 1100); // 인보이스는 큰 문서 사진이라 조금 더 작게 처리해 속도 우선\n        const { data: { text } } = await worker.recognize(processedDataUrl);\n        result = parseInvoice(text);\n        if (result) break;\n      }\n\n      // 문서 모드로 다 실패하면 흩어진 글자 찾기 모드 + 더 높은 해상도로 마지막 시도\n      if (!result) {\n        const sparseWorker = await getInvoiceWorkerSparse();\n        const url = await preprocessImage(file, 1600);\n        const { data: { text } } = await sparseWorker.recognize(url);\n        result = parseInvoice(text);\n      }\n    }\n\n    if (result) {\n      hideInvoiceBuilder();\n      document.getElementById('invoiceManual').value = result.value;\n      state.invoiceNumber = result.value;\n      statusEl.textContent = '인식 완료: ' + result.value;\n    } else {\n      showInvoiceBuilder('AEBXP', todayYYMMDD(), '');\n      statusEl.textContent = '자동 인식 실패 - 아래에서 직접 채워주세요.';\n    }\n  } catch (err) {\n    console.error(err);\n    showInvoiceBuilder('AEBXP', todayYYMMDD(), '');\n    statusEl.innerHTML = '<span class=\"error\">인식 오류. 직접 입력해주세요.<\/span>';\n  }\n}\n\nfunction onInvoicePrefixChange() {\n  const isCustom = document.getElementById('invoicePrefixSelect').value === 'custom';\n  const select = document.getElementById('invoicePrefixSelect');\n  const customInput = document.getElementById('invoicePrefixCustom');\n  select.style.display = isCustom ? 'none' : 'block';\n  customInput.style.display = isCustom ? 'block' : 'none';\n  if (isCustom) {\n    customInput.value = '';\n    customInput.focus();\n  } else {\n    focusEl('invoiceDate6');\n  }\n  updateQuickInvoice();\n}\n\nfunction showInvoiceBuilder(prefix, date6, seq3) {\n  const select = document.getElementById('invoicePrefixSelect');\n  const customInput = document.getElementById('invoicePrefixCustom');\n  if (prefix === 'AEBXP' || prefix === 'VEBXP') {\n    select.value = prefix; select.style.display = 'block'; customInput.style.display = 'none'; customInput.value = '';\n  } else if (prefix) {\n    select.value = 'custom'; select.style.display = 'none'; customInput.style.display = 'block'; customInput.value = prefix;\n  } else {\n    select.value = 'AEBXP'; select.style.display = 'block'; customInput.style.display = 'none'; customInput.value = '';\n  }\n  document.getElementById('invoiceDate6').value = date6 || todayYYMMDD();\n  document.getElementById('invoiceSeq3').value = seq3 || '';\n  document.getElementById('quickInvoiceBuilder').style.display = 'block';\n  document.getElementById('invoiceToggleBtn').style.display = 'none';\n  updateQuickInvoice();\n}\n\nfunction hideInvoiceBuilder() {\n  document.getElementById('quickInvoiceBuilder').style.display = 'none';\n  document.getElementById('invoiceToggleBtn').style.display = 'block';\n}\n\nfunction toggleInvoiceBuilder() {\n  const el = document.getElementById('quickInvoiceBuilder');\n  if (el.style.display === 'none' || !el.style.display) {\n    const current = state.invoiceNumber;\n    const m = current ? current.match(/^([AV]EBXP)([0-9]{6})([0-9]{3})$/i) : null;\n    if (m) {\n      showInvoiceBuilder(m[1].toUpperCase(), m[2], m[3]);\n    } else {\n      showInvoiceBuilder('AEBXP', todayYYMMDD(), '');\n    }\n  } else {\n    hideInvoiceBuilder();\n  }\n}\n\nfunction updateQuickInvoice() {\n  const sel = document.getElementById('invoicePrefixSelect').value;\n  const prefix = sel === 'custom' ? document.getElementById('invoicePrefixCustom').value.trim().toUpperCase() : sel;\n  const date6 = document.getElementById('invoiceDate6').value.trim();\n  const seq3 = document.getElementById('invoiceSeq3').value.trim();\n  if (prefix && date6 && seq3) {\n    const val = `${prefix}${date6}${seq3}`;\n    document.getElementById('invoiceManual').value = val;\n    state.invoiceNumber = val;\n  }\n}\n\nfunction setMode(mode) {\n  state.mode = mode;\n  document.getElementById('modeTabOut').classList.toggle('active-out', mode === 'out');\n  document.getElementById('modeTabIn').classList.toggle('active-in', mode === 'in');\n  document.body.classList.toggle('mode-in', mode === 'in');\n}\nlet companies = [];\nlet logEntries = [];\nlet draftEntries = [];   // 촬영 완료 전까지의 임시 항목 (아직 파일 저장 안 됨)\nlet finalizedEntries = []; // 전체 저장을 마친 항목들 (logEntries와 같은 순서로 대응)\nlet sessionFiles = [];   // 최종 확정되어 zip 대상이 된 파일들\n\n// ---------- 사진 백업(IndexedDB) ----------\n// 임시저장/완료 항목의 사진을 기기에 실제로 저장해 둔다. 촬영 중간에 다른 앱을 오래 쓰거나\n// 화면을 꺼둬서 브라우저 탭이 새로고침되어도(메모리만 초기화됨) 사진이 사라지지 않게 하기 위함.\nlet shipPhotoDbPromise = null;\nfunction openShipPhotoDb() {\n  if (shipPhotoDbPromise) return shipPhotoDbPromise;\n  shipPhotoDbPromise = new Promise(function (resolve, reject) {\n    if (!window.indexedDB) { reject(new Error('IndexedDB 사용 불가')); return; }\n    var req = indexedDB.open('shipping_photos_v1', 1);\n    req.onupgradeneeded = function (e) {\n      var db = e.target.result;\n      var store = db.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });\n      store.createIndex('ownerId', 'ownerId', { unique: false });\n    };\n    req.onsuccess = function (e) { resolve(e.target.result); };\n    req.onerror = function () { reject(req.error); };\n  });\n  return shipPhotoDbPromise;\n}\nfunction dbAddShipPhoto(rec) {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve, reject) {\n      var tx = db.transaction('photos', 'readwrite');\n      var req = tx.objectStore('photos').add(rec);\n      req.onsuccess = function () { resolve(req.result); };\n      req.onerror = function () { reject(req.error); };\n    });\n  });\n}\nfunction dbGetShipPhotosForOwner(ownerId) {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve, reject) {\n      var tx = db.transaction('photos', 'readonly');\n      var idx = tx.objectStore('photos').index('ownerId');\n      var req = idx.getAll(IDBKeyRange.only(ownerId));\n      req.onsuccess = function () { resolve(req.result || []); };\n      req.onerror = function () { reject(req.error); };\n    });\n  });\n}\nfunction dbDeleteShipPhotosForOwner(ownerId) {\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve, reject) {\n      var tx = db.transaction('photos', 'readwrite');\n      var idx = tx.objectStore('photos').index('ownerId');\n      var req = idx.openCursor(IDBKeyRange.only(ownerId));\n      req.onsuccess = function (e) {\n        var cursor = e.target.result;\n        if (cursor) { cursor.delete(); cursor.continue(); }\n        else resolve();\n      };\n      req.onerror = function () { reject(req.error); };\n    });\n  }).catch(function () { /* IndexedDB 사용 불가 - 조용히 무시 (백업이 안 될 뿐, 앱 동작에는 지장 없음) */ });\n}\n// 다운로드(zip)를 마친 항목들의 사진 기록에 \"다운로드한 시각\"을 남긴다. 이 시각을 기준으로\n// 일정 기간이 지나면 자동 정리 대상이 된다(다운로드 전 항목은 절대 자동 삭제하지 않음).\nfunction markShipPhotosDownloaded(ownerIds) {\n  if (!ownerIds || !ownerIds.length) return Promise.resolve();\n  return openShipPhotoDb().then(function (db) {\n    return new Promise(function (resolve) {\n      var tx = db.transaction('photos', 'readwrite');\n      var store = tx.objectStore('photos');\n      var idx = store.index('ownerId');\n      var now = Date.now();\n      var remaining = ownerIds.length;\n      var done = function () { remaining--; if (remaining <= 0) resolve(); };\n      ownerIds.forEach(function (owne
