s).filter(d => d.planKey === it.key);\n  let boxes = 0, qty = 0; const lots = [];\n  es.forEach(d => { boxes += Number(d.boxCount) || 0; qty += Number(d.total) || 0; if (d.lot) lots.push(d.lot); });\n  return { n: es.length, boxes, qty, lots };\n}\nfunction packOthers(it) {\n  const rows = (packShared[packKeyMode(it.key)] || {})[it.key] || [];\n  return rows.filter(r => r.worker !== packWorker && (Number(r.boxes) > 0 || Number(r.qty) > 0));\n}\nfunction packPlanBoxesBase(it, perBox) {\n  perBox = Number(perBox) || it.perBox || 0;\n  return it.boxes || (perBox && it.qty ? Math.ceil(it.qty / perBox) : 0);\n}\n// state: 'none' | 'partial' | 'done'\nfunction packItemState(it) {\n  const mine = packMine(it), oth = packOthers(it);\n  let oq = 0, ob = 0; oth.forEach(r => { oq += Number(r.qty) || 0; ob += Number(r.boxes) || 0; });\n  const qty = mine.qty + oq, boxes = mine.boxes + ob;\n  const planQty = it.qty || 0, planBoxes = packPlanBoxesBase(it, 0);\n  const byBox = !!it.photoOnly || !planQty;\n  let state = 'none';\n  if (mine.n || oth.length) {\n    if (byBox && planBoxes > 0) state = boxes >= planBoxes ? 'done' : 'partial';\n    else if (planQty > 0) state = qty >= planQty ? 'done' : 'partial';\n    else state = 'done';\n  }\n  return { state, mine, oth, qty, boxes, planQty, planBoxes, byBox,\n    remQty: Math.max(0, planQty - qty), remBoxes: Math.max(0, planBoxes - boxes) };\n}\nfunction packStateBadge(it) {\n  const st = packItemState(it);\n  const names = st.oth.map(r => r.worker).filter((v, i, a) => a.indexOf(v) === i).join(', ');\n  const who = (st.mine.n ? '나' : '') + (st.mine.n && names ? '+' : '') + names;\n  if (st.state === 'done') return `<div class=\"pk-badge ok\">완료${who ? '<br><small>' + pkEsc(who) + '<\/small>' : ''}<\/div>`;\n  if (st.state === 'partial') {\n    const t = st.byBox ? `${st.boxes}/${st.planBoxes}박스` : `${st.qty.toLocaleString()}/${st.planQty.toLocaleString()}`;\n    return `<div class=\"pk-badge part\">부분 ${t}${who ? '<br><small>' + pkEsc(who) + '<\/small>' : ''}<\/div>`;\n  }\n  return '<div class=\"pk-badge\">미완료<\/div>';\n}\n\nfunction packItemCount(it) {\n  return draftEntries.filter(d => d.planKey === it.key).length + logEntries.filter(e => e.planKey === it.key).length;\n}\nfunction packProgress(plan) {\n  let total = 0, done = 0, part = 0;\n  if (plan) plan.groups.forEach(g => g.items.forEach(it => { total++; const s = packItemState(it).state; if (s === 'done') done++; else if (s === 'partial') part++; }));\n  return { total, done, part };\n}\nasync function packRemoveItemEntries(key) {\n  draftEntries.filter(d => d.planKey === key && d.draftId).forEach(d => dbDeleteShipPhotosForOwner(d.draftId));\n  draftEntries = draftEntries.filter(d => d.planKey !== key);\n  for (let i = finalizedEntries.length - 1; i >= 0; i--) {\n    if (finalizedEntries[i].planKey === key) removeFinalizedFromStorage(i);\n  }\n  logEntries = logEntries.filter(e => e.planKey !== key);\n  persistDraftsMeta();\n  await storeSet('log', logEntries);\n  renderDraftList(); renderLog(); updatePendingBadge();\n  packSyncPushKey(key);\n}\nfunction packFindItem(key, plan) {\n  if (!plan) return null;\n  for (let gi = 0; gi < plan.groups.length; gi++) {\n    const ii = plan.groups[gi].items.findIndex(x => x.key === key);\n    if (ii !== -1) return { gi, ii };\n  }\n  return null;\n}\n// 임시저장/이력 쪽에서 '삭제 후 다시 하기'를 눌렀을 때: 해당 품목 기록을 지우고 촬영 화면으로 이동\nasync function packRedoByKey(key) {\n  await packRemoveItemEntries(key);\n  const mode = String(key).indexOf('IN|') === 0 ? 'in' : 'out';\n  openPackPanel();\n  packEnter(mode);\n  const p = packFindItem(key, packPlan);\n  if (p) packOpenItem(p.gi, p.ii); else packRender();\n}\n\n// ---------- 모달 ----------\nfunction packModal(title, html, btns) {\n  packModalFns = (btns || []).map(b => b.fn);\n  const card = document.getElementById('pkModalCard');\n  card.innerHTML = `<div class=\"pk-title\">${pkEsc(title)}<\/div><div class=\"pk-modal-body\">${html}<\/div>\n    <div class=\"pk-modal-btns\">${(btns || []).map((b, i) => `<button class=\"${b.cls || 'secondary'}\" onclick=\"packModalBtn(${i})\">${pkEsc(b.text)}<\/button>`).join('')}<\/div>`;\n  document.getElementById('pkModal').classList.add('open');\n}\nfunction packModalClose() { document.getElementById('pkModal').classList.remove('open'); packModalFns = []; }\nfunction packModalBtn(i) {\n  const fn = packModalFns[i];\n  packModalClose();\n  if (fn) fn();\n}\n\n// ---------- 화면 그리기 ----------\nfunction packRender() {\n  const body = document.getElementById('packBody');\n  if (!body) return;\n  packRenderTop();\n  if (!packMode) { body.innerHTML = (!packConfigured() && !packNoSetup) ? packSetupHtml() : packChooserHtml(); return; }\n  if (packView === 'item' && packWork) { body.innerHTML = packItemHtml(); packRefreshBoxes(); packRenderBar(); return; }\n  body.innerHTML = packListHtml();\n}\n\nfunction packBannersHtml() {\n  let h = '';\n  if (packRecover) {\n    const m = packRecover.meta;\n    h += `<div class=\"pk-warn\"><b>촬영 중이던 품목이 있습니다<\/b><br>${pkEsc(m.label || '')}\n      <div class=\"row\" style=\"gap:6px;margin-top:6px;\"><button class=\"pk-sm\" onclick=\"packResume()\">이어서 하기<\/button><button class=\"gray pk-sm\" onclick=\"packDiscardRecover()\">버리기<\/button><\/div><\/div>`;\n  }\n  const pend = sessionFiles.length - (typeof downloadedFileCount === 'number' ? downloadedFileCount : 0);\n  if (pend > 0 || draftEntries.length) {\n    h += `<div class=\"pk-warn\">다운로드하지 않은 사진 <b>${Math.max(pend, 0)}장<\/b>${draftEntries.length ? ` · 임시저장 ${draftEntries.length}건(전체 저장 전)` : ''}\n      <div class=\"row\" style=\"gap:6px;margin-top:6px;\"><button class=\"pk-sm\" onclick=\"packReview()\">최종 확인 · ZIP<\/button><\/div><\/div>`;\n  }\n  return h;\n}\n\nfunction packChooserHtml() {\n  const card = (m, cls, desc) => {\n    const p = packPlans[m], pr = packProgress(p), fm = packFetchMsg[m];\n    let sub;\n    if (p) sub = `${pkEsc(p.date || '')} · 완료 ${pr.done}/${pr.total}${pr.part ? ' · 부분 ' + pr.part : ''}`;\n    else sub = fm ? '' : '자료를 아직 받지 않았습니다';\n    const err = fm && !fm.ok ? `<div class=\"pk-choose-e\">${pkEsc(fm.msg)}<\/div>` : '';\n    return `<div class=\"pk-choose ${cls}\" onclick=\"packEnter('${m}')\">\n      <div class=\"pk-choose-t\">${packModeLabel(m)}<\/div><div class=\"pk-choose-d\">${desc}<\/div>${sub ? `<div class=\"pk-choose-s\">${sub}<\/div>` : ''}${err}<\/div>`;\n  };\n  return packBannersHtml() +\n    card('out', 'out', '판매업체별 패킹 자료로 LOT와 수량 사진만 촬영') +\n    card('in', 'in', '입고 요청 자료로 LOT와 수량 사진만 촬영 (하나테크)') +\n    packFetchCardHtml() + packWorkerStorageHtml();\n}\n\nfunction packSettingsFormHtml() {\n  return `\n      <div class=\"pk-lbl\">웹앱 주소<\/div>\n      <input type=\"text\" id=\"pkSetUrl\" placeholder=\"https://script.google.com/macros/s/…/exec\" value=\"${pkEsc(packSavedUrl)}\">\n      <div class=\"pk-lbl\">비밀번호(키)<\/div>\n      <input type=\"text\" id=\"pkSetKey\" placeholder=\"시트 메뉴에서 만든 키\" value=\"${pkEsc(packSavedKey)}\" autocomplete=\"off\">\n      <div class=\"row\" style=\"gap:6px;\"><button onclick=\"packSaveSettings()\">저장<\/button>${packConfigured() ? '<button class=\"gray\" onclick=\"packClearSettings()\">저장값 지우기<\/button>' : ''}<\/div>`;\n}\nfunction packJsonLoadHtml() {\n  return `\n      <div class=\"pk-lbl\">또는 JSON으로 불러오기 (출고/입고는 자료 안의 구분을 따릅니다)<\/div>\n      <button class=\"secondary\" onclick=\"document.getElementById('packFileIn').click()\">JSON 파일 불러오기<\/button>\n      <textarea id=\"packPaste\" rows=\"4\" class=\"pk-ta\" placeholder=\"JSON 내용을 붙여넣으세요\"><\/textarea>\n      <button class=\"secondary\" onclick=\"packLoadPasted()\">붙여넣은 내용 적용<\/button>`;\n}\n// 웹앱 설정이 없을 때 처음 보이는 화면\nfunction packSetupHtml() {\n  return packBannersHtml() + `<div class=\"pk-card\">\n    <div class=\"pk-title\">웹앱 설정<\/div>\n    <div class=\"hint\" style=\"margin:0 0 4px;\">구글 시트에서 자료를 받아오는 주소와 비밀번호를 한 번만 저장하면 됩니다. 저장하면 접속을 확인한 뒤 다음 화면으로 넘어갑니다.<\/div>\n    ${packSettingsFormHtml()}\n    <div id=\"packStatus\" class=\"status\" style=\"margin-top:6px;\"><\/div>\n  <\/div>\n  <div style=\"text-align:center;\"><button class=\"gray pk-sm\" onclick=\"packNoSetup=true;packRender()\">설정 없이 JSON 파일/붙여넣기로 사용<\/button><\/div>`;\n}\nfunction packWorkerStorageHtml() {\n  return `<div class=\"pk-card\">\n    <div class=\"row\" style=\"gap:6px;align-items:center;\">\n      <span class=\"quick-label\">작업자<\/span>\n      <input type=\"text\" id=\"pkWorker\" value=\"${pkEsc(packWorker)}\" placeholder=\"내 이름 (공유 표시용)\" style=\"margin-bottom:0;\" onchange=\"packSetWorker(this.value)\">\n    <\/div>\n    <div class=\"hint pk-syncline\" style=\"margin:6px 0 0;\">${packSyncLine()}<\/div>\n    <div class=\"hint\" id=\"pkStorage\" style=\"margin:8px 0 6px;\">${packStorageHtml()}<\/div>\n    <div class=\"row\" style=\"gap:6px;\"><button class=\"secondary pk-sm\" style=\"flex:1;margin:0;\" onclick=\"packBackup()\">백업 파일 받기<\/button>\n      <button class=\"secondary pk-sm\" style=\"flex:1;margin:0;\" onclick=\"packRestore()\">백업 복구<\/button><\/div>\n  <\/div>`;\n}\nfunction packFetchCardHtml() {\n  return `\n  <div class=\"pk-card\">\n    <div class=\"row\" style=\"gap:6px;align-items:stretch;\">\n      <input type=\"date\" id=\"pkDate\" value=\"${pkEsc(packDates.out || packTodayStr())}\" onchange=\"packDateChanged(this)\" class=\"pk-date\">\n      <button id=\"pkFetchBtn\" style=\"margin-bottom:0;flex:1.2;\" onclick=\"packFetch()\">자료 받기<\/button>\n    <\/div>\n    <div id=\"packStatus\" class=\"status\" style=\"margin-top:6px;\"><\/div>\n  <\/div>\n  <div style=\"text-align:center;margin-bottom:8px;\"><button class=\"gray pk-sm\" onclick=\"packShowSettings=!packShowSettings;packRender()\">웹앱 설정${packShowSettings ? ' 닫기' : ''}<\/button><\/div>\n  ${packShowSettings ? `<div class=\"pk-card\">${packSettingsFormHtml()}${packJsonLoadHtml()}<\/div>` : ''}`;\n}\n\nfunction packSellerCardHtml() {\n  const list = (typeof companies !== 'undefined' && companies && companies.length) ? companies.slice() : [];\n  if (list.indexOf('하나테크') === -1) list.unshift('하나테크');\n  if (list.indexOf(packInSeller) === -1) list.unshift(packInSeller);\n  return `<div class=\"pk-card\">\n    <div class=\"pk-lbl\" style=\"margin-top:0;\">입고 업체<\/div>\n    <select id=\"pkSeller\" onchange=\"packSellerChange(this)\">\n      ${list.map(c => `<option value=\"${pkEsc(c)}\" ${c === packInSeller ? 'selected' : ''}>${pkEsc(c)}${c === '하나테크' ? ' (기본)' : ''}<\/option>`).join('')}\n      <option value=\"__custom\">직접 입력...<\/option>\n    <\/select>\n    <div class=\"row\" id=\"pkSellerCustomRow\" style=\"display:none;gap:6px;\">\n      <input type=\"text\" id=\"pkSellerCustom\" placeholder=\"업체명 입력\" style=\"margin-bottom:0;\">\n      <button class=\"secondary\" style=\"flex:0 0 70px;margin-bottom:0;\" onclick=\"packSellerCustomApply()\">적용<\/button>\n    <\/div>\n  <\/div>`;\n}\nasync function packSellerChange(el) {\n  if (el.value === '__custom') {\n    document.getElementById('pkSellerCustomRow').style.display = 'flex';\n    packFocus('pkSellerCustom');\n    return;\n  }\n  packInSeller = el.value;\n  await storeSet('packInSeller', packInSeller);\n  packRender();\n}\nasync function packSellerCustomApply() {\n  const v = (document.getElementById('pkSellerCustom').value || '').trim();\n  if (!v) return;\n  packInSeller = v;\n  await storeSet('packInSeller', packInSeller);\n  packRender();\n}\n\nfunction packListHtml() {\n  let h = packBannersHtml() + '<div id=\"packStatus\" class=\"status\"><\/div>';\n  if (!packPlan) {\n    const fm = packFetchMsg[packMode];\n    return h + `<div class=\"pk-card\" style=\"text-align:center;\"><div><b>${packMode === 'in' ? '입고' : '출고'} 자료가 없습니다<\/b><\/div><div class=\"hint\">${pkEsc(fm && !fm.ok ? fm.msg : '입출고 선택 화면에서 날짜를 고르고 [자료 받기]를 눌러주세요.')}<\/div><\/div>`;\n  }\n  const pr = packProgress(packPlan);\n  const pct = pr.total ? Math.round(pr.done * 100 / pr.total) : 0;\n  const today = packTodayStr();\n  const warn = packPlan.date && packPlan.date !== today\n    ? `<div class=\"pk-warn\">불러온 자료의 날짜(${pkEsc(packPlan.date)})가 오늘(${today})이 아닙니다.<\/div>` : '';\n  if (packMode === 'in') h += packSellerCardHtml();\n  h += `<div class=\"pk-card\">\n    <div class=\"pk-prog-t\"><b>${pkEsc(packPlan.date || '날짜 없음')}<\/b><span>완료 ${pr.done}/${pr.total}${pr.part ? ' · 부분 ' + pr.part : ''}<\/span><\/div>\n    <div class=\"pk-prog\"><div style=\"width:${pct}%\"><\/div><\/div>\n    ${warn}\n    <div class=\"chip-wrap\" style=\"margin:8px 0 0;\">\n      <div class=\"chip ${packFilter === 'all' ? 'selected' : ''}\" onclick=\"packSetFilter('all')\">전체<\/div>\n      <div class=\"chip ${packFilter === 'todo' ? 'selected' : ''}\" onclick=\"packSetFilter('todo')\">미완료·부분만<\/div>\n      <div class=\"chip\" onclick=\"packPull(true,true)\">새로고침<\/div>\n    <\/div>\n    <div class=\"hint\" style=\"margin:6px 0 0;\">${packSyncLine()}<\/div><\/div>`;\n  let any = false;\n  packPlan.groups.forEach((g, gi) => {\n    const sts = g.items.map(it => packItemState(it));\n    const cnt = sts.map(x => x.state === 'done' ? 1 : 0);\n    const allDone = cnt.every(n => n > 0);\n    if (packFilter === 'todo' && allDone) return;\n    any = true;\n    const ck = packMode + '|' + gi;\n    const collapsed = packCollapsed[ck] !== undefined ? packCollapsed[ck] : allDone;\n    const doneN = cnt.filter(n => n > 0).length;\n    h += `<div class=\"pk-card pk-group\">\n      <div class=\"pk-gh\" onclick=\"packToggleGroup('${ck}',${collapsed ? 'false' : 'true'})\">\n        <div class=\"pk-gh-main\"><b>${pkEsc(packSeller(g))}<\/b>${g.note ? ` <span class=\"pk-note\">${pkEsc(g.note)}<\/span>` : ''}${allDone ? ' <span class=\"pk-badge ok\">완료<\/span>' : ''}<\/div>\n        <div class=\"pk-gh-r\">${doneN}/${g.items.length} <span class=\"pk-arrow\">${collapsed ? '▾' : '▴'}<\/span><\/div>\n      <\/div>`;\n    if (!collapsed) {\n      if (g.shipTo) h += `<div class=\"hint\">출고처: ${pkEsc(g.shipTo)}<\/div>`;\n      h += `<div class=\"row\" style=\"gap:6px;align-items:center;margin-bottom:6px;\">\n        <span class=\"quick-label\">인보이스<\/span>\n        <input type=\"text\" value=\"${pkEsc(g.invoice)}\" placeholder=\"인보이스 번호\" style=\"margin-bottom:0;\" onchange=\"packSetInvoice(${gi},this.value)\"><\/div>`;\n      const rank = x => x.state === 'none' ? 0 : x.state === 'partial' ? 1 : 2;\n      const order = g.items.map((it, ii) => ({ it, ii, n: cnt[ii], st: sts[ii] })).sort((a, b) => rank(a.st) - rank(b.st) || a.ii - b.ii);\n      order.forEach(({ it, ii, n, st }) => {\n        if (packFilter === 'todo' && n > 0) return;\n        const plan = it.boxes ? `${it.boxes}박스` + (it.qty ? ` · ${it.qty.toLocaleString()}EA` : '') : (it.qty ? `${it.qty.toLocaleString()}EA` : '');\n        h += `<div class=\"pk-item ${st.state === 'done' ? 'done' : st.state === 'partial' ? 'partial' : ''}\" onclick=\"packOpenItem(${gi},${ii})\">\n          <div class=\"pk-item-main\"><div class=\"pk-item-name\">${pkEsc(it.name)}<\/div>\n          <div class=\"hint\" style=\"margin:0;\">${pkEsc(plan)}${it.photoOnly ? ' · 사진만' : ''}<\/div><\/div>\n          ${packStateBadge(it)}<\/div>`;\n      });\n    }\n    h += '<\/div>';\n  });\n  if (!any) h += '<div class=\"hint\" style=\"text-align:center;margin:14px 0;\">미완료 품목이 없습니다.<\/div>';\n  h += `<div class=\"pk-bar\">\n    <button class=\"green pk-sec2\" onclick=\"packFinish()\">촬영 완료 · 전체 저장<\/button>\n    <button class=\"secondary pk-sec2\" onclick=\"packReview()\">최종 확인 · ZIP<\/button><\/div>`;\n  return h;\n}\nfunction packSetFilter(f) { packFilter = f; packRender(); }\nfunction packToggleGroup(k, collapse) { packCollapsed[k] = collapse; packRender(); }\nasync function packSetInvoice(gi, v) {\n  packPlan.groups[gi].invoice = v.trim();\n  await storeSet(packMode === 'in' ? 'packPlanIn' : 'packPlan', packPlan);\n}\n\nasync function packFinish() {\n  await finishAllCapture();\n  const z = document.getElementById('zipStatus').textContent;\n  packRender();\n  packStatus(z);\n}\nasync function packZip() {\n  await downloadAllZip();\n  packStatus(document.getElementById('zipStatus').textContent);\n}\n\n// 다운로드 전 최종 확인표\nfunction packReview() {\n  const rows = [];\n  draftEntries.forEach(d => rows.push({ c: d.company, p: d.product, l: d.lot || '사진만', q: d.total, n: d.qtyFiles.length + (d.labelFile ? 1 : 0), t: '임시', m: d.mode }));\n  finalizedEntries.forEach(f => rows.push({ c: f.company, p: f.product, l: f.lot || '사진만', q: f.total, n: f.fileNames ? f.fileNames.length : 0, t: '저장', m: f.mode }));\n  const body = rows.length\n    ? `<div class=\"pk-tbl-wrap\"><table class=\"pk-tbl\"><tr><th>구분<\/th><th>업체<\/th><th>품목 / LOT<\/th><th>수량<\/th><th>사진<\/th><th><\/th><\/tr>` +\n      rows.map(r => `<tr><td>${r.m === 'in' ? '입고' : '출고'}<\/td><td>${pkEsc(r.c)}<\/td><td>${pkEsc(r.p)}<br><small>${pkEsc(r.l)}<\/small><\/td><td>${(r.q || 0).toLocaleString()}<\/td><td>${r.n}<\/td><td>${r.t === '임시' ? '<span class=\"pk-badge\">임시<\/span>' : '<span class=\"pk-badge ok\">저장<\/span>'}<\/td><\/tr>`).join('') +\n      '<\/table><\/div>' + `<div class=\"hint\">임시 ${draftEntries.length}건은 \"전체 저장\"을 해야 ZIP에 들어갑니다. 저장된 사진 ${sessionFiles.length}장.<\/div>`\n    : '<div class=\"hint\">아직 촬영한 내용이 없습니다.<\/div>';\n  let partN = 0;\n  ['out', 'in'].forEach(m => { const pl = packPlans[m]; if (pl) pl.groups.forEach(g => g.items.forEach(it => { if (packItemState(it).state === 'partial') partN++; })); });\n  const partHtml = partN ? `<div class=\"pk-warn\">아직 <b>부분 완료<\/b>인 품목이 ${partN}개 있습니다. 나머지를 찍은 뒤 ZIP을 받는 것이 좋습니다.<\/div>` : '';\n  const btns = [];\n  if (draftEntries.length) btns.push({ text: '전체 저장', cls: 'green', fn: () => packFinish() });\n  if (sessionFiles.length) btns.push({ text: 'ZIP 다운로드', cls: '', fn: () => packZip() });\n  btns.push({ text: '닫기', cls: 'gray', fn: null });\n  packModal('최종 확인', partHtml + body, btns);\n}\n\n// ---------- 촬영 중 자동 보관 (앱이 닫혀도 사진이 남도록) ----------\nconst packRecs = new Map();      // File/Blob -> { id, role, order }\nlet packChain = Promise.resolve();\nlet packTimer = null;\nfunction packDbPut(rec) {\n  return openShipPhotoDb().then(db => new Promise((res, rej) => {\n    const r = db.transaction('photos', 'readwrite').objectStore('photos').put(rec);\n    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);\n  }));\n}\nfunction packDbDel(id) {\n  return openShipPhotoDb().then(db => new Promise(res => {\n    const r = db.transaction('photos', 'readwrite').objectStore('photos').delete(id);\n    r.onsuccess = () => res(); r.onerror = () => res();\n  })).catch(() => {});\n}\nfunction packPersist() {\n  clearTimeout(packTimer);\n  packTimer = setTimeout(() => { packChain = packChain.then(packPersistNow).catch(() => {}); }, 400);\n}\nfunction packFlush() {\n  clearTimeout(packTimer);\n  packChain = packChain.then(packPersistNow).catch(() => {});\n  return packChain;\n}\nasync function packPersistNow() {\n  const w = packWork;\n  if (!w || !packDirty()) { await packWorkClear(); return; }\n  const g = packPlan.groups[w.gi], it = g.items[w.ii];\n  const want = [];\n  w.sets.forEach((s, si) => {\n    if (s.label) want.push({ f: s.label, role: 'L' + si, order: 0 });\n    s.qty.forEach((f, i) => want.push({ f, role: 'Q' + si, order: i }));\n  });\n  w.photos.forEach((f, i) => want.push({ f, role: 'P', order: i }));\n  const keep = new Set(want.map(x => x.f));\n  for (const [f, r] of Array.from(packRecs.entries())) {\n    if (!keep.has(f)) { await packDbDel(r.id); packRecs.delete(f); }\n  }\n  for (const x of want) {\n    const cur = packRecs.get(x.f);\n    if (cur && cur.role === x.role && cur.order === x.order) continue;\n    try {\n      const rec = { ownerId: 'packwork', role: x.role, order: x.order, blob: x.f, name: '' };\n      if (cur) rec.id = cur.id;\n      const id = await packDbPut(rec);\n      packRecs.set(x.f, { id, role: x.role, order: x.order });\n    } catch (e) { /* 보관 실패해도 작업은 계속 */ }\n  }\n  await storeSet('packWork', {\n    mode: packMode, key: it.key, gi: w.gi, ii: w.ii, kind: w.kind, perBox: w.perBox, pBoxes: w.pBoxes, name: w.name,\n    label: `${packSeller(g)} · ${w.kind === 'photo' ? (w.name || it.name) : it.name}`,\n    sets: w.sets.map(s => ({ lot: s.lot, parts: s.parts, boxes: s.boxes, status: s.status }))\n  });\n}\nasync function packWorkClear() {\n  clearTimeout(packTimer);\n  packRecs.clear();\n  await dbDeleteShipPhotosForOwner('packwork');\n  await storeSet('packWork', null);\n}\nasync function packLoadRecover() {\n  packRecover = null;\n  const meta = await storeGet('packWork', null);\n  if (!meta) return;\n  let photos = [];\n  try { photos = await dbGetShipPhotosForOwner('packwork'); } catch (e) { photos = []; }\n  if (!photos.length) { await storeSet('packWork', null); return; }\n  packRecover = { meta, photos };\n}\nasync function packResume() {\n  const rc = packRecover; if (!rc) return;\n  const m = rc.meta;\n  const plan = packPlans[m.mode];\n  const pos = packFindItem(m.key, plan);\n  if (!pos) { alert('이 품목이 현재 받은 자료에 없습니다. 같은 날짜 자료를 다시 받은 뒤 이어서 하세요.'); return; }\n  packMode = m.mode; packPlan = plan;\n  const it = plan.groups[pos.gi].items[pos.ii];\n  const byRole = {};\n  rc.photos.forEach(p => { (byRole[p.role] = byRole[p.role] || []).push(p); });\n  const files = role => (byRole[role] || []).sort((a, b) => a.order - b.order);\n  packRecs.clear();\n  const reg = p => { packRecs.set(p.blob, { id: p.id, role: p.role, order: p.order }); return p.blob; };\n  const sets = (m.sets || []).map((s, si) => ({\n    label: files('L' + si)[0] ? reg(files('L' + si)[0]) : null,\n    lot: s.lot || '', parts: s.parts || packInitParts(m.kind, it.name), boxes: s.boxes || '',\n    qty: files('Q' + si).map(reg), status: s.status || ''\n  }));\n  packWork = { gi: pos.gi, ii: pos.ii, kind: m.kind, sets: sets.length ? sets : [packNewSet(m.kind, it.name)],\n    photos: files('P').map(reg), pBoxes: m.pBoxes || '', perBox: m.perBox || '', name: m.name || it.name };\n  packRecover = null;\n  packView = 'item';\n  packApplyUi(); packRender(); packScrollTop();\n}\nasync function packDiscardRecover() {\n  if (!confirm('촬영 중이던 품목의 사진을 버릴까요? 되돌릴 수 없습니다.')) return;\n  await packWorkClear();\n  packRecover = null;\n  packRender();\n}\n\n// ---------- 품목 촬영 화면 ----------\nfunction packGuessKind(name) {\n  if (/V2B|0201-003797|^77\\b|0201-003450|락실/i.test(name)) return 'seal';\n  return 'sleeve';\n}\nfunction packInitParts(kind, name) {\n  if (kind === 'seal') {\n    const pre = /0201-003450|^77/i.test(name) ? '77' : 'V2B';\n    return { prefix: pre, digits: '', suffix: 'E' };\n  }\n  return { prefix: 'AP', d2: '', char: '1', d3: '', rem: '' };\n}\nfunction packNewSet(kind, name) {\n  return { label: null, lot: '', parts: packInitParts(kind, name), boxes: '', qty: [], status: '' };\n}\nasync function packOpenItem(gi, ii) {\n  if (packRecover) {\n    if (!confirm('촬영 중이던 다른 품목이 보관되어 있습니다. 새 품목을 시작하면 그 사진은 사라집니다. 계속할까요?')) return;\n    await packWorkClear(); packRecover = null;\n  } else if (packWork && packDirty()) {\n    await packFlush();\n  }\n  const g = packPlan.groups[gi], it = g.items[ii];\n  const kind = it.photoOnly ? 'photo' : packGuessKind(it.name);\n  const st0 = packItemState(it);\n  packWork = { gi, ii, kind, sets: [packNewSet(kind, it.name)], photos: [], pBoxes: (st0.state === 'partial' && st0.remBoxes) ? st0.remBoxes : (it.boxes || ''), perBox: it.perBox || '', name: it.name };\n  packView = 'item';\n  packRender();\n  packScrollTop();\n}\nasync function packBackList() {\n  if (packDirty()) await packFlush();           // 촬영 중이던 내용은 자동 보관됨 (목록에서 이어서 하기)\n  packWork = null; packView = 'list';\n  await packLoadRecover();\n  packRender(); packScrollTop();\n}\nfunction packSetKind(k) {\n  const w = packWork;\n  if (w.kind === k) return;\n  const it = packPlan.groups[w.gi].items[w.ii];\n  w.kind = k;\n  if (k !== 'photo') w.sets.forEach(s => { s.parts = packInitParts(k, it.name); s.lot = ''; });\n  packRender();\n}\n// 이번에 찍어야 할 박스 수 = 계획 박스 − (이미 저장된 박스: 내 것 + 다른 사람 것). 이미 달성했으면 계획 전체.\nfunction packPlanBoxes(it) {\n  const perBox = Number(packWork && packWork.perBox) || it.perBox || 0;\n  const base = packPlanBoxesBase(it, perBox);\n  if (!base) return 0;\n  const st = packItemState(it);\n  if (st.byBox || !perBox) { const rem = base - st.boxes; return rem > 0 ? rem : base; }\n  return st.remQty > 0 ? Math.ceil(st.remQty / perBox) : base;\n}\nfunction packRemQty(it) {\n  const st = packItemState(it);\n  if (!it.qty) return 0;\n  return st.remQty > 0 ? st.remQty : it.qty;\n}\n\nfunction packItemHtml() {\n  const w = packWork, g = packPlan.groups[w.gi], it = g.items[w.ii];\n  const n = packItemCount(it);\n  const st = packItemState(it);\n  const plan = (it.boxes ? it.boxes + '박스' : '') + (it.qty ? ` · ${it.qty.toLocaleString()}EA` : '');\n  const savedLine = (st.mine.n || st.oth.length)\n    ? `<div class=\"pk-warn\">저장됨 ${st.qty.toLocaleString()}EA · ${st.boxes}박스${st.state === 'done' ? ' (계획 달성)' : ` → <b>남은 ${st.byBox ? st.remBoxes + '박스' : st.remQty.toLocaleString() + 'EA'}<\/b>`}\n       ${st.oth.map(r => `<br>· ${pkEsc(r.worker)}: ${(Number(r.qty) || 0).toLocaleString()}EA ${pkEsc((r.lots || []).join(', '))}`).join('')}<\/div>` : '';\n  const chips = [['sleeve', '락슬리브 LOT'], ['seal', '락실 LOT'], ['photo', '사진만']]\n    .map(([k, t]) => `<div class=\"chip ${w.kind === k ? 'selected' : ''}\" onclick=\"packSetKind('${k}')\">${t}<\/div>`).join('');\n  let h = `\n  <div class=\"pk-card pk-itemcard\">\n    <div class=\"pk-title\">${pkEsc(packSeller(g))}${g.note ? ` <span class=\"pk-note\">${pkEsc(g.note)}<\/span>` : ''}<\/div>\n    <div class=\"pk-item-name\" style=\"font-size:1.15em;\">${pkEsc(it.name)}<\/div>\n    <div class=\"hint\">계획 ${pkEsc(plan || '-')} ${g.invoice ? '· ' + pkEsc(g.invoice) : ''}<\/div>\n    ${savedLine}\n    ${n ? `<div class=\"pk-warn\">내 기록 ${n}건이 있습니다. 이어서 저장하면 추가됩니다.\n       <button class=\"gray pk-sm\" style=\"margin-top:6px;\" onclick=\"packRedoExisting()\">내 기록 삭제 후 다시 하기<\/button><\/div>` : ''}\n    <div class=\"row\" style=\"gap:6px;align-items:center;\">\n      <span class=\"quick-label\">박스당 수량<\/span>\n      <input type=\"number\" inputmode=\"numeric\" id=\"pkPerBox\" value=\"${pkEsc(w.perBox)}\" style=\"margin-bottom:0;\" oninput=\"packWork.perBox=this.value;packRefreshBoxes();packRenderBar();packPersist()\">\n    <\/div>\n    <div class=\"chip-wrap\" style=\"margin-top:8px;\">${chips}<\/div>\n  <\/div>`;\n  if (w.kind === 'photo') {\n    h += `<div class=\"pk-set photo\" id=\"pkphoto\">${packPhotoHtml()}<\/div>`;\n  } else {\n    h += '<div id=\"pkSets\">';\n    w.sets.forEach((s, si) => { h += `<div class=\"pk-set ${w.kind}\" id=\"pkset${si}\">${packSetHtml(si)}<\/div>`; });\n    h += '<\/div>';\n    if (w.sets.length < PACK_MAX_SETS) h += `<button class=\"secondary\" onclick=\"packAddSet()\">+ LOT 추가 (${w.sets.length}/${PACK_MAX_SETS})<\/button>`;\n  }\n  h += `<div class=\"pk-sum\" id=\"pkSum\"><\/div><div id=\"pkSaveRes\" class=\"status\"><\/div><div class=\"pk-bar\" id=\"pkBar\"><\/div>`;\n  return h;\n}\n\nasync function packRedoExisting() {\n  const w = packWork, it = packPlan.groups[w.gi].items[w.ii];\n  if (!confirm('이 품목의 저장된 촬영(임시저장/다운로드 대기 포함)을 모두 삭제할까요?')) return;\n  await packRemoveItemEntries(it.key);\n  packRender();\n}\n\nfunction packThumbsHtml(files, delFn) {\n  if (!files.length) return '';\n  return '<div class=\"qty-thumbs\">' + files.map((f, i) =>\n    `<div class=\"qty-thumb-wrap\"><img src=\"${packUrl(f)}\"><div class=\"del\" onclick=\"${delFn}(${i})\">×<\/div><\/div>`).join('') + '<\/div>';\n}\n\nfunction packPhotoHtml() {\n  const w = packWork, it = packPlan.groups[w.gi].items[w.ii];\n  return `<div class=\"pk-set-h\"><b>사진만 촬영<\/b><\/div>\n    <div class=\"hint\">식별표/LOT 인식 없이 품명, 박스 수와 사진만 저장합니다.<\/div>\n    <div class=\"row\" style=\"gap:6px;align-items:center;\">\n      <span class=\"quick-label\">품명<\/span>\n      <input type=\"text\" id=\"pkName\" value=\"${pkEsc(w.name)}\" placeholder=\"품명 입력\" style=\"margin-bottom:8px;\" oninput=\"packWork.name=this.value;packRenderBar();packPersist()\">\n    <\/div>\n    <div class=\"row\" style=\"gap:6px;align-items:center;\">\n      <span class=\"quick-label\">박스 수<\/span>\n      <input type=\"number\" inputmode=\"numeric\" id=\"pkPBoxes\" value=\"${pkEsc(w.pBoxes)}\" placeholder=\"${it.boxes || ''}\" style=\"margin-bottom:0;\" oninput=\"packWork.pBoxes=this.value;packRefreshBoxes();packRenderBar();packPersist()\">\n    <\/div>\n    <div class=\"pk-lbl\">사진 (${w.photos.length}/10)<\/div>\n    <div class=\"row\" style=\"gap:6px;\">\n      <button class=\"capture-btn\" onclick=\"packPickQty(-1,'camera')\">촬영<\/button>\n      <button class=\"capture-btn\" onclick=\"packPickQty(-1,'gallery')\">앨범<\/button>\n    <\/div>\n    ${packThumbsHtml(w.photos, 'packDelPhoto')}`;\n}\n\nfunction packSegSelect(si, field, presets, cur, custom, width) {\n  if (custom) {\n    return `<input type=\"text\" class=\"pk-in\" id=\"pk${si}_${field}\" value=\"${pkEsc(cur)}\" style=\"width:${width}px;\" oninput=\"packSegInput(${si},'${field}',this)\" onkeydown=\"packEnter2(event,${si},'${field}')\">`;\n  }\n  return `<select class=\"pk-in\" id=\"pk${si}_${field}\" style=\"width:${width}px;\" onchange=\"packSegSel(${si},'${field}',this)\">` +\n    presets.map(p => `<option value=\"${p}\" ${p === cur ? 'selected' : ''}>${p}<\/option>`).join('') +\n    `<option value=\"__custom\">직접입력<\/option><\/select>`;\n}\n\nfunction packSetHtml(si) {\n  const w = packWork, s = w.sets[si], p = s.parts, kind = w.kind;\n  const grp = kind === 'seal' ? 'seal-group' : 'sleeve-group';\n  let lotRow;\n  if (kind === 'seal') {\n    lotRow = packSegSelect(si, 'prefix', ['V2B', '77'], p.prefix, p.prefixCustom, 70) +\n      `<input type=\"text\" class=\"pk-in\" id=\"pk${si}_digits\" inputmode=\"numeric\" value=\"${pkEsc(p.digits)}\" placeholder=\"숫자\" style=\"flex:1;min-width:0;\" oninput=\"packSegInput(${si},'digits',this)\" onkeydown=\"packEnter2(event,${si},'digits')\">` +\n      packSegSelect(si, 'suffix', ['E', 'K'], p.suffix, p.suffixCustom, 66);\n  } else {\n    lotRow = packSegSelect(si, 'prefix', ['AP', 'P'], p.prefix, p.prefixCustom, 62) +\n      `<input type=\"text\" class=\"pk-in\" id=\"pk${si}_d2\" inputmode=\"numeric\" maxlength=\"2\" value=\"${pkEsc(p.d2)}\" placeholder=\"00\" style=\"width:44px;\" oninput=\"packSegInput(${si},'d2',this)\" onkeydown=\"packEnter2(event,${si},'d2')\">` +\n      packSegSelect(si, 'char', ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'A', 'B', 'C'], p.char, p.charCustom, 56) +\n      `<input type=\"text\" class=\"pk-in\" id=\"pk${si}_d3\" inputmode=\"numeric\" maxlength=\"2\" value=\"${pkEsc(p.d3)}\" placeholder=\"00\" style=\"width:44px;\" oninput=\"packSegInput(${si},'d3',this)\" onkeydown=\"packEnter2(event,${si},'d3')\">` +\n      `<span class=\"pk-dash\">-<\/span>` +\n      `<input type=\"text\" class=\"pk-in\" id=\"pk${si}_rem\" inputmode=\"numeric\" value=\"${pkEsc(p.rem)}\" placeholder=\"번호\" style=\"flex:1;min-width:0;\" oninput=\"packSegInput(${si},'rem',this)\" onkeydown=\"packEnter2(event,${si},'rem')\">`;\n  }\n  return `\n  <div class=\"pk-set-h\"><b>LOT ${si + 1}<\/b>${w.sets.length > 1 ? `<button class=\"pk-x\" onclick=\"packRemoveSet(${si})\">삭제<\/button>` : ''}<\/div>\n  <div class=\"pk-lbl\">식별표<\/div>\n  <div class=\"row\" style=\"gap:6px;\">\n    <button class=\"capture-btn ${grp}\" onclick=\"packPickLabel(${si},'camera')\">촬영<\/button>\n    <button class=\"capture-btn ${grp}\" onclick=\"packPickLabel(${si},'gallery')\">앨범<\/button>\n  <\/div>\n  ${s.label ? `<div class=\"thumb-wrap\"><img class=\"thumb\" src=\"${packUrl(s.label)}\" style=\"max-height:150px;\"><div class=\"rot\" onclick=\"packRotate(${si})\">⟳<\/div><\/div>` : ''}\n  <div class=\"status\" id=\"pkocr${si}\">${pkEsc(s.status)}<\/div>\n  <div class=\"pk-lotrow\"><span class=\"quick-label\">LOT번호<\/span>${lotRow}<\/div>\n  <div class=\"hint\" id=\"pkprev${si}\">${s.lot ? 'LOT: ' + pkEsc(s.lot) : 'LOT를 모두 채워주세요'}<\/div>\n  <div class=\"pk-lbl\">수량 사진 (${s.qty.length}/10)<\/div>\n  <div class=\"row\" style=\"gap:6px;\">\n    <button class=\"capture-btn\" onclick=\"packPickQty(${si},'camera')\">촬영<\/button>\n    <button class=\"capture-btn\" onclick=\"packPickQty(${si},'gallery')\">앨범<\/button>\n  <\/div>\n  ${packThumbsHtml(s.qty, 'packDelQty' + si + '_')}\n  <div class=\"row\" style=\"gap:6px;align-items:center;margin-top:6px;\">\n    <span class=\"quick-label\">박스 수<\/span>\n    <input type=\"number\" inputmode=\"numeric\" id=\"pkbox${si}\" value=\"${pkEsc(s.boxes)}\" style=\"margin-bottom:0;\" oninput=\"packBoxInput(${si},this)\">\n    <span class=\"pk-tot\" id=\"pkTot${si}\"><\/span>\n  <\/div>`;\n}\n\nfunction packRenderSet(si, focusId) {\n  const el = document.getElementById('pkset' + si);\n  if (!el) return;\n  el.innerHTML = packSetHtml(si);\n  packRefreshBoxes(); packRenderBar();\n  if (focusId) packFocus(focusId);\n}\n\nfunction packDelPhoto(i) { packWork.photos.splice(i, 1); document.getElementById('pkphoto').innerHTML = packPhotoHtml(); packRenderBar(); packPersist(); }\nfor (let _i = 0; _i < PACK_MAX_SETS; _i++) {\n  window['packDelQty' + _i + '_'] = function (i) { packWork.sets[_i].qty.splice(i, 1); packRenderSet(_i); packPersist(); };\n}\n\n// ---------- LOT 빠른 입력 ----------\nconst PK_ORDER = { sleeve: ['prefix', 'd2', 'char', 'd3', 'rem'], seal: ['prefix', 'digits', 'suffix'] };\nfunction packBuildLot(kind, p) {\n  if (kind === 'seal') return (p.prefix && p.digits && p.suffix) ? `${p.prefix}-${p.digits}-${p.suffix}` : '';\n  return (p.prefix && p.d2 && p.d2.length === 2 && p.char && p.d3 && p.d3.length === 2 && p.rem)\n    ? `${p.prefix}${p.d2}${p.char}${p.d3}-${p.rem}` : '';\n}\nfunction packAfterParts(si) {\n  const w = packWork, s = w.sets[si];\n  s.lot = packBuildLot(w.kind, s.parts);\n  const el = document.getElementById('pkprev' + si);\n  if (el) el.textContent = s.lot ? 'LOT: ' + s.lot : 'LOT를 모두 채워주세요';\n  packRenderBar(); packPersist();\n}\nfunction packNextField(si, field) {\n  const order = PK_ORDER[packWork.kind === 'seal' ? 'seal' : 'sleeve'];\n  const i = order.indexOf(field);\n  if (i === -1) return;\n  if (i < order.length - 1) packFocus('pk' + si + '_' + order[i + 1]);\n  else packFocus('pkbox' + si);\n}\nfunction packFocusLot(si) {\n  const w = packWork, order = PK_ORDER[w.kind === 'seal' ? 'seal' : 'sleeve'], p = w.sets[si].parts;\n  const f = order.find(k => !p[k]) || order[order.length - 1];\n  packFocus('pk' + si + '_' + f);\n}\nfunction packSegSel(si, field, el) {\n  const p = packWork.sets[si].parts;\n  if (el.value === '__custom') {\n    p[field + 'Custom'] = true; p[field] = '';\n    packAfterParts(si);\n    packRenderSet(si, 'pk' + si + '_' + field);\n  } else {\n    p[field] = el.value;\n    packAfterParts(si);\n    packNextField(si, field);\n  }\n}\nfunction packSegInput(si, field, el) {\n  const p = packWork.sets[si].parts;\n  let v = el.value;\n  if (field === 'd2' || field === 'd3') { v = v.replace(/\\D/g, '').slice(0, 2); el.value = v; }\n  else if (field === 'digits' || field === 'rem') { v = v.replace(/[^0-9A-Za-z-]/g, ''); el.value = v; }\n  else { v = v.toUpperCase(); el.value = v; }\n  p[field] = v;\n  packAfterParts(si);\n  if ((field === 'd2' || field === 'd3') && v.length === 2) packNextField(si, field);\n}\nfunction packEnter2(ev, si, field) {\n  if (ev.key === 'Enter') { ev.preventDefault(); packNextField(si, field); }\n}\n\n// ---------- LOT 칸 추가/삭제, 박스 수 ----------\nfunction packAddSet() {\n  const w = packWork, it = packPlan.groups[w.gi].items[w.ii];\n  if (w.sets.length >= PACK_MAX_SETS) return;\n  w.sets.push(packNewSet(w.kind, it.name));\n  packRender();\n  packPersist();\n  setTimeout(() => { const e = document.getElementById('pkset' + (w.sets.length - 1)); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60);\n}\nfunction packRemoveSet(si) {\n  const s = packWork.sets[si];\n  if ((s.label || s.qty.length) && !confirm(`LOT ${si + 1} 칸의 사진이 사라집니다. 삭제할까요?`)) return;\n  packWork.sets.splice(si, 1);\n  packRender(); packPersist();\n}\nfunction packBoxInput(si, el) {\n  packWork.sets[si].boxes = el.value;\n  packRefreshBoxes(); packRenderBar(); packPersist();\n}\n// 마지막 LOT의 박스 수를 비워두면 계획 박스 수에서 앞 LOT들을 뺀 나머지로 자동 계산한다.\nfunction packSetBoxes(si) {\n  const w = packWork, it = packPlan.groups[w.gi].items[w.ii], s = w.sets[si];\n  if (s.boxes !== '') return Number(s.boxes) || 0;\n  const pb = packPlanBoxes(it);\n  if (si === w.sets.length - 1 && pb) {\n    const others = w.sets.slice(0, si).reduce((a, x) => a + (Number(x.boxes) || 0), 0);\n    return Math.max(0, pb - others);\n  }\n  return 0;\n}\nfunction packRefreshBoxes() {\n  const w = packWork; if (!w) return;\n  const it = packPlan.groups[w.gi].items[w.ii];\n  const perBox = Number(w.perBox) || 0;\n  const pb = packPlanBoxes(it);\n  const sum = document.getElementById('pkSum');\n  if (w.kind === 'photo') {\n    const b = Number(w.pBoxes) || 0;\n    if (sum) sum.innerHTML = pb && b && b !== pb ? `<div class=\"pk-warn\" style=\"margin:0;\">${packItemState(it).state === 'partial' ? '남은' : '계획'} ${pb}박스와 다릅니다 (그래도 저장할 수 있어요).<\/div>` : '';\n    return;\n  }\n  let used = 0;\n  w.sets.forEach((s, si) => {\n    const b = packSetBoxes(si);\n    used += b;\n    const inp = document.getElementById('pkbox' + si);\n    if (inp) inp.placeholder = (s.boxes === '' && b) ? String(b) : '';\n    const tot = document.getElementById('pkTot' + si);\n    if (tot) tot.textContent = (b && perBox) ? `= ${(b * perBox).toLocaleString()}EA` : '';\n  });\n  if (!sum) return;\n  const usedQty = used * perBox;\n  const rq = packRemQty(it);\n  const diff = packMode === 'in' && rq && perBox ? usedQty !== rq : (pb && used !== pb);\n  const stx = packItemState(it), partial = stx.state === 'partial';\n  sum.innerHTML = `박스 합계 <b>${used}<\/b>${pb ? (partial ? ' / 남은 ' : ' / 계획 ') + pb : ''}` +\n    (perBox ? ` · 수량 <b>${usedQty.toLocaleString()}<\/b>EA${rq ? (partial ? ' / 남은 ' : ' / 계획 ') + rq.toLocaleString() : ''}` : '') +\n    (diff ? '<div class=\"pk-warn\" style=\"margin:6px 0 0;\">계획과 다릅니다. 그래도 저장은 할 수 있어요.<\/div>' : '');\n}\n\n// ---------- 다음 단계 안내 (하단 큰 버튼) ----------\nfunction packStep() {\n  const w = packWork; if (!w) return null;\n  const it = packPlan.groups[w.gi].items[w.ii];\n  if (w.kind === 'photo') {\n    if (!w.name || w.name === '품목정보없음') return { t: '품명 입력', f: \"packFocus('pkName')\" };\n    if (!w.photos.length) return { t: '사진 촬영', f: \"packPickQty(-1,'camera')\" };\n    if (!(Number(w.pBoxes) > 0)) return { t: '박스 수 입력', f: \"packFocus('pkPBoxes')\" };\n    return { t: '이 품목 저장', f: 'packSaveItem()', save: true };\n  }\n  for (let si = 0; si < w.sets.length; si++) {\n    const s = w.sets[si];\n    if (!s.label) return { t: `LOT ${si + 1} 식별표 촬영`, f: `packPickLabel(${si},'camera')`, si };\n    if (!s.lot) return { t: 'LOT 번호 입력', f: `packFocusLot(${si})`, si };\n    if (!s.qty.length) return { t: '수량 사진 촬영', f: `packPickQty(${si},'camera')`, si };\n    if (!packSetBoxes(si)) return { t: '박스 수 입력', f: `packFocus('pkbox${si}')`, si };\n  }\n  let used = 0;\n  w.sets.forEach((s, si) => { used += packSetBoxes(si); });\n  const pb = packPlanBoxes(it);\n  if (pb && used < pb && w.sets.length < PACK_MAX_SETS) return { t: '다음 LOT 추가', f: 'packAddSet()', add: true };\n  return { t: '이 품목 저장', f: 'packSaveItem()', save: true };\n}\nfunction packRenderBar() {\n  const bar = document.getElementById('pkBar');\n  if (!bar) return;\n  const st = packStep(); if (!st) return;\n  bar.innerHTML = `<button class=\"pk-primary\" onclick=\"${st.f}\">${pkEsc(st.t)}<\/button>` +\n    (st.save ? '' : '<button class=\"gray pk-sec2\" onclick=\"packSaveItem()\">저장<\/button>');\n}\nfunction packScrollActive() {\n  const st = packStep();\n  const id = packWork && packWork.kind === 'photo' ? 'pkphoto' : (st && st.si != null ? 'pkset' + st.si : null);\n  const el = id && document.getElementById(id);\n  if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);\n}\n\n// ---------- 사진 촬영 / 인식 ----------\nfunction packPickLabel(si, src) {\n  packTarget = si;\n  document.getElementById(src === 'camera' ? 'packLabelCam' : 'packLabelGal').click();\n}\nasync function packOnLabel(ev) {\n  const f = ev.target.files && ev.target.files[0];\n  ev.target.value = '';\n  if (!f || !packWork) return;\n  const si = packTarget;\n  const s = packWork.sets[si]; if (!s) return;\n  s.label = f;\n  s.status = '이미지 보정 및 인식 중입니다...';\n  packRenderSet(si);\n  packPersist();\n  await packRunOcr(si);\n}\nasync function packRotate(si) {\n  const s = packWork && packWork.sets[si]; if (!s || !s.label) return;\n  s.label = await rotateFile(s.label, 90);\n  s.status = '이미지 보정 및 인식 중입니다...';\n  packRenderSet(si);\n  packPersist();\n  await packRunOcr(si);\n}\nfunction packNorm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }\n\nasync function packRecognize(file, kind) {\n  const isSeal = kind === 'seal';\n  const isOk = r => isSeal ? r.foundKeyLine : r.lotFormatOk;\n  let result = null;\n  const nt = await nativeDetectText(file, 1600);\n  if (nt) result = interpretText(nt);\n  if (!result || !isOk(result)) {\n    const worker = isSeal ? await getSealWorker() : await getWorker();\n    let url = await preprocessImage(file, 1000);\n    let r = interpretText((await worker.recognize(url)).data.text);\n    if (!isOk(r)) {\n      url = await preprocessImage(file, 1700);\n      const r2 = interpretText((await worker.recognize(url)).data.text);\n      if (isOk(r2) || !result) r = r2;\n    }\n    if (isOk(r) || !result) result = r;\n  }\n  return result;\n}\n\nasync function packRunOcr(si) {\n  const w = packWork; if (!w) return;\n  const s = w.sets[si]; if (!s || !s.label) return;\n  const file = s.label;\n  const kind = w.kind;\n  try {\n    const it = packPlan.groups[w.gi].items[w.ii];\n    const r = await packRecognize(file, kind);\n    if (!packWork || packWork.sets[si] !== s || s.label !== file) return;\n    if (kind === 'seal') {\n      if (r.foundKeyLine) {\n        const type = r.product === '0201-003797' ? 'V2B' : '77';\n        const parts = splitLot(r.lot, type);\n        s.parts = { prefix: type, digits: parts.digits, suffix: parts.suffix || 'E' };\n        s.status = '인식 완료. 숫자와 E/K를 확인해주세요.';\n      } else {\n        s.status = '자동 인식 실패 - 아래에서 직접 입력해주세요. 사진이 옆으로 찍혔다면 ⟳를 눌러보세요.';\n      }\n    } else {\n      const lp = splitLotSleeve(r.lot);\n      if (lp) {\n        s.parts = { prefix: lp.prefix, d2: lp.d2, char: lp.char, d3: lp.d3, rem: lp.remainder };\n        s.status = '인식 완료. LOT를 확인해주세요.';\n        const plan = packNorm(it.name).replace(/^ALS/, '');\n        const cands = (r.candidates || []).map(c => packNorm(c).replace(/^ALS/, '')).filter(Boolean);\n        if (cands.length && plan && !cands.some(c => plan.includes(c) || c.includes(plan))) {\n          s.status += ` 식별표 품명(${r.candidates[0]})이 계획 품목과 다를 수 있어요.`;\n        }\n      } else {\n        s.status = '자동 인식 실패 - 아래에서 직접 입력해주세요. 사진이 옆으로 찍혔다면 ⟳를 눌러보세요.';\n      }\n    }\n    s.lot = packBuildLot(kind, s.parts);\n    packRenderSet(si, s.lot ? null : (kind === 'seal' ? 'pk' + si + '_digits' : 'pk' + si + '_d2'));\n    packPersist();\n  } catch (e) {\n    console.error(e);\n    s.status = '인식 오류 - 직접 입력해주세요.';\n    packRenderSet(si);\n  }\n}\n\nfunction packPickQty(si, src) {\n  packTarget = si;\n  document.getElementById(src === 'camera' ? 'packQtyCam' : 'packQtyGal').click();\n}\nfunction packOnQty(ev) {\n  const files = Array.from(ev.target.files || []);\n  ev.target.value = '';\n  if (!files.length || !packWork) return;\n  const si = packTarget;\n  const list = si === -1 ? packWork.photos : (packWork.sets[si] && packWork.sets[si].qty);\n  if (!list) return;\n  for (const f of files) { if (list.length >= 10) break; list.push(f); }\n  if (si === -1) { document.getElementById('pkphoto').innerHTML = packPhotoHtml(); packRenderBar(); }\n  else packRenderSet(si);\n  packPersist();\n  const st = packStep();\n  if (st && st.f && /packFocus/.test(st.f)) { const m = st.f.match(/'([^']+)'/); if (m) packFocus(m[1]); }\n}\n\n// ---------- 저장 (임시저장 목록으로) ----------\nfunction packValidate() {\n  const w = packWork;\n  const g = packPlan.groups[w.gi], it = g.items[w.ii];\n  const perBox = Number(w.perBox) || 0;\n  const base = {\n    company: pkFile(packSeller(g)), product: pkFile(w.kind === 'photo' ? (w.name || it.name) : it.name), mode: packMode === 'in' ? 'in' : 'out',\n    invoiceNumber: g.invoice || '', packing: true, planKey: it.key, invoiceFiles: []\n  };\n  const mk = () => 'd' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);\n  const made = [];\n  if (w.kind === 'photo') {\n    const boxes = Number(w.pBoxes) || 0;\n    if (!base.product || base.product === '품목정보없음') return { err: '품명을 입력해주세요.' };\n    if (!(boxes > 0)) return { err: '박스 수를 입력해주세요.' };\n    if (!w.photos.length) return { err: '사진을 1장 이상 촬영해주세요.' };\n    const total = perBox ? boxes * perBox : (boxes === it.boxes ? it.qty : 0);\n    made.push(Object.assign({}, base, {\n      draftId: mk(), lot: '', perBox: perBox || (total && boxes ? Math.round(total / boxes) : 0), boxCount: boxes, total: total || 0,\n      recogType: 'photo', photoOnly: true, labelFile: null, qtyFiles: w.photos.slice()\n    }));\n    return { made, it };\n  }\n  if (!(perBox > 0)) return { err: '박스당 수량을 입력해주세요.' };\n  const seen = {};\n  for (let si = 0; si < w.sets.length; si++) {\n    const s = w.sets[si], tag = `LOT ${si + 1}: `;\n    if (!s.label) return { err: tag + '식별표 사진을 촬영해주세요.' };\n    if (!s.lot) return { err: tag + 'LOT번호를 모두 채워주세요.' };\n    if (seen[s.lot]) return { err: tag + '같은 LOT번호가 중복되었습니다.' };\n    seen[s.lot] = 1;\n    const boxes = packSetBoxes(si);\n    if (!(boxes > 0)) return { err: tag + '박스 수를 입력해주세요.' };\n    if (!s.qty.length) return { err: tag + '수량 사진을 1장 이상 촬영해주세요.' };\n    made.push(Object.assign({}, base, {\n      draftId: mk() + si, lot: s.lot, perBox, boxCount: boxes, total: boxes * perBox,\n      recogType: w.kind === 'seal' ? 'seal' : 'sleeve', photoOnly: false, labelFile: s.label, qtyFiles: s.qty.slice()\n    }));\n  }\n  return { made, it };\n}\n\nfunction packSaveItem() {\n  const w = packWork; if (!w) return;\n  if (!packWorker) {\n    const nm = (prompt('작업자 이름을 입력하세요 (다른 사람 화면에 표시됩니다)') || '').trim();\n    if (!nm) { alert('작업자 이름이 없으면 저장할 수 없습니다.'); return; }\n    packWorker = nm; storeSet('packWorker', nm);\n  }\n  const resEl = document.getElementById('pkSaveRes');\n  const v = packValidate();\n  if (v.err) { resEl.innerHTML = '<div class=\"error\">' + pkEsc(v.err) + '<\/div>'; return; }\n  resEl.innerHTML = '';\n  const { made, it } = v;\n  // 같은 LOT를 다른 품목에서 이미 썼으면 알려줌\n  const dup = [];\n  made.forEach(d => {\n    if (!d.lot) return;\n    const hit = draftEntries.concat(logEntries).find(x => x.lot === d.lot && x.planKey !== d.planKey);\n    if (hit) dup.push(`${d.lot} → 이미 ${hit.company} / ${hit.product}에서 사용`);\n  });\n  const already = packItemCount(it);\n  let tot = 0, totBox = 0;\n  const lines = made.map(d => { tot += d.total; totBox += d.boxCount; return `<tr><td>${pkEsc(d.lot || '사진만')}<\/td><td>${d.boxCount}박스<\/td><td>${(d.total || 0).toLocaleString()}EA<\/td><td>사진 ${d.qtyFiles.length + (d.labelFile ? 1 : 0)}<\/td><\/tr>`; }).join('');\n  const pb = packPlanBoxes(it);\n  const html = `<div class=\"hint\" style=\"margin:0 0 6px;\">${pkEsc(made[0].company)} · ${pkEsc(made[0].product)}<\/div>\n    <table class=\"pk-tbl\"><tr><th>LOT<\/th><th>박스<\/th><th>수량<\/th><th>사진<\/th><\/tr>${lines}\n    <tr><td><b>합계<\/b><\/td><td><b>${totBox}박스<\/b><\/td><td><b>${tot.toLocaleString()}EA<\/b><\/td><td><\/td><\/tr><\/table>\n    ${pb && totBox !== pb ? `<div class=\"pk-warn\">${packItemState(it).state === 'partial' ? '남은' : '계획'} ${pb}박스와 다릅니다.<\/div>` : ''}\n    ${(() => { const s0 = packItemState(it); const afterQ = s0.qty + tot, afterB = s0.boxes + totBox; const ok = s0.byBox ? (s0.planBoxes && afterB < s0.planBoxes) : (s0.planQty && afterQ < s0.planQty); return ok ? `<div class=\"pk-warn\">저장 후에도 <b>부분 완료<\/b>입니다 (${s0.byBox ? afterB + '/' + s0.planBoxes + '박스' : afterQ.toLocaleString() + '/' + s0.planQty.toLocaleString() + 'EA'}). 나중에 이어서 찍을 수 있습니다.<\/div>` : ''; })()}\n    ${dup.length ? `<div class=\"pk-warn\">${dup.map(pkEsc).join('<br>')}<\/div>` : ''}\n    ${already ? `<div class=\"pk-warn\">내 기록 ${already}건에 이어서 저장합니다.<\/div>` : ''}`;\n  packPending = made;\n  packModal('이대로 저장할까요?', html, [\n    { text: '저장', cls: 'green', fn: () => packCommit(made, it) },\n    { text: '더 고치기', cls: 'gray', fn: null }\n  ]);\n}\n\nasync function packCommit(made, it) {\n  made.forEach(d => {\n    draftEntries.push(d);\n    persistPhotosForOwner(d.draftId, d.labelFile, d.qtyFiles, d.invoiceFiles);\n  });\n  persistDraftsMeta();\n  renderDraftList();\n  updatePendingBadge();\n  packWork = null; packView = 'list'; packPending = null;\n  await packWorkClear();\n  packSyncPush(it);\n  packRender();\n  packStatus(`${it.name} ${made.length}건 임시저장 완료`);\n  packScrollTop();\n  setTimeout(() => { const n = document.querySelector('#packBody .pk-item:not(.done)'); if (n) n.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);\n}\n\n\n// =====================================================================\n//  여러 명 상태 공유 (구글 시트 웹앱 경유) — 사진은 공유하지 않고 상태·LOT·수량만 공유\n// =====================================================================\nfunction packSyncReady() { return packConfigured(); }\nfunction packApiUrl(extra) {\n  return packSavedUrl + (packSavedUrl.indexOf('?') === -1 ? '?' : '&') + 'key=' + encodeURIComponent(packSavedKey) + extra;\n}\nfunction packPayload(it, plan, mode) {\n  const m = packMine(it);\n  const g = plan.groups.find(gr => gr.items.indexOf(it) !== -1) || plan.groups[0];\n  const st = packItemState(it);\n  return {\n    mode, date: packYmd(plan.date) || '', key: it.key, worker: packWorker || '미입력',\n    seller: g ? (mode === 'in' ? (packInSeller || g.seller) : g.seller) : '', name: it.name,\n    boxes: m.boxes, qty: m.qty, lots: m.lots, planQty: it.qty || 0, planBoxes: packPlanBoxesBase(it, 0),\n    status: st.state === 'done' ? '완료' : (m.n ? '부분' : ''), t: new Date().toISOString()\n  };\n}\nfunction packSyncPush(it) {\n  if (!packSyncReady() || !it) return;\n  const mode = packKeyMode(it.key), plan = packPlans[mode];\n  if (!plan) return;\n  packQueue(packPayload(it, plan, mode));\n}\nfunction packSyncPushKey(key) {\n  const mode = packKeyMode(key), plan = packPlans[mode];\n  if (!plan) return;\n  for (const g of plan.groups) { const it = g.items.find(x => x.key === key); if (it) { packSyncPush(it); return; } }\n}\nfunction packQueue(payload) {\n  packSyncQ = packSyncQ.filter(x => x.key !== payload.key || x.worker !== payload.worker);\n  packSyncQ.push(payload);\n  storeSet('packSyncQ', packSyncQ);\n  packFlushQueue();\n}\nasync function packFlushQueue() {\n  if (packSyncBusy || !packSyncReady() || !packSyncQ.length) return;\n  packSyncBusy = true;\n  try {\n    while (packSyncQ.length) {\n      const p = packSyncQ[0];\n      const r = await fetch(packApiUrl('&action=put&d=' + encodeURIComponent(JSON.stringify(p))), { cache: 'no-store' });\n      const j = await r.json();\n      if (j && j.error) throw new Error(j.error);\n      packSyncQ.shift();\n      await storeSet('packSyncQ', packSyncQ);\n      packSyncErr = '';\n    }\n  } catch (e) {\n    packSyncErr = '공유 올리기 실패 - 신호가 잡히면 자동으로 다시 올립니다.';\n  }\n  packSyncBusy = false;\n  packUpdateSyncLine();\n}\nasync function packPull(render, manual) {\n  if (!packSyncReady()) return;\n  await packFlushQueue();\n  let any = false, fail = false;\n  for (const mode of ['out', 'in']) {\n    const plan = packPlans[mode];\n    if (!plan) continue;\n    const ymd = packYmd(plan.date);\n    if (!ymd) continue;\n    try {\n      const r = await fetch(packApiUrl('&action=list&mode=' + mode + '&date=' + ymd), { cache: 'no-store' });\n      const j = await r.json();\n      if (j && j.error) throw new Error(j.error);\n      const map = {};\n      (j.rows || []).forEach(row => { (map[row.key] = map[row.key] || []).push(row); });\n      packShared[mode] = map; any = true;\n    } catch (e) { fail = true; }\n  }\n  if (any) { packSyncAt = new Date().toTimeString().slice(0, 5); if (!fail) packSyncErr = ''; }\n  if (fail) packSyncErr = '다른 사람 진행 상태를 받지 못했습니다.';\n  if (render && packView !== 'item') packRender();\n  else packUpdateSyncLine();\n  if (manual && !any && !fail) packStatus('받을 자료가 아직 없습니다.');\n}\nfunction packSyncLine() {\n  if (!packSyncReady()) return '공유 꺼짐 (웹앱 설정 필요)';\n  const q = packSyncQ.length ? ` · 올리기 대기 ${packSyncQ.length}건` : '';\n  return `작업자 <b>${pkEsc(packWorker || '미입력')}<\/b> · 공유 ${packSyncAt ? '갱신 ' + packSyncAt : '대기'}${q}${packSyncErr ? '<br><span class=\"error\">' + pkEsc(packSyncErr) + '<\/span>' : ''}`;\n}\nfunction packUpdateSyncLine() {\n  document.querySelectorAll('#packPanel .pk-syncline').forEach(el => { el.innerHTML = packSyncLine(); });\n}\nfunction packStartSync() {\n  packStopSync();\n  packPull(true);\n  packSyncTimer = setInterval(() => { if (document.visibilityState !== 'hidden') packPull(true); }, 45000);\n}\nfunction packStopSync() { if (packSyncTimer) { clearInterval(packSyncTimer); packSyncTimer = null; } }\nasync function packSetWorker(v) {\n  packWorker = String(v || '').trim();\n  await storeSet('packWorker', packWorker);\n  packUpdateSyncLine();\n}\n\n// =====================================================================\n//  저장 안정성 : 저장소 보호 요청, 사용량 표시, 백업/복구\n// =====================================================================\nasync function packStorageRefresh(askPersist) {\n  try {\n    if (!navigator.storage) return;\n    let persisted = navigator.storage.persisted ? await navigator.storage.persisted() : false;\n    if (!persisted && askPersist && navigator.storage.persist) { try { persisted = await navigator.storage.persist(); } catch (e) {} }\n    let usage = 0, quota = 0;\n    if (navigator.storage.estimate) { const e = await navigator.storage.estimate(); usage = e.usage || 0; quota = e.quota || 0; }\n    packStorage = { persisted, usage, quota };\n    if (!packMode) { const el = document.getElementById('pkStorage'); if (el) el.innerHTML = packStorageHtml(); }\n  } catch (e) {}\n}\nfunction packMB(n) { return n >= 1073741824 ? (n / 1073741824).toFixed(1) + 'GB' : Math.round(n / 1048576) + 'MB'; }\nfunction packStorageHtml() {\n  const st = packStorage;\n  if (!st) return '저장소 상태 확인 중...';\n  const low = st.quota && (st.quota - st.usage) < 300 * 1048576;\n  const lb = packLastBackup ? '마지막 백업 ' + pkEsc(packLastBackup) : '백업한 적 없음';\n  return `저장소 <b>${st.persisted ? '보호됨' : '보호 안 됨'}<\/b> · 사용 ${packMB(st.usage)} / 여유 ${packMB(Math.max(0, st.quota - st.usage))} · ${lb}` +\n    (!st.persisted ? '<br><span class=\"error\">앱으로 설치하면 폰이 임의로 지우지 않습니다. (크롬 메뉴 → 홈 화면에 추가/앱 설치)<\/span>' : '') +\n    (low ? '<br><span class=\"error\">남은 용량이 적습니다. 다운로드한 사진을 정리하세요.<\/span>' : '');\n}\nasync function packBackup() {\n  await exportFullBackup();\n  packLastBackup = new Date().toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });\n  await storeSet('packLastBackup', packLastBackup);\n  const el = document.getElementById('pkStorage'); if (el) el.innerHTML = packStorageHtml();\n  const z = document.getElementById('zipStatus'); packStatus(z ? z.textContent : '백업 파일을 받았습니다.');\n}\nfunction packRestore() { document.getElementById('backupImportInput').click(); }\n\nrenderQtyThumbs();\n<\/script>\n<\/body>\n<\/html>\n" }
  };
  APPS.packing = { title: '패킹 연동 입출고', bar: '#0f6e7d', alias: 'shipping' };

  var menuEl = document.getElementById('menu');
  var hostEl = document.getElementById('host');
  var barEl = document.getElementById('bar');
  var barTitleEl = document.getElementById('barTitle');
  var framesEl = document.getElementById('frames');
  var frames = {};

  /* 뒤로 가기 버튼(하드웨어)용 기록. 실패해도 화면 전환에는 영향 없음 */
  var armed = false; // 기록 항목을 이미 하나 추가했는지 (최대 1개만 추가)
  function markApp(id) {
    try {
      if (armed) history.replaceState({ app: id }, '');
      else { history.pushState({ app: id }, ''); armed = true; }
    } catch (e) {}
  }
  function markMenu() {
    try { if (armed) history.replaceState({ menu: true }, ''); } catch (e) {}
  }

  function showMenu() {
    Object.keys(frames).forEach(function (k) { frames[k].hidden = true; });
    hostEl.hidden = true;
    menuEl.hidden = false;
    document.title = '재고 실사 · 입출고';
  }

  /* 프레임 안의 함수가 준비되면 호출 (프레임이 처음 만들어지는 중이어도 안전) */
  function callWhenReady(f, fn) {
    var tries = 0;
    (function tick() {
      var w = null;
      try { w = f.contentWindow; } catch (e) {}
      if (w && typeof w[fn] === 'function') { try { w[fn](); } catch (e) {} return; }
      if (++tries < 300) setTimeout(tick, 100);
    })();
  }

  /* 초기화: 저장된 작업 자료를 모두 지우고, 웹앱 주소·비밀번호만 남긴다 */
  function resetAll() {
    if (!confirm('모든 저장 자료(재고 실사, 입출고 이력·임시저장·사진, 받아 둔 자료)를 지웁니다.\n저장된 웹앱 주소와 비밀번호는 남습니다.\n\n초기화할까요?')) return;
    var keep = ['shipping_v1:packUrl', 'shipping_v1:packKey'], kept = {};
    try {
      keep.forEach(function (k) { var v = localStorage.getItem(k); if (v !== null) kept[k] = v; });
      localStorage.clear();
      Object.keys(kept).forEach(function (k) { localStorage.setItem(k, kept[k]); });
    } catch (e) {}
    try { framesEl.innerHTML = ''; } catch (e) {}
    var pending = 2, done = false;
    function fin() { if (done) return; done = true; location.href = location.pathname; }
    function one() { if (--pending <= 0) fin(); }
    ['shipping_photos_v1', 'stockPhotosDB'].forEach(function (n) {
      try {
        var r = indexedDB.deleteDatabase(n);
        r.onsuccess = r.onerror = r.onblocked = one;
      } catch (e) { one(); }
    });
    setTimeout(fin, 2000);
  }
  document.getElementById('resetBtn').addEventListener('click', resetAll);

  function openApp(id, push) {
    var app = APPS[id];
    if (!app) return;
    var real = app.alias || id;
    var src = APPS[real];
    if (!frames[real]) {
      var f = document.createElement('iframe');
      f.title = src.title;
      f.setAttribute('allow', 'camera; clipboard-read; clipboard-write; fullscreen');
      f.srcdoc = src.html;
      framesEl.appendChild(f);
      frames[real] = f;
      Array.prototype.forEach.call(document.querySelectorAll('.pick'), function (c) {
        var a = APPS[c.getAttribute('data-app')];
        if (a && (a.alias || c.getAttribute('data-app')) === real) c.classList.add('is-live');
      });
    }
    Object.keys(frames).forEach(function (k) { frames[k].hidden = (k !== real); });
    barEl.style.setProperty('--bar', app.bar);
    barTitleEl.textContent = app.title;
    document.title = app.title;
    menuEl.hidden = true;
    hostEl.hidden = false;
    if (real === 'shipping') callWhenReady(frames[real], id === 'packing' ? 'openPackPanel' : 'closePackPanel');
    if (push) markApp(id);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.pick'), function (btn) {
    btn.addEventListener('click', function () { openApp(btn.getAttribute('data-app'), true); });
  });

  document.getElementById('back').addEventListener('click', function () {
    showMenu();
    markMenu();
  });

  /* 안드로이드 뒤로 가기 버튼: 페이지가 닫히지 않고 메뉴로 돌아옴 */
  window.addEventListener('popstate', function (e) {
    var s = e.state;
    if (s && s.app) { armed = true; openApp(s.app, false); }
    else { armed = !!(s && s.menu); showMenu(); }
  });

  /* 주소 뒤에 #inventory, #shipping, #packing 을 붙이면 바로 해당 프로그램으로 시작 */
  var start = location.hash.replace('#', '');
  try { history.replaceState({ root: true }, ''); } catch (e) {}
  if (APPS[start]) openApp(start, true);
})();
</script>
<div id="updToast" style="display:none;position:fixed;left:12px;right:12px;bottom:14px;z-index:99999;background:#0f6e7d;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 4px 16px rgba(0,0,0,.35);font-size:15px;align-items:center;gap:10px;">
  <span style="flex:1">새 버전이 있습니다.</span>
  <button id="updBtn" style="background:#fff;color:#0f6e7d;border:0;border-radius:8px;padding:8px 14px;font-weight:700;font-size:15px;">지금 적용</button>
</div>
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  var reloading = false;
  function showToast(reg) {
    var t = document.getElementById('updToast'); if (!t) return;
    t.style.display = 'flex';
    document.getElementById('updBtn').onclick = function () {
      if (reg.waiting) reg.waiting.postMessage({ type: 'skip' });
    };
  }
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) return; reloading = true; location.reload();
  });
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) showToast(reg);
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing; if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showToast(reg);
        });
      });
      setInterval(function () { try { reg.update(); } catch (e) {} }, 30 * 60 * 1000);
      navigator.serviceWorker.ready.then(function (r) { if (navigator.onLine && r.active) r.active.postMessage({ type: 'warm' }); });
    }).catch(function () {});
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
